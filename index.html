<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEIC形式 英語トレーナー</title>
  <style>
    :root {
      --bg0: #f5f7ff;
      --bg1: #eef2ff;
      --card: #ffffff;
      --txt: #0f172a;
      --muted: #64748b;
      --line: #dbe3ff;
      --pri: #4f46e5;
      --pri2: #2563eb;
      --ok: #15803d;
      --okbg: #ecfdf3;
      --ng: #b91c1c;
      --ngbg: #fef2f2;
      --warn: #92400e;
      --warnbg: #fff7ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--txt);
      font-family: "Segoe UI", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.2), transparent 30%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height: 100vh;
    }

    .app { max-width: 1024px; margin: 0 auto; padding: 16px; }
    .shell { background: rgba(255,255,255,.8); backdrop-filter: blur(8px); border-radius: 24px; box-shadow: 0 12px 34px rgba(23,37,84,.12); overflow: hidden; }
    .header { background: linear-gradient(135deg, #1e3a8a, #4f46e5 60%, #2563eb); color: #fff; padding: 22px 20px; }
    .content { padding: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .grid { display: grid; gap: 10px; }
    .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .sum { border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; background: linear-gradient(180deg, #fff, #f8faff); }
    .sum strong { display: block; font-size: 1.2rem; }
    button { width: 100%; border: none; border-radius: 999px; padding: 12px 14px; font-weight: 700; cursor: pointer; }
    .p { background: linear-gradient(135deg, var(--pri), var(--pri2)); color: #fff; }
    .g { background: #edf2ff; color: #243b8a; }
    .d { background: #ef4444; color: #fff; }
    .badge { display: inline-block; border-radius: 999px; padding: 4px 10px; margin: 0 6px 6px 0; font-size: .8rem; font-weight: 700; }
    .bp { background: #dbeafe; }
    .bd { background: #ede9fe; }
    .bt { background: #e0f2fe; }
    .bar { height: 10px; background: #dbeafe; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg, #2563eb, #4f46e5); }
    .passage { white-space: pre-wrap; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #f8fbff; }
    .choices { display: grid; gap: 8px; }
    .choice { text-align: left; border: 2px solid var(--line); background: #fff; }
    .choice.sel { border-color: #2563eb; background: #eff6ff; }
    .choice.ok { border-color: var(--ok); background: var(--okbg); }
    .choice.ng { border-color: var(--ng); background: var(--ngbg); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1 1 180px; }
    .muted { color: var(--muted); font-size: .88rem; }
    .msg { padding: 8px; border-radius: 8px; }
    .okm { background: var(--okbg); color: var(--ok); }
    .ngm { background: var(--ngbg); color: var(--ng); }
    .warnm { background: var(--warnbg); color: var(--warn); }
    .session-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #fbfcff; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 280px; border-radius: 10px; border: 1px solid var(--line); padding: 10px; }
    @media (max-width: 760px) { .g2,.g4{ grid-template-columns: 1fr; } }
  </style>
</head>

      <div id="app" class="content"></div>
    </section>

const HISTORY_KEY = 'toeicStyleEnglishTrainerHistory';
const MISTAKES_KEY = 'toeicStyleEnglishTrainerMistakes';
const SETTINGS_KEY = 'toeicStyleEnglishTrainerSettings';
const SESSIONS_KEY = 'toeicStyleEnglishTrainerSessions';

const defaultSettings = { autoShowExplanation: true, autoNext: false, autoNextDelayMs: 900 };

function escapeHtml(text) {
  return String(text ?? '').replace(/[&<>'"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
}
function pad2(n){return String(Math.max(0,Number(n)||0)).padStart(2,'0');}
function formatDuration(seconds){const sec=Math.max(0,Math.floor(Number(seconds)||0));if(sec<60)return `${sec}秒`;const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h>0)return `${h}時間${pad2(m)}分${pad2(s)}秒`;return `${m}分${pad2(s)}秒`; }
function formatDateTime(iso){const d=new Date(iso);if(Number.isNaN(d.getTime()))return '-';return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}

const QUESTION_DATA = [
  { id:'P5-001',part:5,category:'grammar',difficulty:'easy',tags:['文法','接続詞','業務連絡文'],passage:'',question:'The invoice for client case 1 will not be processed _____ it includes a purchase order number.',choices:['unless','because','while','so'],answer:0,explanation:'条件を表す unless が最適です。because だと理由、while だと同時進行になり意味が変わります。文脈から必要な論理関係を選ぶのがポイントです。' },
  { id:'P5-002',part:5,category:'vocabulary',difficulty:'easy',tags:['語彙','品詞','ビジネス表現'],passage:'',question:'The marketing team launched campaign 2 to increase brand _____.',choices:['awareness','aware','awaring','awares'],answer:0,explanation:'increase の後ろには名詞が必要なので awareness が正解です。aware は形容詞で文法的に合いません。語彙問題でも品詞確認が基本です。' },
  { id:'P5-003',part:5,category:'preposition',difficulty:'easy',tags:['前置詞','熟語','業務連絡文'],passage:'',question:'All project files for batch 3 must be uploaded _____ Friday noon.',choices:['by','at','for','during'],answer:0,explanation:'期限には by を使います。at は時刻一点、for は期間、during は期間中を表すため文意に合いません。期限表現を整理しましょう。' },
  { id:'P5-004',part:5,category:'conjunction',difficulty:'easy',tags:['接続詞','文法','メール文'],passage:'',question:'Please notify the front desk _____ you expect a late delivery for order 4.',choices:['if','unless','despite','during'],answer:0,explanation:'if は条件節を導けます。unless は意味が逆、despite と during は節を導けないため不適切です。接続詞と前置詞の違いを意識しましょう。' },
  { id:'P5-005',part:5,category:'parts-of-speech',difficulty:'easy',tags:['品詞','文法','語彙'],passage:'',question:'The new support policy for team 5 is simple and highly _____.',choices:['effectively','effective','effect','effectiveness'],answer:1,explanation:'be動詞の後ろで主語を説明する形容詞 effective が必要です。effectively は副詞なのでこの位置では使えません。文型から品詞を判断しましょう。' },
  { id:'P5-006',part:5,category:'tense',difficulty:'easy',tags:['時制','文法','業務連絡文'],passage:'',question:'By the time the client joined meeting room 6, we _____ the draft proposal.',choices:['finish','finished','had finished','are finishing'],answer:2,explanation:'過去の時点より前に完了した動作なので過去完了 had finished が正解です。finished だけでは前後関係が明確になりません。時制は基準時を決めて判断します。' },

  { id:'P5-041',part:5,category:'parts-of-speech',difficulty:'hard',tags:['品詞','文法','語彙'],passage:'',question:'The new support policy for team 41 is simple and highly _____.',choices:['effectively','effective','effect','effectiveness'],answer:1,explanation:'be動詞の後ろで主語を説明する形容詞 effective が必要です。effectively は副詞なのでこの位置では使えません。文型から品詞を判断しましょう。' },
  { id:'P5-042',part:5,category:'tense',difficulty:'hard',tags:['時制','文法','業務連絡文'],passage:'',question:'By the time the client joined meeting room 42, we _____ the draft proposal.',choices:['finish','finished','had finished','are finishing'],answer:2,explanation:'過去の時点より前に完了した動作なので過去完了 had finished が正解です。finished だけでは前後関係が明確になりません。時制は基準時を決めて判断します。' },
  { id:'P5-043',part:5,category:'relative-pronoun',difficulty:'hard',tags:['関係代名詞','文法','読解'],passage:'',question:'The consultant _____ prepared revision 43 will attend the client call.',choices:['which','who','whom','whose'],answer:1,explanation:'先行詞が人で、節内で主語の役割なので who が正解です。whom は目的格、which は物に使います。関係代名詞は先行詞と格で選びます。' },
  { id:'P5-044',part:5,category:'infinitive-gerund',difficulty:'hard',tags:['不定詞','動名詞','文法'],passage:'',question:'We decided _____ contract option 44 after reviewing legal advice.',choices:['renew','to renew','renewing','renewed'],answer:1,explanation:'decide は to不定詞を取るため to renew が適切です。renewing や renewed はこの語法では使えません。動詞ごとの後続語法を覚えることが重要です。' },
  { id:'P5-045',part:5,category:'comparative',difficulty:'hard',tags:['比較','文法','業務連絡文'],passage:'',question:'The operating cost of unit 45 was _____ than we expected.',choices:['low','lower','lowest','the lower'],answer:1,explanation:'than があるため比較級 lower が必要です。low は原級、lowest は最上級で不適切です。比較表現は than とセットで確認しましょう。' },
  { id:'P5-046',part:5,category:'passive',difficulty:'hard',tags:['受動態','文法','業務連絡文'],passage:'',question:'All temporary badges for event 46 must be _____ at reception.',choices:['return','returned','returning','to return'],answer:1,explanation:'must be の後ろは過去分詞で受動態を作るので returned が正解です。原形 return では文法的に成立しません。助動詞と受動態の形を確認しましょう。' },
  { id:'P5-047',part:5,category:'modal',difficulty:'hard',tags:['助動詞','文法','ビジネス表現'],passage:'',question:'Employees _____ submit travel request form 47 at least five days in advance.',choices:['should','might','would','could'],answer:0,explanation:'社内ルールの推奨には should が最も自然です。might や could は可能性・能力の意味が強く、規程文として弱くなります。助動詞のニュアンス差を押さえましょう。' },
  { id:'P5-048',part:5,category:'business-expression',difficulty:'hard',tags:['ビジネス表現','熟語','業務連絡文'],passage:'',question:'Please _____ me posted on shipping status update 48.',choices:['keep','let','set','take'],answer:0,explanation:'keep 人 posted on ... は定番のビジネス表現です。他の動詞ではこの慣用句にならず不自然です。熟語はまとまりで覚えると実務で使いやすくなります。' },
  { id:'P5-049',part:5,category:'grammar',difficulty:'hard',tags:['文法','接続詞','業務連絡文'],passage:'',question:'The invoice for client case 49 will not be processed _____ it includes a purchase order number.',choices:['unless','because','while','so'],answer:0,explanation:'条件を表す unless が最適です。because だと理由、while だと同時進行になり意味が変わります。文脈から必要な論理関係を選ぶのがポイントです。' },
  { id:'P5-050',part:5,category:'vocabulary',difficulty:'hard',tags:['語彙','品詞','ビジネス表現'],passage:'',question:'The marketing team launched campaign 50 to increase brand _____.',choices:['awareness','aware','awaring','awares'],answer:0,explanation:'increase の後ろには名詞が必要なので awareness が正解です。aware は形容詞で文法的に合いません。語彙問題でも品詞確認が基本です。' },
  { id:'P6-001',part:6,category:'email',difficulty:'easy',tags:['メール文','読解','文法'],passage:'Email Update 1\n\nThank you for your cooperation this month. _____ the operations team will apply the revised workflow from next Monday.\n\nPlease review the details and reply by 5 p.m. Friday.\n\nRegards,\nOperations Office',question:'空欄に最も適切な語句を選んでください。',choices:['In addition,', 'However,', 'For example,', 'As a result,'],answer:1,explanation:'前文と逆接関係があるため However, が適切です。 他の選択肢は接続関係がずれるため、段落全体の流れを見て判断することが重要です。' },

function inferCategory(q){
  if (q.part === 5) {
    if ((q.tags || []).includes('前置詞')) return 'preposition';
    if ((q.tags || []).includes('接続詞')) return 'conjunction';
    if ((q.tags || []).includes('品詞')) return 'parts-of-speech';
    if ((q.tags || []).includes('語彙')) return 'vocabulary';
    return 'grammar';
  }
  if ((q.tags || []).includes('メール文')) return 'email';
  if ((q.tags || []).includes('お知らせ文')) return 'notice';
  if ((q.tags || []).includes('広告文')) return 'advertisement';
  if ((q.tags || []).includes('スケジュール文')) return 'schedule';
  if ((q.tags || []).includes('業務連絡文') || (q.tags || []).includes('社内連絡文')) return 'business';
  return 'reading';
}
QUESTION_DATA.forEach((q)=>{ if(!q.category) q.category=inferCategory(q); });

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function calculateOverallStats(){const h=getHistory();const c=h.filter((x)=>x.isCorrect).length;return{total:h.length,correct:c,rate:h.length?Math.round(c/h.length*100):0,mistakes:getMistakes().length};}

function calculateDifficultyStats(){return['easy','medium','hard','unknown'].map((d)=>{const r=getHistory().filter((x)=>x.difficulty===d);const c=r.filter((x)=>x.isCorrect).length;return{difficulty:d,total:r.length,correct:c,rate:r.length?Math.round(c/r.length*100):0};});}

function getQuestionById(questionId){return qMap[String(questionId)]||null;}
function fillBlankText(text,choice){
  const src=String(text||'');
  if(!src)return '';
  if(choice===null||choice===undefined)return src;
  const token=String(choice);
  const blankRe=/(_____|____|___|\[blank\]|（空欄）|空欄)/;
  return blankRe.test(src)?src.replace(blankRe,token):src;
}
function getAnswerDetail(record){
  const q=getQuestionById(record&&record.questionId);
  const selectedIndex=Number.isInteger(record&&record.selectedIndex)?record.selectedIndex:null;
  const correctIndex=Number.isInteger(record&&record.correctIndex)?record.correctIndex:(q&&Number.isInteger(q.answer)?q.answer:null);
  const selectedChoice=(q&&Array.isArray(q.choices)&&selectedIndex!==null&&selectedIndex>=0&&selectedIndex<q.choices.length)?q.choices[selectedIndex]:null;
  const correctChoice=(q&&Array.isArray(q.choices)&&correctIndex!==null&&correctIndex>=0&&correctIndex<q.choices.length)?q.choices[correctIndex]:null;
  const question=(q&&q.question)||'';
  const passage=(q&&q.passage)||'';
  const sentenceWithMistake=fillBlankText(question,selectedChoice);
  const sentenceWithCorrectAnswer=fillBlankText(question,correctChoice);
  return {questionId:String((record&&record.questionId)||'unknown'),part:(record&&record.part)||((q&&q.part)||null),difficulty:(record&&record.difficulty)||((q&&q.difficulty)||'unknown'),tags:Array.isArray(record&&record.tags)?record.tags:((q&&q.tags)||[]),category:(q&&q.category)||null,question,passage,choices:(q&&Array.isArray(q.choices))?q.choices:[],selectedIndex,selectedChoice,correctIndex,correctChoice,mistakenWord:selectedChoice,correctWord:correctChoice,sentenceWithMistake,sentenceWithCorrectAnswer,isCorrect:Boolean(record&&record.isCorrect),explanation:(q&&q.explanation)||'',answeredAt:(record&&record.answeredAt)||null};
}
function getMistakenWordInfo(answerDetail){
  if(!answerDetail||typeof answerDetail!=='object')return null;
  const selectedIndex=Number.isInteger(answerDetail.selectedIndex)?answerDetail.selectedIndex:null;
  const correctIndex=Number.isInteger(answerDetail.correctIndex)?answerDetail.correctIndex:null;
  const selectedChoice=('selectedChoice' in answerDetail)?answerDetail.selectedChoice:null;
  const correctChoice=('correctChoice' in answerDetail)?answerDetail.correctChoice:null;
  const mistakenWord=selectedChoice===null?null:selectedChoice;
  const correctWord=correctChoice===null?null:correctChoice;
  return {
    questionId:String(answerDetail.questionId||'unknown'),
    part:answerDetail.part??null,
    category:answerDetail.category||null,
    tags:Array.isArray(answerDetail.tags)?answerDetail.tags:[],
    difficulty:answerDetail.difficulty||'unknown',
    mistakenWord,
    correctWord,
    selectedIndex,
    correctIndex,
    selectedLabel:selectedIndex===null?null:String.fromCharCode(65+selectedIndex),
    correctLabel:correctIndex===null?null:String.fromCharCode(65+correctIndex),
    selectedChoice,
    correctChoice,
    originalQuestion:answerDetail.question||'',
    sentenceWithMistake:fillBlankText(answerDetail.question||'',selectedChoice),
    sentenceWithCorrectAnswer:fillBlankText(answerDetail.question||'',correctChoice),
    passageWithMistake:fillBlankText(answerDetail.passage||'',selectedChoice),
    passageWithCorrectAnswer:fillBlankText(answerDetail.passage||'',correctChoice),
    explanation:answerDetail.explanation||'',
    answeredAt:formatDateTime(answerDetail.answeredAt)
  };
}
function getMistakenWordSummary(limit=50){

}
function getWrongWordPatternSummary(){
  const rows=getMistakenWordSummary(200);
  const out={totalWrongAnswers:rows.length,mistakenWords:{},correctWords:{},mistakenToCorrectPairs:{},byCategory:{},byTag:{}};
  const add=(obj,key)=>{const k=String(key);obj[k]=(obj[k]||0)+1;};
  rows.forEach((x)=>{
    const mistaken=x.selectedChoice===null?'未選択':String(x.selectedChoice);
    const correct=x.correctChoice===null?'不明':String(x.correctChoice);
    add(out.mistakenWords,mistaken);
    add(out.correctWords,correct);
    add(out.mistakenToCorrectPairs,`${mistaken} => ${correct}`);
    add(out.byCategory,x.category||'unknown');
    (Array.isArray(x.tags)?x.tags:[]).forEach((t)=>add(out.byTag,t||'unknown'));
  });
  return out;
}
function getQuestionPerformanceStats(){
  const map={};
  getHistory().forEach((r)=>{
    const d=getAnswerDetail(r);
    if(!map[d.questionId]) map[d.questionId]={questionId:d.questionId,part:d.part,difficulty:d.difficulty,tags:d.tags,category:d.category,question:d.question,passage:d.passage,choices:d.choices,explanation:d.explanation,totalAttempts:0,correctCount:0,wrongCount:0,accuracy:0,lastAnsweredAt:null};
    const x=map[d.questionId];
    x.totalAttempts++; if(d.isCorrect)x.correctCount++; else x.wrongCount++;
    if(!x.lastAnsweredAt||new Date(d.answeredAt)>new Date(x.lastAnsweredAt))x.lastAnsweredAt=d.answeredAt;
    x.accuracy=x.totalAttempts?Math.round(x.correctCount/x.totalAttempts*100):0;
  });
  return Object.values(map);
}

lines.push('','回答形式：','1. 結論','2. 苦手パターン','3. 得意パターン','4. 間違い方の癖','5. 優先して復習すべき内容','6. 追加するとよい練習問題','7. 明日やること','8. 1週間の学習計画');
return lines.join('\n');}
function aiOptionsFromUI(){const keys=['summary','part','tags','diff','wrong','correctDetails','weakDetails','strongDetails','mistakeSummary','strengthSummary','choicePattern','mistakenWordList','wrongWordPattern','includeFilledSentences','includeQp','includeChoices','includeExp','recent10','recent50','completed','abandoned','unanswered','weak','time','request'];const o={};keys.forEach((k)=>{o[k]=Boolean(document.getElementById('cb_'+k)?.checked);});const num=(id,def)=>{const el=document.getElementById(id);const v=Number(el&&el.value);if(!Number.isInteger(v)||v<1||v>100){if(el)el.value=String(def);return def;}return v;};o.wrongLimit=num('wrongLimit',20);o.correctLimit=num('correctLimit',10);o.weakLimit=num('weakLimit',20);o.strongLimit=num('strongLimit',10);return o;}
function statusJa(s){return s==='completed'?'完了':(s==='abandoned'?'途中終了':'進行中');}
function start(mode){clearTimeout(state.timer);const qs=getByMode(mode);if(!qs.length){state.screen='empty';state.emptyTitle=mode==='mistake'?'苦手復習':'対象問題がありません';state.emptyBody=mode==='mistake'?'復習対象はありません。間違えた問題がここに表示されます。':'対象問題がありません。';return render();}state.questions=qs;state.i=0;state.selected=null;state.answered=false;state.result=false;state.quizMessage='';state.showExplanation=state.settings.autoShowExplanation;state.sessionResults=[];const now=new Date().toISOString();state.session={sessionId:`s_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,mode,part:mode.startsWith('part')?Number(mode.slice(4)):(mode==='all'?'all':null),startedAt:now,endedAt:null,status:'in_progress',totalQuestions:qs.length,answeredCount:0,correctCount:0,wrongCount:0,unansweredCount:qs.length,accuracy:0,questionIds:qs.map((q)=>q.id),answeredQuestionIds:[],unfinishedQuestionIds:qs.map((q)=>q.id),durationSeconds:0,resultRecords:[]};const s=getSessions();s.unshift(state.session);saveSessions(s);state.screen='quiz';render();}
function updateSessionStore(){const s=getSessions();const i=s.findIndex((x)=>x.sessionId===state.session.sessionId);if(i>=0)s[i]=state.session;else s.unshift(state.session);saveSessions(s);}
function finalizeSession(status){if(!state.session)return;state.session.status=status;state.session.endedAt=new Date().toISOString();state.session.unansweredCount=Math.max(0,state.session.totalQuestions-state.session.answeredCount);state.session.accuracy=state.session.answeredCount?Math.round(state.session.correctCount/state.session.answeredCount*100):0;state.session.durationSeconds=Math.max(0,Math.round((Date.parse(state.session.endedAt)-Date.parse(state.session.startedAt))/1000));updateSessionStore();}
function answer(){if(state.screen!=='quiz'||state.answered)return;if(state.selected===null){state.quizMessage='選択肢を選んでから回答してください。';render();return;}const q=state.questions[state.i];const ok=state.selected===q.answer;state.answered=true;state.result=ok;state.quizMessage='';const h=getHistory();h.push({questionId:q.id,part:q.part,selectedIndex:state.selected,correctIndex:q.answer,isCorrect:ok,answeredAt:new Date().toISOString(),difficulty:q.difficulty,tags:q.tags,mode:state.session.mode});saveHistory(h);const m=new Set(getMistakes());if(ok)m.delete(q.id);else m.add(q.id);saveMistakes([...m]);state.session.answeredCount++;if(ok)state.session.correctCount++;else state.session.wrongCount++;state.session.answeredQuestionIds.push(q.id);state.session.unfinishedQuestionIds=state.session.questionIds.filter((id)=>!state.session.answeredQuestionIds.includes(id));state.session.resultRecords.push({questionId:q.id,part:q.part,isCorrect:ok});state.sessionResults.push({questionId:q.id,part:q.part,isCorrect:ok});updateSessionStore();if(state.settings.autoNext){clearTimeout(state.timer);state.timer=setTimeout(()=>nextQ(true),state.settings.autoNextDelayMs);}render();setTimeout(()=>document.getElementById('nextBtn')?.focus(),20);}
function nextQ(fromTimer=false){if(!state.answered)return;if(!fromTimer)clearTimeout(state.timer);if(state.i<state.questions.length-1){state.i++;state.selected=null;state.answered=false;state.quizMessage='';state.showExplanation=state.settings.autoShowExplanation;render();return;}clearTimeout(state.timer);finalizeSession('completed');state.screen='result';render();}
function backHome(abandon=true){clearTimeout(state.timer);if(abandon&&state.screen==='quiz'&&state.session&&state.session.status==='in_progress')finalizeSession('abandoned');state.screen='home';render();}
function resetHistory(){if(!confirm('学習履歴・苦手問題・セッション記録をすべて削除します。よろしいですか？'))return;saveHistory([]);saveMistakes([]);saveSessions([]);state.aiMessage='履歴をリセットしました';render();}
function getDefaultAiPromptOptions(){return{summary:true,part:true,tags:true,diff:true,wrong:true,correctDetails:true,weakDetails:true,strongDetails:true,mistakeSummary:true,strengthSummary:true,choicePattern:true,mistakenWordList:true,wrongWordPattern:true,includeFilledSentences:true,includeQp:true,includeChoices:true,includeExp:true,recent10:false,recent50:false,completed:false,abandoned:false,unanswered:false,weak:false,time:true,request:true,wrongLimit:20,correctLimit:10,weakLimit:20,strongLimit:10};}
function renderAiPromptBuilder(){
const d=getDefaultAiPromptOptions();
return `<div class='card'><h2>AI分析プロンプト作成</h2>
<h3>1. 基本統計</h3><label><input type='checkbox' id='cb_summary' ${d.summary?'checked':''}>全体サマリー</label><label><input type='checkbox' id='cb_part' ${d.part?'checked':''}>Part別正答率</label><label><input type='checkbox' id='cb_tags' ${d.tags?'checked':''}>タグ別正答率</label><label><input type='checkbox' id='cb_diff' ${d.diff?'checked':''}>難易度別正答率</label>

<div class='grid g2'><label>間違えた問題詳細の件数<input type='number' id='wrongLimit' min='1' max='100' value='20'></label><label>正解した問題詳細の件数<input type='number' id='correctLimit' min='1' max='100' value='10'></label><label>苦手問題詳細の件数<input type='number' id='weakLimit' min='1' max='100' value='20'></label><label>得意問題詳細の件数<input type='number' id='strongLimit' min='1' max='100' value='10'></label></div>
	<h3>3. 傾向分析</h3><label><input type='checkbox' id='cb_mistakeSummary' ${d.mistakeSummary?'checked':''}>間違い傾向サマリー</label><label><input type='checkbox' id='cb_strengthSummary' ${d.strengthSummary?'checked':''}>得意傾向サマリー</label><label><input type='checkbox' id='cb_choicePattern' ${d.choicePattern?'checked':''}>選択肢の誤答パターン</label><label><input type='checkbox' id='cb_mistakenWordList' ${d.mistakenWordList?'checked':''}>間違えた単語・正解単語一覧</label><label><input type='checkbox' id='cb_wrongWordPattern' ${d.wrongWordPattern?'checked':''}>間違えた単語パターン</label><label><input type='checkbox' id='cb_includeFilledSentences' ${d.includeFilledSentences?'checked':''}>誤答文と正解文を含める</label><p class='muted'>「間違えた単語・正解単語一覧」をONにすると、選んだ選択肢と正解選択肢を比較して、どの単語・表現を間違えたかをAIに渡せます。</p>

<div class='row' style='margin-top:10px;'><button class='p' onclick='genPrompt()'>再生成</button><button class='g' onclick='copyAiPrompt()'>プロンプトをコピー</button><button class='g' onclick="state.screen='history';render()">学習履歴へ戻る</button><button class='g' onclick='backHome(false)'>ホームへ戻る</button></div><p id='copyMsg' class='muted'>${escapeHtml(state.aiMessage)}</p><textarea id='promptArea'>${escapeHtml(state.aiPromptText)}</textarea></div>`;}
function genPrompt(){const o=aiOptionsFromUI();state.aiPromptText=buildAiPrompt(o);const area=document.getElementById('promptArea');if(area)area.value=state.aiPromptText;state.aiMessage='プロンプトを生成しました';const msg=document.getElementById('copyMsg');if(msg)msg.textContent=state.aiMessage;}
async function copyAiPrompt(){const t=document.getElementById('promptArea');if(!t)return;if(!t.value.trim())genPrompt();try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t.value);}else{t.focus();t.select();if(!document.execCommand('copy'))throw new Error('copy fail');}state.aiMessage='コピーしました';}catch(_){state.aiMessage='コピーできませんでした。手動で選択してコピーしてください';}const msg=document.getElementById('copyMsg');if(msg)msg.textContent=state.aiMessage;}
function render(){const app=document.getElementById('app');const ov=calculateOverallStats();if(state.screen==='home'){const today=calculateTodaySummary();app.innerHTML=`<div class='card'><h2>学習サマリー</h2><div class='grid g4'><div class='sum'><strong>${ov.total}</strong><span>総回答数</span></div><div class='sum'><strong>${ov.rate}%</strong><span>正答率</span></div><div class='sum'><strong>${ov.mistakes}</strong><span>苦手問題</span></div><div class='sum'><strong>${calculateSessionStats().abandoned.length}</strong><span>途中終了</span></div></div></div><div class='card'><h2>今日の学習サマリー</h2><div class='grid g4'><div class='sum'><strong>${today.answers}</strong><span>今日の回答数</span></div><div class='sum'><strong>${today.correct}</strong><span>今日の正解数</span></div><div class='sum'><strong>${today.rate}%</strong><span>今日の正答率</span></div><div class='sum'><strong>${formatDuration(today.timeSec)}</strong><span>今日の学習時間</span></div></div></div><div class='card'><h2>おすすめアクション</h2><div class='passage'>${escapeHtml(getRecommendedAction())}</div></div><div class='card'><h2>演習を開始</h2><div class='grid g2'><button class='p' onclick="start('part5')">Part 5演習</button><button class='p' onclick="start('part6')">Part 6演習</button><button class='p' onclick="start('part7')">Part 7演習</button><button class='p' onclick="start('random')">ランダム演習</button><button class='p' onclick="start('all')">全部モード</button><button class='p' onclick="start('mistake')">苦手復習</button></div><div class='row' style='margin-top:10px;'><button class='g' onclick="state.screen='history';render()">学習履歴</button></div></div>`;return;}
if(state.screen==='empty'){app.innerHTML=`<div class='card'><h2>${escapeHtml(state.emptyTitle)}</h2><p>${escapeHtml(state.emptyBody)}</p><button class='g' onclick='backHome(false)'>ホームへ戻る</button></div>`;return;}
if(state.screen==='quiz'){const q=state.questions[state.i];const ratio=Math.round((state.i+1)/state.questions.length*100);app.innerHTML=`<div class='card'><p>${state.i+1} / ${state.questions.length}</p><div class='bar'><div class='fill' style='width:${ratio}%'></div></div><div style='margin-top:8px'><span class='badge bp'>Part ${escapeHtml(q.part)}</span><span class='badge bd'>${escapeHtml(q.difficulty)}</span>${q.tags.map((t)=>`<span class='badge bt'>${escapeHtml(t)}</span>`).join('')}</div><p><b>${escapeHtml(q.question)}</b></p>${q.passage?`<div class='passage'>${escapeHtml(q.passage)}</div>`:''}<div class='choices'>${q.choices.map((c,idx)=>{let cls='choice';if(state.selected===idx)cls+=' sel';if(state.answered){if(idx===q.answer)cls+=' ok';if(idx===state.selected&&idx!==q.answer)cls+=' ng';}return `<button class='${cls}' ${state.answered?'disabled':''} onclick='state.selected=${idx};state.quizMessage="";render()'>${String.fromCharCode(65+idx)}. ${escapeHtml(c)}</button>`;}).join('')}</div>${state.quizMessage?`<p class='msg warnm'>${escapeHtml(state.quizMessage)}</p>`:''}<div class='row' style='margin-top:10px;'><button class='p' onclick='answer()' ${state.answered?'disabled':''}>回答する (Enter)</button><button class='g' onclick='backHome(true)'>ホームへ戻る (Esc)</button></div>${state.answered?`<p class='msg ${state.result?'okm':'ngm'}'>${state.result?'正解です':'不正解です'}</p><label><input type='checkbox' ${state.showExplanation?'checked':''} onchange='state.showExplanation=this.checked;render()'>解説を表示する</label>${state.showExplanation?`<div class='passage'>${escapeHtml(q.explanation)}</div>`:''}<button id='nextBtn' class='p' onclick='nextQ(false)'>次へ (Enter)</button>`:''}</div><div class='card'><h3>設定</h3><label><input type='checkbox' ${state.settings.autoShowExplanation?'checked':''} onchange='state.settings.autoShowExplanation=this.checked;saveSettings(state.settings)'>解説を自動表示する</label><label><input type='checkbox' ${state.settings.autoNext?'checked':''} onchange='state.setti if(state.screen==='result'){const rec=state.sessionResults;const totalQ=state.session.totalQuestions,answered=state.session.answeredCount,correct=state.session.correctCount,un=Math.max(0,totalQ-answered),rate=answered?Math.round(correct/answered*100):0;const partRows=[5,6,7].map((p)=>{const r=rec.filter((x)=>x.part===p);const c=r.filter((x)=>x.isCorrect).length;return`<p>Part ${p}: ${c} / ${r.length} 正解 ${r.length?Math.round(c/r.length*100):0}%</p>`;}).join('');const wrongRows=rec.filter((x)=>!x.isCorrect).map((x)=>`<li>${escapeHtml(x.questionId)} - ${escapeHtml((qMap[x.questionId]&&qMap[x.questionId].question)||'unknown')}</li>`).join('')||'<li>なし</li>';app.innerHTML=`<div class='card'><h2>結果</h2><p>今回の出題数: ${totalQ}</p><p>今回の回答数: ${answered}</p><p>今回の正解数: ${correct}</p><p>今回の正答率: ${rate}%</p><p>未回答数: ${un}</p><h3>Part別正答率</h3>${partRows}<h3>間違えた問題一覧</h3><ul>${wrongRows}</ul><div class='row'><button class='p' onclick='backHome(false)'>ホームへ戻る</button><button class='g' onclick='start(state.session.mode)'>同じモードでもう一回</button></div></div>`;return;}
if(state.screen==='history'){const p=calculatePartStats(),tag=calculateTagStats(),d=calculateDifficultyStats(),ss=calculateSessionStats();app.innerHTML=`<div class='card'><h2>学習履歴</h2><div class='grid g4'><div class='sum'><strong>${ov.total}</strong><span>総回答</span></div><div class='sum'><strong>${ov.rate}%</strong><span>正答率</span></div><div class='sum'><strong>${ss.completed.length}</strong><span>完了</span></div><div class='sum'><strong>${ss.abandoned.length}</strong><span>途中終了</span></div></div><p>合計学習時間: ${formatDuration(ss.totalSec)} / 平均学習時間: ${formatDuration(ss.avgSec)}</p><h3>Part別正答率</h3>${ov.total===0?'<p class="muted">履歴がまだありません。</p>':p.map((x)=>`<p>Part ${x.part}: ${x.correct}/${x.total} (${x.rate}%)</p>`).join('')}<h3>タグ別正答率 上位/下位</h3>${tag.length===0?'<p class="muted">履歴がまだありません。</p>':`${tag.slice(0,3).map((x)=>`<p>下位 ${escapeHtml(x.tag)}: ${x.rate}%</p>`).join('')}${tag.slice(-3).map((x)=>`<p>上位 ${escapeHtml(x.tag)}: ${x.rate}%</p>`).join('')}`}<h3>難易度別正答率</h3>${ov.total===0?'<p class="muted">履歴がまだありません。</p>':d.map((x)=>`<p>${escapeHtml(x.difficulty)}: ${x.correct}/${x.total} (${x.rate}%)</p>`).join('')}<div class='row'><button class='p' onclick="state.screen='ai';state.aiPromptText=buildAiPrompt(getDefaultAiPromptOptions());render()">AI分析プロンプト作成</button><button class='d' onclick='resetHistory()'>履歴リセット</button><button class='g' onclick='backHome(false)'>ホームへ戻る</button></div></div><div class='card'><h3>直近セッション一覧</h3>${ss.recent.length===0?'<p class="muted">履歴がまだありません。</p>':ss.recent.map((x)=>`<div class='session-card'><p>開始日時: ${escapeHtml(formatDateTime(x.startedAt))}</p><p>モード: ${escapeHtml(x.mode)}</p><p>status: ${escapeHtml(statusJa(x.status))}</p><p>回答済み数 / 全問題数: ${x.answeredCount} / ${x.totalQuestions}</p><p>正答率: ${x.accuracy}%</p><p>未回答数: ${x.unansweredCount}</p><p>学習時間: ${formatDuration(x.durationSeconds)}</p></div>`).join('')}</div>`;return;}
if(state.screen==='ai'){app.innerHTML=renderAiPromptBuilder();setTimeout(genPrompt,0);}}
window.addEventListener('beforeunload',()=>{if(state.screen==='quiz'&&state.session&&state.session.status==='in_progress')finalizeSession('abandoned');});
document.addEventListener('keydown',(e)=>{if(state.screen!=='quiz')return;const m={a:0,b:1,c:2,d:3};const k=e.key.toLowerCase();if(k in m&&!state.answered){state.selected=m[k];state.quizMessage='';render();}if(e.key==='Enter'){e.preventDefault();state.answered?nextQ(false):answer();}if(e.key==='Escape'){e.preventDefault();backHome(true);}});
function initApp(){state.settings=getSettings();state.showExplanation=state.settings.autoShowExplanation;closeStaleSessions();render();}
window.start=start;window.render=render;window.answer=answer;window.nextQ=nextQ;window.backHome=backHome;window.genPrompt=genPrompt;window.copyAiPrompt=copyAiPrompt;window.resetHistory=resetHistory;
initApp();
