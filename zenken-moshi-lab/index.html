function deep(x){return JSON.parse(JSON.stringify(x))};
const encoder=new TextEncoder(),decoder=new TextDecoder();
function b64u(bytes){let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}
function from64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const raw=atob(s+'='.repeat((4-s.length%4)%4));return Uint8Array.from(raw,x=>x.charCodeAt(0))}
function cookieValue(){const found=document.cookie.split('; ').find(p=>p.startsWith(COOKIE_NAME+'='));return found?decodeURIComponent(found.slice(COOKIE_NAME.length+1)):null}
function setLoginCookie(raw){let attributes='; Max-Age='+COOKIE_AGE+'; SameSite=Lax; Path='+COOKIE_PATH;if(location.protocol==='https:')attributes+='; Secure';document.cookie=COOKIE_NAME+'='+encodeURIComponent(raw)+attributes}
function clearLoginCookie(){document.cookie=COOKIE_NAME+'=; Max-Age=0; SameSite=Lax; Path='+COOKIE_PATH+(location.protocol==='https:'?'; Secure':'')}

async function importKey(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function decryptData(box,rawKey){const key=await importKey(rawKey);const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(box.iv)},key,from64(box.data));return JSON.parse(decoder.decode(dec))}

function validState(v){return v&&Array.isArray(v.records)&&v.records.length>0&&v.records.length<61&&v.records.every(validRecord)}
function normalizeState(v){state={...deep(DEFAULT),...v,demo:false};state.records.sort((a,b)=>a.date.localeCompare(b.date));if(!validState(state))throw new Error('invalid state');if(!Array.isArray(state.goals)||state.goals.length!==5||!state.goals.every(v=>Number.isFinite(v)&&v>=0&&v<=100))state.goals=[60,55,75,55,55];if(!Number.isFinite(state.target)||state.target<=0)state.target=300;if(!state.records.some(r=>r.id===state.selected))state.selected=state.records.at(-1).id;if(!state.records.some(r=>r.id===state.reference))state.reference=state.records[0].id;if(!state.records.some(r=>r.id===state.unitRecord))state.unitRecord=state.selected;state.unitsByRecord=state.unitsByRecord||{};state.checks=state.checks||{}}

function chart(records,key='score'){
 if(records.length<2)return '<div class="emptychart">比較には2回以上の記録が必要です。</div>';
 const W=660,H=264,L=49,R=25,T=31,B=41,iw=W-L-R,ih=H-T-B;
 const scores=records.map(r=>key==='dev'?r.fiveDev:key==='gap'?ave(r)==null?null:fScore(r)-ave(r):fScore(r));
 const avgs=records.map(r=>key==='score'?ave(r):key==='dev'?50:0);
 const all=[...scores,...avgs].filter(v=>v!=null);const lo=Math.min(...all),hi=Math.max(...all); const pad=Math.max(8,(hi-lo)*.18);
 const min=key==='dev'?Math.min(35,Math.floor((lo-pad)/5)*5):key==='score'?Math.max(0,Math.floor((lo-pad)/20)*20):Math.floor((lo-pad)/10)*10;
 const max=key==='dev'?Math.max(60,Math.ceil((hi+pad)/5)*5):key==='score'?Math.ceil((hi+pad)/20)*20:Math.ceil((hi+pad)/10)*10;
 const xx=i=>L+iw*(i/Math.max(records.length-1,1));const yy=n=>T+ih-((n-min)/(max-min||1))*ih;
 const path=arr=>arr.map((v,i)=>v==null?'':(i===0||arr[i-1]==null?'M':'L')+xx(i).toFixed(1)+','+yy(v).toFixed(1)).join(' ');
 let out=`<svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の成績推移グラフ">`;
 for(let t=0;t<5;t++){const val=min+(max-min)*t/4;out+=`<line x1="${L}" x2="${W-R}" y1="${yy(val)}" y2="${yy(val)}" stroke="#e9edf5"/><text x="${L-9}" y="${yy(val)+4}" font-size="12" text-anchor="end" fill="#93a0b5">${Math.round(val)}</text>`}
 out+=`<path d="${path(avgs)}" fill="none" stroke="#b7c2d5" stroke-width="2.5" stroke-dasharray="5 6"/><path d="${path(scores)}" fill="none" stroke="#606fe4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
 records.forEach((r,i)=>{const v=scores[i],a=avgs[i],sx=xx(i);out+=`<text x="${sx}" y="${H-12}" font-size="12" font-weight="700" text-anchor="middle" fill="#8593a6">${esc(label(r))}</text>`;if(v!=null){out+=`<circle cx="${sx}" cy="${yy(v)}" r="7" fill="#fff" stroke="#606fe4" stroke-width="4"/><text x="${sx}" y="${yy(v)-16}" font-size="15" font-weight="900" text-anchor="middle" fill="#424cc6">${Math.round(v*10)/10}</text>`}if(a!=null)out+=`<circle cx="${sx}" cy="${yy(a)}" r="3.5" fill="#b4bed0"/>`;out+=`<title>${esc(fullDate(r))}: ${v==null?'未入力':v}</title>`});return out+'</svg>';
}

 <div class="section"><h2 class="section-title">設問・単元別の弱点</h2><p class="section-sub">8月・9月の各教科を、単元別に切り替えて確認できます。7月の単元別の採点は未登録です。</p><div class="card"><div class="bar"><h3 class="card-title">${name} — ${esc(label(detailRecord))}の単元別</h3><label class="muted" style="font-size:12px;font-weight:750">表示月 <select data-unit-record="1" aria-label="単元詳細の表示月">${state.records.map(r=>`<option value="${esc(r.id)}" ${r.id===detailId?'selected':''}>${esc(label(r))} ${esc(r.exam||'')}</option>`).join('')}</select></label></div><div class="small-note" style="margin-top:14px">${esc(source.memo)}</div>${source.rows.length?`<div class="small-note positive" style="margin-top:10px">単元別合計 ${sum(source.rows.map(row=>row[2]))} / ${sum(source.rows.map(row=>row[1]))}点（総合得点 ${detailRecord.scores[i]}点）</div>`:''}${source.rows.length?`<div style="margin-top:7px">${source.rows.map(([unit,max,got,av])=>{const rate=got/max;const delta=av==null?null:got-av;const weak=rate<.4||(delta!=null&&delta< -2);const c=weak?'#e78b7d':rate>=.75?'#19a78f':COLORS[i];return `<div class="unititem"><div class="unit-top"><b>${esc(unit)}</b><span class="${weak?'down':rate>=.75?'up':''}">${got} / ${max}点 <span class="muted">${av==null?'':`・平均との差 ${signed(delta,1)}`}</span></span></div><div class="unit-foot">得点率 ${Math.round(rate*100)}%　${av==null?'':`｜ この単元の受験者平均 ${one(av)}点`}</div><div class="unit-bars"><span style="width:${Math.round(rate*100)}%;background:${c}"></span></div></div>`}).join('')}</div>`:`<div class="unithelp">この月の単元別の採点データは登録されていません。ほかの月を選んでください。</div>`}<div class="unithelp">赤いバーは、得点率40%未満、または平均との差が2点以上低い単元です。単元別の得点率は合計得点÷配点で計算しました。実際の正答数とは異なります。</div>${source.rows.length?`<div class="unithelp" style="margin-top:10px"><b>優先復習 TOP3</b><div class="priority-list">${[...source.rows].sort((a,b)=>((a[2]/a[1])-(b[2]/b[1]))).slice(0,3).map((x,k)=>`<div><strong>${k+1}.</strong> ${esc(x[0])}　<b>${x[2]}/${x[1]}点</b></div>`).join('')}</div></div>`:''}</div></div>`;
}
function target(){const sumGoals=sum(state.goals),delta=sumGoals-fScore(selected()),left=state.target-sumGoals,per=Math.min(100,Math.round(sumGoals/state.target*100));return `<div class="section" style="margin-top:2px"><h2 class="section-title">次の目標をシミュレーション</h2><p class="section-sub">スライダーを動かすと合計・必要点数が即時計算されます。合格可能性の予測ではありません。</p><div class="targetgrid"><div class="card"><div class="bar"><h3 class="card-title">目標点の割り振り</h3><div class="seg">${[280,300,320].map(n=>`<button class="${state.target===n?'on':''}" data-totalgoal="${n}">${n}点</button>`).join('')}</div></div><div class="chips"><button class="button" data-preset="balanced">バランス型</button><button class="button" data-preset="reading">英語・理科</button><button class="button" data-preset="strong">得意を伸ばす</button></div>${SUBJECTS.map((n,i)=>`<div class="targetrow"><b>${n}</b><input type="range" min="0" max="100" value="${state.goals[i]}" data-goal="${i}" aria-label="${n}の目標点"><output data-goal-output="${i}" class="mono">${state.goals[i]}点</output><div class="diff ${diffColor(state.goals[i]-selected().scores[i])}" data-goal-diff="${i}">${signed(state.goals[i]-selected().scores[i])}点</div></div>`).join('')}<div class="small-note" style="margin-top:18px">各教科100点満点。実得点と比較した目標の配分です。予想偏差値・合格確率の自動算出はしていません。</div></div><div class="bigresult"><div class="eyebrow">YOUR TARGET PLAN</div><div><span class="muted" style="color:#c0d1e8">配分の合計</span><div class="big mono"><span data-sim-total>${sumGoals}</span><small> / 500点</small></div></div><div class="donut"><svg width="176" height="176" viewBox="0 0 176 176"><circle cx="88" cy="88" r="69" fill="none" stroke="#ffffff1c" stroke-width="14"/><circle id="simArc" cx="88" cy="88" r="69" fill="none" stroke="#bbf1a2" stroke-width="14" stroke-linecap="round" transform="rotate(-90 88 88)" stroke-dasharray="433.54" stroke-dashoffset="${(433.54*(1-Math.min(1,sumGoals/state.target))).toFixed(2)}"/></svg><div class="inside"><small>目標達成率</small><b data-sim-percent>${per}%</b></div></div><div class="result-note" data-sim-note>${left>0?`設定目標まであと${left}点`:`設定目標を${-left}点上回っています`}。現状から${signed(delta)}点の配分です。</div><div class="controls"><button class="button" data-export="summary">目標プランをコピー</button></div></div></div></div>`}
function updateTargetLive(){const total=sum(state.goals),delta=total-fScore(selected()),left=state.target-total,pct=Math.round(total/state.target*100);const set=(q,txt)=>{const e=document.querySelector(q);if(e)e.textContent=txt};set('[data-sim-total]',total);set('[data-sim-percent]',pct+'%');set('[data-sim-note]',(left>0?`設定目標まであと${left}点。`:left===0?'設定目標に到達。':`設定目標を${-left}点上回っています。`)+` 現状から${signed(delta)}点の配分です。`);const arc=document.getElementById('simArc');if(arc)arc.setAttribute('stroke-dashoffset',(433.54*(1-Math.min(1,total/state.target))).toFixed(2));SUBJECTS.forEach((n,i)=>{set(`[data-goal-output="${i}"]`,state.goals[i]+'点');set(`[data-goal-diff="${i}"]`,signed(state.goals[i]-selected().scores[i])+'点')});safeSave()}
function study(){const done=Object.values(state.checks).filter(Boolean).length,all=STUDY.reduce((n,w)=>n+w.tasks.length,0);return `<div class="section" style="margin-top:2px"><h2 class="section-title">4週間の学習チェック</h2><p class="section-sub">終わった項目にチェック。端末の同じブラウザ内に進捗が保存されます。</p><div class="card" style="margin-bottom:14px"><div class="bar"><div><div class="muted" style="font-size:11px;font-weight:850">全体の進捗</div><h3 style="font-size:26px">${done} <small class="muted">/ ${all} 項目完了</small></h3></div><div style="color:var(--teal);font-size:28px;font-weight:900">${Math.round(done/all*100)}%</div></div><div class="weekprogress" style="height:12px"><span style="width:${done/all*100}%"></span></div></div><div class="weekgrid">${STUDY.map((w,i)=>{const finished=w.tasks.filter((t,j)=>state.checks[i+'-'+j]).length;return `<div class="week-card"><div class="week-head"><div><div class="week-num">WEEK ${w.name}</div><h3 class="week-title">${w.title}</h3></div><span class="tag">${finished} / ${w.tasks.length}</span></div>${w.tasks.map((t,j)=>{const checked=!!state.checks[i+'-'+j];return `<label class="checkline ${checked?'completed':''}"><input type="checkbox" data-check="${i}-${j}" ${checked?'checked':''}><span>${esc(t)}</span></label>`}).join('')}<div class="weekprogress"><span style="width:${finished/w.tasks.length*100}%"></span></div></div>`}).join('')}</div><p class="caption">目標は一般的な学習プランです。すべて終わらせることより、間違えた問題を自力で再現できることを重視します。</p></div>`}
function recordForm(id){const old=id?byId(id):null;const form=old?deep(old):{id:'',date:'',exam:'',scores:[0,0,0,0,0],devs:[null,null,null,null,null],avgs:[null,null,null,null,null],fiveDev:null,threeDev:null,fiveAvg:null,threeAvg:null,rank:null,count:null};return `<div class="form-panel" id="recordEditor"><div class="bar"><h3>${old?'成績を修正':'新しい模試を追加'}</h3><button class="button" data-close-edit>閉じる</button></div><form id="recordForm"><div class="editgrid"><label>受験日<input type="date" name="date" required value="${esc(form.date)}"></label><label>模試の回次<input type="text" name="exam" maxlength="24" value="${esc(form.exam)}" placeholder="例：第5回"></label></div><div class="table-scroll form-block"><table class="form-table"><thead><tr><th>教科</th><th>得点</th><th>偏差値</th><th>平均点</th></tr></thead><tbody>${SUBJECTS.map((n,i)=>`<tr><td>${n}</td><td><input aria-label="${n}の得点" required type="number" name="score${i}" min="0" max="100" step="1" value="${form.scores[i]}"></td><td><input aria-label="${n}の偏差値" type="number" name="dev${i}" min="1" max="99" step="0.1" value="${form.devs[i]??''}" placeholder="—"></td><td><input aria-label="${n}の平均点" type="number" name="avg${i}" min="0" max="100" step="0.1" value="${form.avgs[i]??''}" placeholder="—"></td></tr>`).join('')}</tbody></table></div><div class="editgrid" style="margin-top:12px"><label>5教科偏差値<input type="number" name="fiveDev" step="0.1" min="1" max="99" value="${form.fiveDev??''}" placeholder="任意"></label><label>3教科偏差値<input type="number" name="threeDev" step="0.1" min="1" max="99" value="${form.threeDev??''}" placeholder="任意"></label><label>5教科平均点<input type="number" name="fiveAvg" step="0.1" min="0" max="500" value="${form.fiveAvg??''}" placeholder="未入力なら各教科の合計"></label><label>受験順位<input type="number" name="rank" step="1" min="1" value="${form.rank??''}" placeholder="任意"></label><label>受験者数<input type="number" name="count" step="1" min="1" value="${form.count??''}" placeholder="任意"></label></div><div class="form-foot"><button type="submit" class="button primary">${old?'変更を保存':'新しい模試を登録'}</button>${old?`<button type="button" class="button danger" data-delete="${esc(old.id)}">この記録を削除</button>`:''}</div></form><p class="caption">偏差値・平均点・順位の空欄は「未入力」で保存します。偏差値は得点から自動計算できないため、成績表の値を入力してください。</p></div>`}
function records(){return `<div class="section" style="margin-top:2px"><h2 class="section-title">成績を追加・編集</h2><p class="section-sub">次回の模試結果を入力すると、グラフ・伸び率・平均との差が自動更新されます。</p><div class="card"><div class="bar"><h3 class="card-title">登録済みの模試</h3><button class="button primary" data-add>＋ 記録を追加</button></div>${editId!==null?recordForm(editId):''}${state.records.map(r=>`<div class="record-card"><div><b>${esc(label(r))} ${esc(r.exam||'')} <span class="em mono">${fScore(r)}点</span></b><small>${fullDate(r)} ｜ 5教科偏差値 ${r.fiveDev??'—'} ｜ 上位位置 ${rankPct(r)!=null?one(rankPct(r))+'%':'—'}</small></div><div class="record-actions"><button class="button" data-edit="${esc(r.id)}">編集</button><button class="button soft" data-select-to-home="${esc(r.id)}">分析</button></div></div>`).join('')}<div class="small-note" style="margin-top:13px">入力内容は端末内で暗号化保存します。別の端末に移すときはJSONを書き出してください。書き出しファイル自体は暗号化されないため取り扱いに注意してください。</div></div><div class="section card"><h3 class="card-title">バックアップと復元</h3><p class="card-sub">記録・目標点・学習チェックをまとめて保存できます。</p><div class="controls"><button class="button primary" data-export="json">データを書き出す</button><label class="button">バックアップを読み込む<input type="file" accept="application/json,.json" data-import style="display:none"></label><button class="button" data-reset>デモデータに戻す</button></div><p class="caption">実名は含みません。保存したJSONバックアップ自体は暗号化されないため、第三者へ送らないでください。</p></div></div>`}
function render(scroll=true){const app=document.getElementById('app');if(!app)return;let body=state.tab==='analysis'?analysis():state.tab==='target'?target():state.tab==='study'?study():state.tab==='records'?records():home();app.innerHTML=shell(body);if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function parseRecord(form){const fd=new FormData(form),opt=(n,max=9999)=>{const x=String(fd.get(n)||'').trim();if(x==='')return null;const v=Number(x);return Number.isFinite(v)&&v>=0&&v<=max?v:null};const s=SUBJECTS.map((_,i)=>opt('score'+i,100)),ds=SUBJECTS.map((_,i)=>opt('dev'+i,99)),as=SUBJECTS.map((_,i)=>opt('avg'+i,100));if(s.some(x=>x==null||!Number.isInteger(x)))throw Error('得点は0〜100の整数で入力してください');if(ds.some(x=>x!=null&&x<1))throw Error('偏差値は1以上で入力してください');const d=String(fd.get('date')||'');if(!/^\d{4}-\d\d-\d\d$/.test(d))throw Error('受験日が正しくありません');const rank=opt('rank'),count=opt('count');if(rank!=null&&count!=null&&rank>count)throw Error('受験順位は受験者数以下にしてください');const avg5=opt('fiveAvg',500);return {id:editId||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),date:d,exam:String(fd.get('exam')||'').slice(0,24),scores:s,devs:ds,avgs:as,fiveDev:opt('fiveDev',99),threeDev:opt('threeDev',99),fiveAvg:avg5==null&&as.every(v=>v!=null)?Math.round(sum(as)*10)/10:avg5,threeAvg:null,rank,count}}
function reset(){if(confirm('入力した成績・目標・学習チェックを削除してデモに戻しますか？')){state=deep(DEFAULT);editId=null;safeSave();render();toast('初期状態に戻しました')}}
function saveFile(textBody,name,mime){const blob=new Blob([textBody],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function backup(){saveFile(JSON.stringify({format:'zenken-app-backup',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'zenken-backup.json','application/json;charset=utf-8');toast('バックアップを保存しました')}
function restore(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const p=JSON.parse(String(rd.result));const v=p.data;if(p.format!=='zenken-app-backup'||!v||!Array.isArray(v.records)||!v.records.length||!v.records.every(validRecord)||v.records.length>60)throw Error('形式が異なります');if(!confirm('現在の入力内容をバックアップの内容で上書きします。よろしいですか？'))return;state={...deep(DEFAULT),...v,unitsByRecord:{...state.unitsByRecord,...v.unitsByRecord}};if(v.units&&!state.unitsByRecord?.sep)state.unitsByRecord={...state.unitsByRecord,sep:v.units};state.records.sort((a,b)=>a.date.localeCompare(b.date));if(!byId(state.selected))state.selected=state.records.at(-1).id;if(!byId(state.reference))state.reference=state.records[0].id;state.goals=Array.isArray(state.goals)&&state.goals.length===5&&state.goals.every(v=>Number.isFinite(v)&&v>=0&&v<=100)?state.goals:[60,55,75,55,55];state.checks=state.checks&&typeof state.checks==='object'?state.checks:{};editId=null;safeSave();render();toast('バックアップを復元しました')}catch(e){toast('バックアップを読み込めませんでした')}};rd.readAsText(file)}
function onClick(e){const b=e.target.closest('button');if(!b)return;
 if(b.dataset.logout!==undefined){logOut();return}
 if(b.dataset.tab){state.tab=b.dataset.tab;editId=null;safeSave();render();return}
 if(b.dataset.subject!=null){state.subject=+b.dataset.subject;safeSave();render(false);return}
 if(b.dataset.trend){state.trend=b.dataset.trend;safeSave();render(false);return}
 if(b.dataset.totalgoal){state.target=+b.dataset.totalgoal;safeSave();render(false);return}
 if(b.dataset.preset){state.goals=deep({balanced:[60,55,75,55,55],reading:[65,52,74,60,49],strong:[56,52,80,52,60]}[b.dataset.preset]);safeSave();render(false);return}
 if(b.dataset.add!==undefined){editId='';render(false);document.getElementById('recordEditor')?.scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.edit){editId=b.dataset.edit;render(false);document.getElementById('recordEditor')?.scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.closeEdit!==undefined){editId=null;render(false);return}
 if(b.dataset.selectToHome){state.selected=b.dataset.selectToHome;state.tab='home';safeSave();render();return}
 if(b.dataset.delete){if(state.records.length<=1){toast('少なくとも1件の記録が必要です');return}if(confirm('この模試の記録を削除しますか？')){state.records=state.records.filter(r=>r.id!==b.dataset.delete);if(!byId(state.selected))state.selected=state.records.at(-1).id;if(!byId(state.reference))state.reference=state.records[0].id;editId=null;safeSave();render(false);toast('記録を削除しました')}return}
 if(b.dataset.reset!==undefined){reset();return}
 if(b.dataset.export==='json'){backup();return}
 if(b.dataset.export==='summary'){const textBody=`次回模試の目標 ${sum(state.goals)}点（基準：${fScore(selected())}点）\n`+SUBJECTS.map((n,i)=>`${n} ${state.goals[i]}点（${signed(state.goals[i]-selected().scores[i])}点）`).join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(textBody).then(()=>toast('目標プランをコピーしました')).catch(()=>toast('コピーできませんでした'))}else toast('コピー機能が利用できません');return}}
function onChange(e){const t=e.target;if(t.matches('[data-reference]')){state.reference=t.value;safeSave();render(false)}else if(t.matches('[data-select-record]')){state.selected=t.value;state.unitRecord=t.value;safeSave();render(false)}else if(t.matches('[data-unit-record]')){state.unitRecord=t.value;safeSave();render(false)}else if(t.matches('[data-import]'))restore(t.files[0]);else if(t.matches('[data-check]')){state.checks[t.dataset.check]=t.checked;safeSave();render(false)}}
function onInput(e){const t=e.target;if(t.matches('[data-goal]')){const idx=Number(t.dataset.goal);state.goals[idx]=+t.value;updateTargetLive()}}
function onSubmit(e){if(e.target.id==='pinForm'){e.preventDefault();const pin=String(new FormData(e.target).get('pin')||'');if(/^\d{4}$/.test(pin))unlockWithPin(pin);else document.getElementById('pinError').textContent='4桁の数字を入力してください。';return;}if(e.target.id!=='recordForm')return;e.preventDefault();try{const r=parseRecord(e.target);if(state.demo){state.records=[];state.reference=r.id;state.demo=false;state.schools=[];state.units=null}const index=state.records.findIndex(x=>x.id===r.id);if(index===-1)state.records.push(r);else state.records[index]=r;state.records.sort((a,b)=>a.date.localeCompare(b.date));state.selected=r.id;if(state.reference===r.id&&state.records.length>1)state.reference=state.records.find(x=>x.id!==r.id).id;editId=null;safeSave();render();toast('成績を保存しました')}catch(err){toast(err.message||'入力内容を確認してください')}}
initialize();
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);
})();
</script>
</body>
