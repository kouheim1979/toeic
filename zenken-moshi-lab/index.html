<script>
(()=>{'use strict';
const SUBJECTS=['英語','数学','国語','理科','社会'];
const COLORS=['#7875d9','#5484e6','#9d76d8','#24ab99','#f19c67'];
const SEED=[
 {id:'jul',date:'2025-05-18',exam:'デモ第1回',scores:[48,41,61,45,42],devs:[48,45,50,47,49],avgs:[53,42,60,48,39],fiveDev:47,threeDev:47,fiveAvg:242,threeAvg:155,rank:null,count:null},
 {id:'aug',date:'2025-06-15',exam:'デモ第2回',scores:[51,47,66,50,43],devs:[49,50,52,51,51],avgs:[53,43,62,47,41],fiveDev:51,threeDev:50,fiveAvg:246,threeAvg:158,rank:null,count:null},
 {id:'sep',date:'2025-07-20',exam:'デモ第3回',scores:[57,52,70,55,53],devs:[53,53,54,55,57],avgs:[54,43,64,48,42],fiveDev:55,threeDev:54,fiveAvg:251,threeAvg:161,rank:null,count:null}
];
const UNITS=Object.fromEntries(SUBJECTS.map(s=>[s,{memo:'個人の設問別データは公開版に含まれません。バックアップを読み込むと表示されます。',rows:[]}]));
const STUDY=[
 {name:'01',title:'復習の土台',tasks:['間違えた問題を3種類に分ける','基礎問題を10問解く','学習時間を記録する','今週のつまずきを1つメモする']},
 {name:'02',title:'英語・数学',tasks:['数学の解き直しを5問','短い英作文を1日1つ','リスニングを10分','関数や図形の基本問題に挑戦する']},
 {name:'03',title:'理科・国語・社会',tasks:['理科の図や実験を整理する','国語の記述を5問練習する','社会の年表を整理する','苦手単元をもう一度解く']},
 {name:'04',title:'確認テスト',tasks:['5教科の時間配分を試す','誤答を解説なしで解く','得点目標を設定する','次の模試に向けて計画を見直す']}
];
const DEFAULT={records:SEED,selected:'sep',reference:'aug',tab:'home',subject:1,metric:'score',trend:'score',target:300,goals:[60,55,75,55,55],checks:{},demo:true,units:null,schools:[]};
let state=deep(DEFAULT);let editId=null;let messageTimer=null;
const key='zenken-lab-github-public-v1';
function deep(x){return JSON.parse(JSON.stringify(x))};
function safeRead(){try{const raw=localStorage.getItem(key);if(raw){const st=JSON.parse(raw);if(st&&Array.isArray(st.records)&&st.records.every(validRecord)){state={...deep(DEFAULT),...st};state.records.sort((a,b)=>a.date.localeCompare(b.date));if(!Array.isArray(state.goals)||state.goals.length!==5||!state.goals.every(v=>Number.isFinite(v)&&v>=0&&v<=100))state.goals=[60,55,75,55,55];if(!Number.isFinite(state.target)||state.target<=0)state.target=300;if(!state.records.some(r=>r.id===state.selected))state.selected=state.records.at(-1).id;if(!state.records.some(r=>r.id===state.reference))state.reference=state.records[0].id;}}}catch(e){}}
function safeSave(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function validRecord(r){return !!(r&&typeof r.id==='string'&&/^\d{4}-\d\d-\d\d$/.test(r.date)&&Array.isArray(r.scores)&&r.scores.length===5&&r.scores.every(x=>Number.isFinite(x)&&x>=0&&x<=100)&&Array.isArray(r.devs)&&r.devs.length===5&&r.devs.every(x=>x==null||(Number.isFinite(x)&&x>=1&&x<=99))&&Array.isArray(r.avgs)&&r.avgs.length===5&&r.avgs.every(x=>x==null||(Number.isFinite(x)&&x>=0&&x<=100)))}
const sum=a=>a.reduce((x,y)=>x+(Number(y)||0),0);
const one=n=>Number(n).toFixed(1),format=n=>Number(n).toLocaleString('ja-JP',{maximumFractionDigits:1});
const signed=(n,d=0)=>n==null?'—':(n>0?'+':'')+Number(n).toFixed(d);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=r=>r.date.slice(5,7).replace(/^0/,'')+'月';
const fullDate=r=>r.date.replaceAll('-','/');
const byId=id=>state.records.find(r=>r.id===id);
const selected=()=>byId(state.selected)||state.records.at(-1);
const reference=()=>byId(state.reference)||state.records[0];
const fScore=r=>sum(r.scores),ave=r=>r.fiveAvg==null?(r.avgs.every(x=>x!=null)?sum(r.avgs):null):r.fiveAvg;
const rankPct=r=>r.rank&&r.count?100*r.rank/r.count:null;

const compareOptions=(isReference=false)=>state.records.map(r=>`<option value="${esc(r.id)}" ${r.id===(isReference?state.reference:state.selected)?'selected':''}>${label(r)} ${esc(r.exam||'')}（${fScore(r)}点）</option>`).join('');

function chart(records,key='score'){
 if(records.length<2)return '<div class="emptychart">比較には2回以上の記録が必要です。</div>';
 const W=660,H=264,L=49,R=25,T=31,B=41,iw=W-L-R,ih=H-T-B;
 const scores=records.map(r=>key==='dev'?r.fiveDev:key==='gap'?ave(r)==null?null:fScore(r)-ave(r):fScore(r));
 const avgs=records.map(r=>key==='score'?ave(r):key==='dev'?50:0);
 const all=[...scores,...avgs].filter(v=>v!=null);const lo=Math.min(...all),hi=Math.max(...all); const pad=Math.max(8,(hi-lo)*.18);
 const min=key==='dev'?Math.min(35,Math.floor((lo-pad)/5)*5):key==='score'?Math.max(0,Math.floor((lo-pad)/20)*20):Math.floor((lo-pad)/10)*10;
 const max=key==='dev'?Math.max(60,Math.ceil((hi+pad)/5)*5):key==='score'?Math.ceil((hi+pad)/20)*20:Math.ceil((hi+pad)/10)*10;
 const xx=i=>L+iw*(i/Math.max(records.length-1,1));const yy=n=>T+ih-((n-min)/(max-min||1))*ih;
 const path=arr=>arr.map((v,i)=>v==null?'':(i===0||arr[i-1]==null?'M':'L')+xx(i).toFixed(1)+','+yy(v).toFixed(1)).join(' ');
 let out=`<svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の成績推移グラフ">`;
 for(let t=0;t<5;t++){const val=min+(max-min)*t/4;out+=`<line x1="${L}" x2="${W-R}" y1="${yy(val)}" y2="${yy(val)}" stroke="#e9edf5"/><text x="${L-9}" y="${yy(val)+4}" font-size="12" text-anchor="end" fill="#93a0b5">${Math.round(val)}</text>`}
 out+=`<path d="${path(avgs)}" fill="none" stroke="#b7c2d5" stroke-width="2.5" stroke-dasharray="5 6"/><path d="${path(scores)}" fill="none" stroke="#606fe4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
 records.forEach((r,i)=>{const v=scores[i],a=avgs[i],sx=xx(i);out+=`<text x="${sx}" y="${H-12}" font-size="12" font-weight="700" text-anchor="middle" fill="#8593a6">${esc(label(r))}</text>`;if(v!=null){out+=`<circle cx="${sx}" cy="${yy(v)}" r="7" fill="#fff" stroke="#606fe4" stroke-width="4"/><text x="${sx}" y="${yy(v)-16}" font-size="15" font-weight="900" text-anchor="middle" fill="#424cc6">${Math.round(v*10)/10}</text>`}if(a!=null)out+=`<circle cx="${sx}" cy="${yy(a)}" r="3.5" fill="#b4bed0"/>`;out+=`<title>${esc(fullDate(r))}: ${v==null?'未入力':v}</title>`});return out+'</svg>';
}
function home(){const s=selected(),ref=reference();const total=fScore(s),change=total-fScore(ref),rank=rankPct(s),rp=rankPct(ref),avg=ave(s),gap=avg==null?null:total-avg;
 const scores=SUBJECTS.map((sub,i)=>({sub,i,v:s.scores[i],v0:ref.scores[i],d:s.scores[i]-ref.scores[i],avg:s.avgs[i]}));
 const sorted=[...scores].sort((a,b)=>b.d-a.d);const plus=sorted.filter(x=>x.d>0);const top2=sum(plus.slice(0,2).map(x=>x.d));
 const best=sorted[0]; const biggestGap=[...scores].sort((a,b)=>(b.avg==null?-1:b.avg-b.v)-(a.avg==null?-1:a.avg-a.v))[0];
 return `<div class="hero"><div class="hero-copy"><div class="eyebrow">STUDY PROGRESS / 最新データを可視化</div><h1>がんばりを、<br><em>見える成長</em>に。</h1><p>得点・偏差値・平均との差・志望校判定から、次に伸ばす科目まで。記録を追加するとグラフや分析が自動更新されます。</p><div class="controls" style="margin-top:18px"><span class="tag" style="background:#ffffff1b;color:white;border-color:#ffffff36">比較対象 <select aria-label="比較対象の模試" data-reference="1" style="margin-left:6px;padding:5px;border-radius:7px">${compareOptions(true)}</select></span></div></div><div class="hero-art"><div class="hero-ring"></div><div class="hero-bubble">${signed(change)} 点 ↗</div></div></div>
 <div class="section bar"><div><h2 class="section-title">成績サマリー</h2><div class="section-sub">比較：${esc(label(ref))} → ${esc(label(s))}（基準はいつでも変更可能）</div></div><select data-select-record="1" aria-label="表示する模試">${compareOptions()}</select></div>
 <div class="stats"><div class="stat"><div class="stat-label">5教科合計</div><div class="stat-number em mono">${total}<span>/ 500点</span></div><div class="stat-note mono ${diffColor(change)}">${signed(change)}点 / 比較月から</div></div><div class="stat"><div class="stat-label">総合偏差値</div><div class="stat-number mono">${s.fiveDev??'—'}</div><div class="stat-note">${s.fiveDev!=null&&ref.fiveDev!=null?signed(s.fiveDev-ref.fiveDev)+' / 比較月から':'未入力'}</div></div><div class="stat"><div class="stat-label">受験者平均との差</div><div class="stat-number mono ${gap!=null?diffColor(gap):''}">${gap!=null?signed(gap,1):'—'}<span>点</span></div><div class="stat-note">平均 ${avg!=null?one(avg):'未入力'}点</div></div><div class="stat"><div class="stat-label">全県模試内の位置</div><div class="stat-number mono">${rank!=null?one(rank):'—'}<span>${rank!=null?'%':''}</span></div><div class="stat-note">${rank!=null?'上位約'+one(rank)+'%相当':'順位未入力'}</div></div></div>
 <div class="section grid2"><div class="card"><div class="bar"><div><h3 class="card-title">成績の推移</h3><div class="card-sub">登録した模試が増えるとグラフが伸びます</div></div><div class="seg"><button data-trend="score" class="${state.trend==='score'?'on':''}">得点</button><button data-trend="dev" class="${state.trend==='dev'?'on':''}">偏差値</button><button data-trend="gap" class="${state.trend==='gap'?'on':''}">平均差</button></div></div>${chart(state.records,state.trend)}<div class="chart-foot"><span>本人</span><span>${state.trend==='score'?'受験者平均':state.trend==='dev'?'偏差値50':'平均との差0'}</span></div></div>
 <div class="card"><h3 class="card-title">教科別の実力</h3><div class="card-sub">棒＝本人の得点・点線＝受験者平均</div>${scores.map(({sub,i,v,avg})=>`<div class="subject-row"><div class="subject-name">${sub}</div><div class="subject-bars"><span style="width:${v}%;background:${COLORS[i]}"></span>${avg!=null?`<i style="left:${avg}%" title="平均${avg}点"></i>`:''}</div><div class="subject-meta mono">${v}<small class="muted"> 点</small><div class="${avg==null?'muted':diffColor(v-avg)}" style="font-size:10px">${avg==null?'平均なし':signed(v-avg,1)}</div></div></div>`).join('')}</div></div>
 <div class="section grid2 equal"><div class="card"><h3 class="card-title">伸びをつくった科目</h3><div class="card-sub">${esc(label(ref))}との得点差を分解</div><div class="delta-break">${sorted.map(x=>`<div class="delta-item"><strong>${x.sub}</strong><div class="progress"><span style="width:${x.d>0?Math.round(x.d/Math.max(...sorted.map(y=>y.d),1)*100):0}%;background:${COLORS[x.i]}"></span></div><div class="delta-amount ${diffColor(x.d)}">${signed(x.d)}点</div></div>`).join('')}</div><div class="small-note positive">${change>0?`特に${best.sub}の${signed(best.d)}点が大きな伸び。`:`改善の優先科目を見つけて立て直しましょう。`} ${plus.length>=2&&change>0?`プラス上位2教科の合計は＋${top2}点。`:''}</div></div><div class="card"><h3 class="card-title">分析から見えたこと</h3><div class="card-sub">学習方針を決めるためのメモ</div><div class="small-note"><b>① 相対的な成績</b><br>${rp!=null&&rank!=null?`上位位置は約${one(rp)}% → 約${one(rank)}%。${rank<rp?'割合上も改善しています。':'割合は悪化しているため原因を確認しましょう。'}`:'順位データのある模試では相対位置を確認できます。'}</div><div class="small-note" style="margin-top:10px"><b>② 改善の焦点</b><br>${biggestGap.avg!=null?`${biggestGap.sub}は受験者平均との差が${signed(biggestGap.v-biggestGap.avg,1)}点。平均との差で弱点を探すと優先度がわかります。`:'教科別の平均を入力すると、弱点の優先順位を計算できます。'}</div><div style="margin-top:14px"><button class="button primary" data-tab="analysis">単元ごとの弱点を見る →</button></div></div></div>
 ${schools()}`;
}
function schools(){const entries=Array.isArray(state.schools)?state.schools:[];if(!entries.length)return '<section class="section"><h2 class="section-title">志望校の判定</h2><div class="small-note">この公開版には個人の志望校や判定結果を収録していません。個人用JSONを読み込んだ場合のみ表示します。</div></section>';const cards=entries.map((sc,i)=>'<div class="school-card"><div class="school-label">第'+(i+1)+'希望</div><h3>'+esc(sc.name)+'</h3><div class="school-num mono">'+Math.round(Number(sc.percent)||0)+'<small>%</small></div><div class="school-meter"><span style="width:'+Math.max(0,Math.min(100,Number(sc.percent)||0))+'%"></span></div></div>').join('');return '<section class="section"><h2 class="section-title">志望校の判定</h2><p class="section-sub">取り込んだ成績表に記載された参考判定です。シミュレーションで自動更新されません。</p><div class="school-cards">'+cards+'</div><p class="caption">※模試による参考判定であり、合否の保証ではありません。</p></section>'}
function analysis(){const s=selected(),ref=reference(),i=state.subject,name=SUBJECTS[i];const source=((state.units||UNITS)[name]||{memo:"単元別データはありません。",rows:[]}),monthly=state.records.map(r=>({r,v:r.scores[i]}));const current=s.scores[i],vAvg=s.avgs[i],d=current-ref.scores[i];return `<div class="section bar" style="margin-top:2px"><div><h2 class="section-title">教科別の深掘り</h2><p class="section-sub">得意・苦手を「点数」だけでなく「平均との差」から分析します。</p></div><div class="controls"><select data-select-record="1" aria-label="分析月">${compareOptions()}</select></div></div><div class="chips">${SUBJECTS.map((n,j)=>`<button class="chip ${i===j?'on':''}" data-subject="${j}">${n} <strong>${s.scores[j]}</strong></button>`).join('')}</div>
 <div class="grid2"><div class="card"><h3 class="card-title">${name}の3指標</h3><div class="card-sub">${esc(label(s))}の得点データ</div><div class="subject-insight"><div><span>得点</span><b>${current}<small> 点</small></b></div><div><span>偏差値</span><b>${s.devs[i]??'—'}</b></div><div><span>平均との差</span><b class="${vAvg==null?'':diffColor(current-vAvg)}">${vAvg==null?'—':signed(current-vAvg,1)}</b></div></div><div class="small-note">${label(ref)}の${ref.scores[i]}点から、${signed(d)}点。${s.devs[i]!=null&&ref.devs[i]!=null?`偏差値は${signed(s.devs[i]-ref.devs[i])}動きました。`:'偏差値の変化は未入力です。'}</div><h3 class="card-title" style="margin-top:22px">月別の変化</h3>${monthly.map(({r,v})=>`<div class="subject-row" style="grid-template-columns:42px 1fr 74px"><div class="subject-name">${label(r)}</div><div class="subject-bars"><span style="width:${v}%;background:${COLORS[i]}"></span>${r.avgs[i]!=null?`<i style="left:${r.avgs[i]}%"></i>`:''}</div><div class="subject-meta">${v}点</div></div>`).join('')}</div><div class="card"><h3 class="card-title">全教科の比較表</h3><p class="card-sub">数値は各月の成績表。月を追加すると列も増えます。</p><div class="table-scroll"><table class="data-table"><thead><tr><th>教科</th>${state.records.map(r=>`<th>${label(r)}</th>`).join('')}</tr></thead><tbody>${SUBJECTS.map((n,j)=>`<tr><td>${n}</td>${state.records.map(r=>`<td class="${r.id===s.id?'latest':''}">${r.scores[j]}</td>`).join('')}</tr>`).join('')}<tr><td>5教科計</td>${state.records.map(r=>`<td class="${r.id===s.id?'latest':''}">${fScore(r)}</td>`).join('')}</tr><tr><td>5教科偏差値</td>${state.records.map(r=>`<td class="${r.id===s.id?'latest':''}">${r.fiveDev??'—'}</td>`).join('')}</tr></tbody></table></div><div class="small-note positive" style="margin-top:18px">${esc(label(s))}の受験者平均は${ave(s)!=null?one(ave(s))+'点':'未入力'}です。異なる回の得点だけではなく、平均との差や偏差値も併せて確認しましょう。</div></div></div>

function target(){const sumGoals=sum(state.goals),delta=sumGoals-fScore(selected()),left=state.target-sumGoals,per=Math.min(100,Math.round(sumGoals/state.target*100));return `<div class="section" style="margin-top:2px"><h2 class="section-title">次の目標をシミュレーション</h2><p class="section-sub">スライダーを動かすと合計・必要点数が即時計算されます。合格可能性の予測ではありません。</p><div class="targetgrid"><div class="card"><div class="bar"><h3 class="card-title">目標点の割り振り</h3><div class="seg">${[280,300,320].map(n=>`<button class="${state.target===n?'on':''}" data-totalgoal="${n}">${n}点</button>`).join('')}</div></div><div class="chips"><button class="button" data-preset="balanced">バランス型</button><button class="button" data-preset="reading">英語・理科</button><button class="button" data-preset="strong">得意を伸ばす</button></div>${SUBJECTS.map((n,i)=>`<div class="targetrow"><b>${n}</b><input type="range" min="0" max="100" value="${state.goals[i]}" data-goal="${i}" aria-label="${n}の目標点"><output data-goal-output="${i}" class="mono">${state.goals[i]}点</output><div class="diff ${diffColor(state.goals[i]-selected().scores[i])}" data-goal-diff="${i}">${signed(state.goals[i]-selected().scores[i])}点</div></div>`).join('')}<div class="small-note" style="margin-top:18px">各教科100点満点。実得点と比較した目標の配分です。予想偏差値・合格確率の自動算出はしていません。</div></div><div class="bigresult"><div class="eyebrow">YOUR TARGET PLAN</div><div><span class="muted" style="color:#c0d1e8">配分の合計</span><div class="big mono"><span data-sim-total>${sumGoals}</span><small> / 500点</small></div></div><div class="donut"><svg width="176" height="176" viewBox="0 0 176 176"><circle cx="88" cy="88" r="69" fill="none" stroke="#ffffff1c" stroke-width="14"/><circle id="simArc" cx="88" cy="88" r="69" fill="none" stroke="#bbf1a2" stroke-width="14" stroke-linecap="round" transform="rotate(-90 88 88)" stroke-dasharray="433.54" stroke-dashoffset="${(433.54*(1-Math.min(1,sumGoals/state.target))).toFixed(2)}"/></svg><div class="inside"><small>目標達成率</small><b data-sim-percent>${per}%</b></div></div><div class="result-note" data-sim-note>${left>0?`設定目標まであと${left}点`:`設定目標を${-left}点上回っています`}。現状から${signed(delta)}点の配分です。</div><div class="controls"><button class="button" data-export="summary">目標プランをコピー</button></div></div></div></div>`}
function updateTargetLive(){const total=sum(state.goals),delta=total-fScore(selected()),left=state.target-total,pct=Math.round(total/state.target*100);const set=(q,txt)=>{const e=document.querySelector(q);if(e)e.textContent=txt};set('[data-sim-total]',total);set('[data-sim-percent]',pct+'%');set('[data-sim-note]',(left>0?`設定目標まであと${left}点。`:left===0?'設定目標に到達。':`設定目標を${-left}点上回っています。`)+` 現状から${signed(delta)}点の配分です。`);const arc=document.getElementById('simArc');if(arc)arc.setAttribute('stroke-dashoffset',(433.54*(1-Math.min(1,total/state.target))).toFixed(2));SUBJECTS.forEach((n,i)=>{set(`[data-goal-output="${i}"]`,state.goals[i]+'点');set(`[data-goal-diff="${i}"]`,signed(state.goals[i]-selected().scores[i])+'点')});safeSave()}
function study(){const done=Object.values(state.checks).filter(Boolean).length,all=STUDY.reduce((n,w)=>n+w.tasks.length,0);return `<div class="section" style="margin-top:2px"><h2 class="section-title">4週間の学習チェック</h2><p class="section-sub">終わった項目にチェック。端末の同じブラウザ内に進捗が保存されます。</p><div class="card" style="margin-bottom:14px"><div class="bar"><div><div class="muted" style="font-size:11px;font-weight:850">全体の進捗</div><h3 style="font-size:26px">${done} <small class="muted">/ ${all} 項目完了</small></h3></div><div style="color:var(--teal);font-size:28px;font-weight:900">${Math.round(done/all*100)}%</div></div><div class="weekprogress" style="height:12px"><span style="width:${done/all*100}%"></span></div></div><div class="weekgrid">${STUDY.map((w,i)=>{const finished=w.tasks.filter((t,j)=>state.checks[i+'-'+j]).length;return `<div class="week-card"><div class="week-head"><div><div class="week-num">WEEK ${w.name}</div><h3 class="week-title">${w.title}</h3></div><span class="tag">${finished} / ${w.tasks.length}</span></div>${w.tasks.map((t,j)=>{const checked=!!state.checks[i+'-'+j];return `<label class="checkline ${checked?'completed':''}"><input type="checkbox" data-check="${i}-${j}" ${checked?'checked':''}><span>${esc(t)}</span></label>`}).join('')}<div class="weekprogress"><span style="width:${finished/w.tasks.length*100}%"></span></div></div>`}).join('')}</div><p class="caption">目標は一般的な学習プランです。すべて終わらせることより、間違えた問題を自力で再現できることを重視します。</p></div>`}
function recordForm(id){const old=id?byId(id):null;const form=old?deep(old):{id:'',date:'',exam:'',scores:[0,0,0,0,0],devs:[null,null,null,null,null],avgs:[null,null,null,null,null],fiveDev:null,threeDev:null,fiveAvg:null,threeAvg:null,rank:null,count:null};return `<div class="form-panel" id="recordEditor"><div class="bar"><h3>${old?'成績を修正':'新しい模試を追加'}</h3><button class="button" data-close-edit>閉じる</button></div><form id="recordForm"><div class="editgrid"><label>受験日<input type="date" name="date" required value="${esc(form.date)}"></label><label>模試の回次<input type="text" name="exam" maxlength="24" value="${esc(form.exam)}" placeholder="例：第5回"></label></div><div class="table-scroll form-block"><table class="form-table"><thead><tr><th>教科</th><th>得点</th><th>偏差値</th><th>平均点</th></tr></thead><tbody>${SUBJECTS.map((n,i)=>`<tr><td>${n}</td><td><input aria-label="${n}の得点" required type="number" name="score${i}" min="0" max="100" step="1" value="${form.scores[i]}"></td><td><input aria-label="${n}の偏差値" type="number" name="dev${i}" min="1" max="99" step="0.1" value="${form.devs[i]??''}" placeholder="—"></td><td><input aria-label="${n}の平均点" type="number" name="avg${i}" min="0" max="100" step="0.1" value="${form.avgs[i]??''}" placeholder="—"></td></tr>`).join('')}</tbody></table></div><div class="editgrid" style="margin-top:12px"><label>5教科偏差値<input type="number" name="fiveDev" step="0.1" min="1" max="99" value="${form.fiveDev??''}" placeholder="任意"></label><label>3教科偏差値<input type="number" name="threeDev" step="0.1" min="1" max="99" value="${form.threeDev??''}" placeholder="任意"></label><label>5教科平均点<input type="number" name="fiveAvg" step="0.1" min="0" max="500" value="${form.fiveAvg??''}" placeholder="未入力なら各教科の合計"></label><label>受験順位<input type="number" name="rank" step="1" min="1" value="${form.rank??''}" placeholder="任意"></label><label>受験者数<input type="number" name="count" step="1" min="1" value="${form.count??''}" placeholder="任意"></label></div><div class="form-foot"><button type="submit" class="button primary">${old?'変更を保存':'新しい模試を登録'}</button>${old?`<button type="button" class="button danger" data-delete="${esc(old.id)}">この記録を削除</button>`:''}</div></form><p class="caption">偏差値・平均点・順位の空欄は「未入力」で保存します。偏差値は得点から自動計算できないため、成績表の値を入力してください。</p></div>`}
function records(){return `<div class="section" style="margin-top:2px"><h2 class="section-title">成績を追加・編集</h2><p class="section-sub">次回の模試結果を入力すると、グラフ・伸び率・平均との差が自動更新されます。</p><div class="card"><div class="bar"><h3 class="card-title">登録済みの模試</h3><button class="button primary" data-add>＋ 記録を追加</button></div>${editId!==null?recordForm(editId):''}${state.records.map(r=>`<div class="record-card"><div><b>${esc(label(r))} ${esc(r.exam||'')} <span class="em mono">${fScore(r)}点</span></b><small>${fullDate(r)} ｜ 5教科偏差値 ${r.fiveDev??'—'} ｜ 上位位置 ${rankPct(r)!=null?one(rankPct(r))+'%':'—'}</small></div><div class="record-actions"><button class="button" data-edit="${esc(r.id)}">編集</button><button class="button soft" data-select-to-home="${esc(r.id)}">分析</button></div></div>`).join('')}<div class="small-note" style="margin-top:13px">入力内容はブラウザの保存機能に記録します。機種変更やアプリのデータ削除に備え、JSONバックアップを保存してください。</div></div><div class="section card"><h3 class="card-title">バックアップと復元</h3><p class="card-sub">記録・目標点・学習チェックをまとめて保存できます。</p><div class="controls"><button class="button primary" data-export="json">データを書き出す</button><label class="button">バックアップを読み込む<input type="file" accept="application/json,.json" data-import style="display:none"></label><button class="button" data-reset>デモデータに戻す</button></div><p class="caption">端末の外部サーバーへデータは送信しません。書き出したJSONには成績情報が入っているので取り扱いにご注意ください。</p></div></div>`}
function render(scroll=true){const app=document.getElementById('app');if(!app)return;let body=state.tab==='analysis'?analysis():state.tab==='target'?target():state.tab==='study'?study():state.tab==='records'?records():home();app.innerHTML=shell(body);if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function parseRecord(form){const fd=new FormData(form),opt=(n,max=9999)=>{const x=String(fd.get(n)||'').trim();if(x==='')return null;const v=Number(x);return Number.isFinite(v)&&v>=0&&v<=max?v:null};const s=SUBJECTS.map((_,i)=>opt('score'+i,100)),ds=SUBJECTS.map((_,i)=>opt('dev'+i,99)),as=SUBJECTS.map((_,i)=>opt('avg'+i,100));if(s.some(x=>x==null||!Number.isInteger(x)))throw Error('得点は0〜100の整数で入力してください');if(ds.some(x=>x!=null&&x<1))throw Error('偏差値は1以上で入力してください');const d=String(fd.get('date')||'');if(!/^\d{4}-\d\d-\d\d$/.test(d))throw Error('受験日が正しくありません');const rank=opt('rank'),count=opt('count');if(rank!=null&&count!=null&&rank>count)throw Error('受験順位は受験者数以下にしてください');const avg5=opt('fiveAvg',500);return {id:editId||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),date:d,exam:String(fd.get('exam')||'').slice(0,24),scores:s,devs:ds,avgs:as,fiveDev:opt('fiveDev',99),threeDev:opt('threeDev',99),fiveAvg:avg5==null&&as.every(v=>v!=null)?Math.round(sum(as)*10)/10:avg5,threeAvg:null,rank,count}}
function reset(){if(confirm('入力した成績・目標・学習チェックを削除してデモに戻しますか？')){state=deep(DEFAULT);editId=null;safeSave();render();toast('初期状態に戻しました')}}
function saveFile(textBody,name,mime){const blob=new Blob([textBody],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function backup(){saveFile(JSON.stringify({format:'zenken-app-backup',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'zenken-backup.json','application/json;charset=utf-8');toast('バックアップを保存しました')}
function restore(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const p=JSON.parse(String(rd.result));const v=p.data;if(p.format!=='zenken-app-backup'||!v||!Array.isArray(v.records)||!v.records.length||!v.records.every(validRecord)||v.records.length>60)throw Error('形式が異なります');if(!confirm('現在の入力内容をバックアップの内容で上書きします。よろしいですか？'))return;state={...deep(DEFAULT),...v};state.records.sort((a,b)=>a.date.localeCompare(b.date));if(!byId(state.selected))state.selected=state.records.at(-1).id;if(!byId(state.reference))state.reference=state.records[0].id;state.goals=Array.isArray(state.goals)&&state.goals.length===5&&state.goals.every(v=>Number.isFinite(v)&&v>=0&&v<=100)?state.goals:[60,55,75,55,55];state.checks=state.checks&&typeof state.checks==='object'?state.checks:{};editId=null;safeSave();render();toast('バックアップを復元しました')}catch(e){toast('バックアップを読み込めませんでした')}};rd.readAsText(file)}
function onClick(e){const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){state.tab=b.dataset.tab;editId=null;safeSave();render();return}
 if(b.dataset.subject!=null){state.subject=+b.dataset.subject;safeSave();render(false);return}
 if(b.dataset.trend){state.trend=b.dataset.trend;safeSave();render(false);return}
 if(b.dataset.totalgoal){state.target=+b.dataset.totalgoal;safeSave();render(false);return}
 if(b.dataset.preset){state.goals=deep({balanced:[60,55,75,55,55],reading:[65,52,74,60,49],strong:[56,52,80,52,60]}[b.dataset.preset]);safeSave();render(false);return}
 if(b.dataset.add!==undefined){editId='';render(false);document.getElementById('recordEditor')?.scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.edit){editId=b.dataset.edit;render(false);document.getElementById('recordEditor')?.scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.closeEdit!==undefined){editId=null;render(false);return}
 if(b.dataset.selectToHome){state.selected=b.dataset.selectToHome;state.tab='home';safeSave();render();return}
 if(b.dataset.delete){if(state.records.length<=1){toast('少なくとも1件の記録が必要です');return}if(confirm('この模試の記録を削除しますか？')){state.records=state.records.filter(r=>r.id!==b.dataset.delete);if(!byId(state.selected))state.selected=state.records.at(-1).id;if(!byId(state.reference))state.reference=state.records[0].id;editId=null;safeSave();render(false);toast('記録を削除しました')}return}
 if(b.dataset.reset!==undefined){reset();return}
 if(b.dataset.export==='json'){backup();return}
 if(b.dataset.export==='summary'){const textBody=`次回模試の目標 ${sum(state.goals)}点（基準：${fScore(selected())}点）\n`+SUBJECTS.map((n,i)=>`${n} ${state.goals[i]}点（${signed(state.goals[i]-selected().scores[i])}点）`).join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(textBody).then(()=>toast('目標プランをコピーしました')).catch(()=>toast('コピーできませんでした'))}else toast('コピー機能が利用できません');return}}
function onChange(e){const t=e.target;if(t.matches('[data-reference]')){state.reference=t.value;safeSave();render(false)}else if(t.matches('[data-select-record]')){state.selected=t.value;safeSave();render(false)}else if(t.matches('[data-import]'))restore(t.files[0]);else if(t.matches('[data-check]')){state.checks[t.dataset.check]=t.checked;safeSave();render(false)}}
function onInput(e){const t=e.target;if(t.matches('[data-goal]')){const idx=Number(t.dataset.goal);state.goals[idx]=+t.value;updateTargetLive()}}
function onSubmit(e){if(e.target.id!=='recordForm')return;e.preventDefault();try{const r=parseRecord(e.target);if(state.demo){state.records=[];state.reference=r.id;state.demo=false;state.schools=[];state.units=null}const index=state.records.findIndex(x=>x.id===r.id);if(index===-1)state.records.push(r);else state.records[index]=r;state.records.sort((a,b)=>a.date.localeCompare(b.date));state.selected=r.id;if(state.reference===r.id&&state.records.length>1)state.reference=state.records.find(x=>x.id!==r.id).id;editId=null;safeSave();render();toast('成績を保存しました')}catch(err){toast(err.message||'入力内容を確認してください')}}
safeRead();render(false);
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);
})();
</script>
</body>
</html>
