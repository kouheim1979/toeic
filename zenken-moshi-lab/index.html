.pin-overlay{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 0%,#e8ebff 0%,#f5f7fb 52%,#edf8f5 100%)}
.pin-panel{width:min(100%,425px);border:1px solid #dfe5f1;border-radius:25px;padding:37px 28px;background:#fff;box-shadow:0 23px 70px #2b3e7433;text-align:center}
.pin-mark{display:grid;place-items:center;margin:auto auto 15px;width:60px;height:60px;border-radius:19px;background:linear-gradient(125deg,#5867df,#23aba3);font-size:31px;color:#fff;font-weight:800}
.pin-mini{font-size:11px;letter-spacing:.18em;color:#8793aa;font-weight:850}.pin-panel h1{font-size:29px;letter-spacing:-.06em;margin-top:12px}.pin-panel p{color:#6f7e96;font-size:13px;line-height:1.9;margin-top:10px}
.pin-label{display:block;margin:24px 0 7px;text-align:left;font-size:12px;font-weight:800;color:#475670}
.pin-panel input{width:100%;text-align:center;font-size:25px;letter-spacing:.5em;font-weight:800;min-height:54px}
.pin-submit{width:100%;margin-top:15px;min-height:52px;font-size:14px;border-radius:12px}.pin-error{min-height:20px;margin-top:9px;color:#c64c55;font-size:12px}
.pin-panel .pin-hint{font-size:10px;color:#919db1;margin-top:19px;text-align:left;line-height:1.8}
.priority-list{margin-top:8px;display:grid;gap:6px}.priority-list>div{padding:7px 10px;border-radius:8px;background:#fff}

/* Multi-exam, subject-by-subject unit analytics */
.unit-mode-tabs{display:flex;gap:6px;background:#eef1fa;border-radius:14px;padding:5px;flex-wrap:wrap}
.unit-mode-tabs button{background:transparent;border:0;border-radius:10px;padding:11px 14px;color:#69778f;font-size:12px;font-weight:850;cursor:pointer;flex:1 1 auto}
.unit-mode-tabs button.selected{background:white;color:#4658c7;box-shadow:0 2px 12px #33408018}
.unit-insights .card{padding:22px}
.unit-summary-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.unit-summary-strip>div{display:grid;align-content:center;gap:4px;background:#f4f6fb;border-radius:13px;padding:13px 15px;min-width:0}
.unit-summary-strip span{font-size:11px;color:#76849e;font-weight:800}
.unit-summary-strip strong{font-size:clamp(18px,2.2vw,27px);font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.05em}
.unit-summary-strip small{font-size:11px;letter-spacing:0;color:#8793a8}
.unit-coverage{font-size:12px;color:#63738d;line-height:1.9;margin:12px 0 18px}
.unit-agg-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 9px}
.unit-agg-toolbar label,.unit-record-label{font-size:11px;color:#7886a0;font-weight:850;display:flex;align-items:center;gap:8px}
.unit-agg-toolbar select,.unit-record-label select{max-width:100%;font-size:12px}
.unit-agg-toolbar .card-sub{margin-bottom:0;margin-top:3px}
.unit-count{font-size:11px;color:#8190aa;font-weight:800;margin-left:5px}
.unit-agg-list{border-top:1px solid #e8edf5}
.unit-agg-row{border-bottom:1px solid #e8edf5;padding:0;min-width:0}
.unit-agg-row summary{cursor:pointer;list-style:none;padding:17px 3px;user-select:none}
.unit-agg-row summary::-webkit-details-marker{display:none}
.unit-agg-head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.unit-agg-title{font-size:10px;color:#94a0b3;min-width:0;max-width:70%;line-height:1.5}
.unit-agg-title strong{display:block;font-size:13px;color:#243654;margin-top:3px;overflow-wrap:anywhere}
.unit-agg-num{font-size:18px;font-weight:950;white-space:nowrap;line-height:1.25}
.unit-agg-num small{font-size:11px;color:#8795ab}
.unit-agg-sub{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11px;color:#7a87a0;margin:7px 0 10px}
.unit-agg-sub strong{color:#3f4d69}
.unit-expand-hint{margin-left:auto;color:#6271bc}
.unit-agg-meter,.unit-month-track{height:8px;border-radius:99px;background:#edf1f8;overflow:hidden}
.unit-agg-meter span,.unit-month-track span{display:block;height:100%;border-radius:99px}
.unit-months{border-top:1px dashed #dce3f0;margin:0 0 14px;padding:12px;border-radius:10px;background:#f7f9fe}
.unit-month-label{font-size:11px;color:#71809b;font-weight:800;margin-bottom:7px}
.unit-month{display:grid;grid-template-columns:38px minmax(40px,1fr) 88px 48px;gap:7px;align-items:center;padding:8px 0;font-size:11px;border-bottom:1px solid #eaf0f9}
.unit-month:last-child{border:0}
.unit-month strong{text-align:right;font-size:11px;white-space:nowrap}

const encoder=new TextEncoder(),decoder=new TextDecoder();
function b64u(bytes){let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}

function chart(records,key='score'){

 const avgs=records.map(r=>key==='score'?ave(r):key==='dev'?50:0);
 const all=[...scores,...avgs].filter(v=>v!=null);const lo=Math.min(...all),hi=Math.max(...all); const pad=Math.max(8,(hi-lo)*.18);
 const min=key==='dev'?Math.min(35,Math.floor((lo-pad)/5)*5):key==='score'?Math.max(0,Math.floor((lo-pad)/20)*20):Math.floor((lo-pad)/10)*10;
 const max=key==='dev'?Math.max(60,Math.ceil((hi+pad)/5)*5):key==='score'?Math.ceil((hi+pad)/20)*20:Math.ceil((hi+pad)/10)*10;
 const xx=i=>L+iw*(i/Math.max(records.length-1,1));const yy=n=>T+ih-((n-min)/(max-min||1))*ih;
 const path=arr=>arr.map((v,i)=>v==null?'':(i===0||arr[i-1]==null?'M':'L')+xx(i).toFixed(1)+','+yy(v).toFixed(1)).join(' ');
 let out=`<svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の成績推移グラフ">`;
 for(let t=0;t<5;t++){const val=min+(max-min)*t/4;out+=`<line x1="${L}" x2="${W-R}" y1="${yy(val)}" y2="${yy(val)}" stroke="#e9edf5"/><text x="${L-9}" y="${yy(val)+4}" font-size="12" text-anchor="end" fill="#93a0b5">${Math.round(val)}</text>`}
 out+=`<path d="${path(avgs)}" fill="none" stroke="#b7c2d5" stroke-width="2.5" stroke-dasharray="5 6"/><path d="${path(scores)}" fill="none" stroke="#606fe4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;

}

 const c=x.current;const broadGeography=x.subject==='社会'&&['世界の地理','日本の地理'].includes(x.name);
 const delta=broadGeography||x.priorRate===undefined||x.priorRate===null?null:c.rate-x.priorRate;
 const gap=c.avg==null?null:c.got-c.avg;
 const repeatLow=x.count>=2&&x.items.filter(y=>y.got/y.max<0.5).length>=2;
 const ptsLost=c.max-c.got;const below=gap!=null&&gap<-1;
 const rank=ptsLost*.95+Math.max(0,-(gap||0))*.8+(repeatLow?7:0)+(c.rate<30?3:0)+(delta!==null&&delta<-15?3:0);
 return {delta,gap,repeatLow,ptsLost,rank,below};
}

function unitPanel(subject){const mode=['round','subject','all'].includes(state.unitMode)?state.unitMode:'round';return `<section class="section unit-insights"><div class="bar"><div><h2 class="section-title">単元別の得点分析</h2><p class="section-sub">各回の単元別得点と、登録された全回の累計を切り替えられます。</p></div></div><div class="unit-mode-tabs" role="group" aria-label="単元表示の種類"><button type="button" data-unit-mode="round" class="${mode==='round'?'selected':''}">各回・全部</button><button type="button" data-unit-mode="subject" class="${mode==='subject'?'selected':''}">教科別・全回累計</button><button type="button" data-unit-mode="all" class="${mode==='all'?'selected':''}">5教科・全回累計</button></div><div class="card" style="margin-top:13px">${mode==='round'?individualUnitPanel(subject):cumulativeUnitPanel(mode==='subject'?subject:null)}</div></section>`;}
function saveUnitForm(form){

  if(parts.length<3||parts.length>4||!parts[0]||parts[0].length>90)throw Error((i+1)+'行目：単元名と3～4項目を入力してください');

 unitEditing=false;safeSave();render(false);toast('単元別の得点を保存しました。累計にも反映されます');
}

 ${unitPanel(name)}`;
}
function target(){const sumGoals=sum(state.goals),delta=sumGoals-fScore(selected()),left=state.target-sumGoals,per=Math.min(100,Math.round(sumGoals/state.target*100));return `<div class="section" style="margin-top:2px"><h2 class="section-title">次の目標をシミュレーション</h2><p class="section-sub">スライダーを動かすと合計・必要点数が即時計算されます。合格可能性の予測ではありません。</p><div class="targetgrid"><div class="card"><div class="bar"><h3 class="card-title">目標点の割り振り</h3><div class="seg">${[280,300,320].map(n=>`<button class="${state.target===n?'on':''}" data-totalgoal="${n}">${n}点</button>`).join('')}</div></div><div class="chips"><button class="button" data-preset="balanced">バランス型</button><button class="button" data-preset="reading">英語・理科</button><button class="button" data-preset="strong">得意を伸ばす</button></div>${SUBJECTS.map((n,i)=>`<div class="targetrow"><b>${n}</b><input type="range" min="0" max="100" value="${state.goals[i]}" data-goal="${i}" aria-label="${n}の目標点"><output data-goal-output="${i}" class="mono">${state.goals[i]}点</output><div class="diff ${diffColor(state.goals[i]-selected().scores[i])}" data-goal-diff="${i}">${signed(state.goals[i]-selected().scores[i])}点</div></div>`).join('')}<div class="small-note" style="margin-top:18px">各教科100点満点。実得点と比較した目標の配分です。予想偏差値・合格確率の自動算出はしていません。</div></div><div class="bigresult"><div class="eyebrow">YOUR TARGET PLAN</div><div><span class="muted" style="color:#c0d1e8">配分の合計</span><div class="big mono"><span data-sim-total>${sumGoals}</span><small> / 500点</small></div></div><div class="donut"><svg width="176" height="176" viewBox="0 0 176 176"><circle cx="88" cy="88" r="69" fill="none" stroke="#ffffff1c" stroke-width="14"/><circle id="simArc" cx="88" cy="88" r="69" fill="none" stroke="#bbf1a2" stroke-width="14" stroke-linecap="round" transform="rotate(-90 88 88)" stroke-dasharray="433.54" stroke-dashoffset="${(433.54*(1-Math.min(1,sumGoals/state.target))).toFixed(2)}"/></svg><div class="inside"><small>目標達成率</small><b data-sim-percent>${per}%</b></div></div><div class="result-note" data-sim-note>${left>0?`設定目標まであと${left}点`:`設定目標を${-left}点上回っています`}。現状から${signed(delta)}点の配分です。</div><div class="controls"><button class="button" data-export="summary">目標プランをコピー</button></div></div></div></div>`}
function updateTargetLive(){const total=sum(state.goals),delta=total-fScore(selected()),left=state.target-total,pct=Math.round(total/state.target*100);const set=(q,txt)=>{const e=document.querySelector(q);if(e)e.textContent=txt};set('[data-sim-total]',total);set('[data-sim-percent]',pct+'%');set('[data-sim-note]',(left>0?`設定目標まであと${left}点。`:left===0?'設定目標に到達。':`設定目標を${-left}点上回っています。`)+` 現状から${signed(delta)}点の配分です。`);const arc=document.getElementById('simArc');if(arc)arc.setAttribute('stroke-dashoffset',(433.54*(1-Math.min(1,total/state.target))).toFixed(2));SUBJECTS.forEach((n,i)=>{set(`[data-goal-output="${i}"]`,state.goals[i]+'点');set(`[data-goal-diff="${i}"]`,signed(state.goals[i]-selected().scores[i])+'点')});safeSave()}
function study(){const done=Object.values(state.checks).filter(Boolean).length,all=STUDY.reduce((n,w)=>n+w.tasks.length,0);return `<div class="section" style="margin-top:2px"><h2 class="section-title">4週間の学習チェック</h2><p class="section-sub">終わった項目にチェック。端末の同じブラウザ内に進捗が保存されます。</p><div class="card" style="margin-bottom:14px"><div class="bar"><div><div class="muted" style="font-size:11px;font-weight:850">全体の進捗</div><h3 style="font-size:26px">${done} <small class="muted">/ ${all} 項目完了</small></h3></div><div style="color:var(--teal);font-size:28px;font-weight:900">${Math.round(done/all*100)}%</div></div><div class="weekprogress" style="height:12px"><span style="width:${done/all*100}%"></span></div></div><div class="weekgrid">${STUDY.map((w,i)=>{const finished=w.tasks.filter((t,j)=>state.checks[i+'-'+j]).length;return `<div class="week-card"><div class="week-head"><div><div class="week-num">WEEK ${w.name}</div><h3 class="week-title">${w.title}</h3></div><span class="tag">${finished} / ${w.tasks.length}</span></div>${w.tasks.map((t,j)=>{const checked=!!state.checks[i+'-'+j];return `<label class="checkline ${checked?'completed':''}"><input type="checkbox" data-check="${i}-${j}" ${checked?'checked':''}><span>${esc(t)}</span></label>`}).join('')}<div class="weekprogress"><span style="width:${finished/w.tasks.length*100}%"></span></div></div>`}).join('')}</div><p class="caption">目標は一般的な学習プランです。すべて終わらせることより、間違えた問題を自力で再現できることを重視します。</p></div>`}
function recordForm(id){const old=id?byId(id):null;const form=old?deep(old):{id:'',date:'',exam:'',scores:[0,0,0,0,0],devs:[null,null,null,null,null],avgs:[null,null,null,null,null],fiveDev:null,threeDev:null,fiveAvg:null,threeAvg:null,rank:null,count:null};return `<div class="form-panel" id="recordEditor"><div class="bar"><h3>${old?'成績を修正':'新しい模試を追加'}</h3><button class="button" data-close-edit>閉じる</button></div><form id="recordForm"><div class="editgrid"><label>受験日<input type="date" name="date" required value="${esc(form.date)}"></label><label>模試の回次<input type="text" name="exam" maxlength="24" value="${esc(form.exam)}" placeholder="例：第5回"></label></div><div class="table-scroll form-block"><table class="form-table"><thead><tr><th>教科</th><th>得点</th><th>偏差値</th><th>平均点</th></tr></thead><tbody>${SUBJECTS.map((n,i)=>`<tr><td>${n}</td><td><input aria-label="${n}の得点" required type="number" name="score${i}" min="0" max="100" step="1" value="${form.scores[i]}"></td><td><input aria-label="${n}の偏差値" type="number" name="dev${i}" min="1" max="99" step="0.1" value="${form.devs[i]??''}" placeholder="—"></td><td><input aria-label="${n}の平均点" type="number" name="avg${i}" min="0" max="100" step="0.1" value="${form.avgs[i]??''}" placeholder="—"></td></tr>`).join('')}</tbody></table></div><div class="editgrid" style="margin-top:12px"><label>5教科偏差値<input type="number" name="fiveDev" step="0.1" min="1" max="99" value="${form.fiveDev??''}" placeholder="任意"></label><label>3教科偏差値<input type="number" name="threeDev" step="0.1" min="1" max="99" value="${form.threeDev??''}" placeholder="任意"></label><label>5教科平均点<input type="number" name="fiveAvg" step="0.1" min="0" max="500" value="${form.fiveAvg??''}" placeholder="未入力なら各教科の合計"></label><label>受験順位<input type="number" name="rank" step="1" min="1" value="${form.rank??''}" placeholder="任意"></label><label>受験者数<input type="number" name="count" step="1" min="1" value="${form.count??''}" placeholder="任意"></label></div><div class="form-foot"><button type="submit" class="button primary">${old?'変更を保存':'新しい模試を登録'}</button>${old?`<button type="button" class="button danger" data-delete="${esc(old.id)}">この記録を削除</button>`:''}</div></form><p class="caption">偏差値・平均点・順位の空欄は「未入力」で保存します。偏差値は得点から自動計算できないため、成績表の値を入力してください。 単元別の点数は「教科分析」→「各回の詳細」→「単元内訳を編集」から登録できます。</p></div>`}
function records(){return `<div class="section" style="margin-top:2px"><h2 class="section-title">成績を追加・編集</h2><p class="section-sub">次回の模試結果を入力すると、グラフ・伸び率・平均との差が自動更新されます。</p><div class="card"><div class="bar"><h3 class="card-title">登録済みの模試</h3><button class="button primary" data-add>＋ 記録を追加</button></div>${editId!==null?recordForm(editId):''}${state.records.map(r=>`<div class="record-card"><div><b>${esc(label(r))} ${esc(r.exam||'')} <span class="em mono">${fScore(r)}点</span></b><small>${fullDate(r)} ｜ 5教科偏差値 ${r.fiveDev??'—'} ｜ 上位位置 ${rankPct(r)!=null?one(rankPct(r))+'%':'—'}</small></div><div class="record-actions"><button class="button" data-edit="${esc(r.id)}">編集</button><button class="button soft" data-select-to-home="${esc(r.id)}">分析</button></div></div>`).join('')}<div class="small-note" style="margin-top:13px">入力内容は端末内で暗号化保存します。別の端末に移すときはJSONを書き出してください。書き出しファイル自体は暗号化されないため取り扱いに注意してください。</div></div><div class="section card"><h3 class="card-title">バックアップと復元</h3><p class="card-sub">記録・目標点・学習チェックをまとめて保存できます。</p><div class="controls"><button class="button primary" data-export="json">データを書き出す</button><label class="button">バックアップを読み込む<input type="file" accept="application/json,.json" data-import style="display:none"></label><button class="button" data-reset>デモデータに戻す</button></div><p class="caption">実名は含みません。保存したJSONバックアップ自体は暗号化されないため、第三者へ送らないでください。</p></div></div>`}
function render(scroll=true){const app=document.getElementById('app');if(!app)return;let body=state.tab==='diagnosis'?diagnosis():state.tab==='analysis'?analysis():state.tab==='target'?target():state.tab==='study'?study():state.tab==='records'?records():home();app.innerHTML=shell(body);if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function parseRecord(form){const fd=new FormData(form),opt=(n,max=9999)=>{const x=String(fd.get(n)||'').trim();if(x==='')return null;const v=Number(x);return Number.isFinite(v)&&v>=0&&v<=max?v:null};const s=SUBJECTS.map((_,i)=>opt('score'+i,100)),ds=SUBJECTS.map((_,i)=>opt('dev'+i,99)),as=SUBJECTS.map((_,i)=>opt('avg'+i,100));if(s.some(x=>x==null||!Number.isInteger(x)))throw Error('得点は0〜100の整数で入力してください');if(ds.some(x=>x!=null&&x<1))throw Error('偏差値は1以上で入力してください');const d=String(fd.get('date')||'');if(!/^\d{4}-\d\d-\d\d$/.test(d))throw Error('受験日が正しくありません');const rank=opt('rank'),count=opt('count');if(rank!=null&&count!=null&&rank>count)throw Error('受験順位は受験者数以下にしてください');const avg5=opt('fiveAvg',500);return {id:editId||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),date:d,exam:String(fd.get('exam')||'').slice(0,24),scores:s,devs:ds,avgs:as,fiveDev:opt('fiveDev',99),threeDev:opt('threeDev',99),fiveAvg:avg5==null&&as.every(v=>v!=null)?Math.round(sum(as)*10)/10:avg5,threeAvg:null,rank,count}}
function reset(){if(confirm('入力した成績・目標・学習チェックを削除してデモに戻しますか？')){state=deep(DEFAULT);editId=null;safeSave();render();toast('初期状態に戻しました')}}
function saveFile(textBody,name,mime){const blob=new Blob([textBody],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function backup(){saveFile(JSON.stringify({format:'zenken-app-backup',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'zenken-backup.json','application/json;charset=utf-8');toast('バックアップを保存しました')}
function restore(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const p=JSON.parse(String(rd.result));const v=p.data;if(p.format!=='zenken-app-backup'||!v||!Array.isArray(v.records)||!v.records.length||!v.records.every(validRecord)||v.records.length>60)throw Error('形式が異なります');if(!confirm('現在の入力内容をバックアップの内容で上書きします。よろしいですか？'))return;state={...deep(DEFAULT),...v,unitsByRecord:{...state.unitsByRecord,...v.unitsByRecord}};if(v.units&&!state.unitsByRecord?.sep)state.unitsByRecord={...state.unitsByRecord,sep:v.units};state.records.sort((a,b)=>a.date.localeCompare(b.date));if(!byId(state.selected))state.selected=state.records.at(-1).id;if(!byId(state.reference))state.reference=state.records[0].id;state.goals=Array.isArray(state.goals)&&state.goals.length===5&&state.goals.every(v=>Number.isFinite(v)&&v>=0&&v<=100)?state.goals:[60,55,75,55,55];state.checks=state.checks&&typeof state.checks==='object'?state.checks:{};editId=null;safeSave();render();toast('バックアップを復元しました')}catch(e){toast('バックアップを読み込めませんでした')}};rd.readAsText(file)}
function onClick(e){const b=e.target.closest('button');if(!b)return;
 if(b.dataset.logout!==undefined){logOut();return}
 if(b.dataset.diagSubject!==undefined){state.focusSubject=b.dataset.diagSubject;safeSave();render(false);return}
 if(b.dataset.unitJump){state.tab='analysis';state.unitMode=b.dataset.unitJump;unitEditing=false;safeSave();render();return}
 if(b.dataset.unitMode){state.unitMode=b.dataset.unitMode;unitEditing=false;safeSave();render(false);return}
 if(b.dataset.unitEdit!==undefined){unitEditing=!unitEditing;render(false);return}
 if(b.dataset.unitCancel!==undefined){unitEditing=false;render(false);return}
 if(b.dataset.tab){state.tab=b.dataset.tab;editId=null;safeSave();render();return}
 if(b.dataset.subject!=null){state.subject=+b.dataset.subject;unitEditing=false;safeSave();render(false);return}
 if(b.dataset.trend){state.trend=b.dataset.trend;safeSave();render(false);return}
 if(b.dataset.totalgoal){state.target=+b.dataset.totalgoal;safeSave();render(false);return}
 if(b.dataset.preset){state.goals=deep({balanced:[60,55,75,55,55],reading:[65,52,74,60,49],strong:[56,52,80,52,60]}[b.dataset.preset]);safeSave();render(false);return}
 if(b.dataset.add!==undefined){editId='';render(false);document.getElementById('recordEditor')?.scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.edit){editId=b.dataset.edit;render(false);document.getElementById('recordEditor')?.scrollIntoView({block:'start',behavior:'smooth'});return}
 if(b.dataset.closeEdit!==undefined){editId=null;render(false);return}
 if(b.dataset.selectToHome){state.selected=b.dataset.selectToHome;state.tab='home';unitEditing=false;safeSave();render();return}
 if(b.dataset.delete){if(state.records.length<=1){toast('少なくとも1件の記録が必要です');return}if(confirm('この模試の記録を削除しますか？')){state.records=state.records.filter(r=>r.id!==b.dataset.delete);if(!byId(state.selected))state.selected=state.records.at(-1).id;if(!byId(state.reference))state.reference=state.records[0].id;delete (state.unitsByRecord||{})[b.dataset.delete];unitEditing=false;editId=null;safeSave();render(false);toast('記録を削除しました')}return}
 if(b.dataset.reset!==undefined){reset();return}
 if(b.dataset.export==='json'){backup();return}
 if(b.dataset.export==='summary'){const textBody=`次回模試の目標 ${sum(state.goals)}点（基準：${fScore(selected())}点）\n`+SUBJECTS.map((n,i)=>`${n} ${state.goals[i]}点（${signed(state.goals[i]-selected().scores[i])}点）`).join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(textBody).then(()=>toast('目標プランをコピーしました')).catch(()=>toast('コピーできませんでした'))}else toast('コピー機能が利用できません');return}}
function onChange(e){const t=e.target;if(t.matches('[data-diag-round]')){state.focusRound=t.value;state.diagnosisView='focus';safeSave();render(false)}else if(t.matches('[data-diag-view]')){state.diagnosisView=t.value;safeSave();render(false)}else if(t.matches('[data-reference]')){state.reference=t.value;safeSave();render(false)}else if(t.matches('[data-select-record]')){state.selected=t.value;state.unitRecord=t.value;safeSave();render(false)}else if(t.matches('[data-unit-record]')){state.unitRecord=t.value;unitEditing=false;safeSave();render(false)}else if(t.matches('[data-unit-sort]')){state.unitSort=t.value;safeSave();render(false)}else if(t.matches('[data-import]'))restore(t.files[0]);else if(t.matches('[data-check]')){state.checks[t.dataset.check]=t.checked;safeSave();render(false)}}
function onInput(e){const t=e.target;if(t.matches('[data-goal]')){const idx=Number(t.dataset.goal);state.goals[idx]=+t.value;updateTargetLive()}}
function onSubmit(e){if(e.target.id==='pinForm'){e.preventDefault();const pin=String(new FormData(e.target).get('pin')||'');if(/^\d{4}$/.test(pin))unlockWithPin(pin);else document.getElementById('pinError').textContent='4桁の数字を入力してください。';return;}if(e.target.id==='unitForm'){e.preventDefault();try{saveUnitForm(e.target)}catch(err){toast(err.message||'入力内容を確認してください')}return;}if(e.target.id!=='recordForm')return;e.preventDefault();try{const r=parseRecord(e.target);if(state.demo){state.records=[];state.reference=r.id;state.demo=false;state.schools=[];state.units=null}const index=state.records.findIndex(x=>x.id===r.id);if(index===-1)state.records.push(r);else state.records[index]=r;state.records.sort((a,b)=>a.date.localeCompare(b.date));state.selected=r.id;state.unitRecord=r.id;if(state.reference===r.id&&state.records.length>1)state.reference=state.records.find(x=>x.id!==r.id).id;editId=null;safeSave();render();toast('成績を保存しました')}catch(err){toast(err.message||'入力内容を確認してください')}}
initialize();
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);
})();
</script>
</body>
</html>
