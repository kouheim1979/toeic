function baseSave(){
  return {
    version:3,rems:baseRems(),xp:0,totalAnswered:0,totalCorrect:0,totalWrong:0,bestStreak:0,
    weak:{},favorites:{},mastery:{},badges:{},studyByDate:{},correctByDate:{},reviewByDate:{},lastStudyDate:"",
    streakDays:0,settings:{sound:true,showKana:true,autoSpeak:false,dailyGoal:20}
  };
}
let data=loadData();

function loadData(){
  const base=baseSave();let raw=null;
  try{localStorage.setItem("__eigo_test__","1");localStorage.removeItem("__eigo_test__");raw=localStorage.getItem(STORAGE_KEY);}
  catch(e){storageAvailable=false;return base;}
  if(!raw)return base;
  try{return normaliseSave(JSON.parse(raw));}
  catch(e){
    storageNotice="保存データの形式を読み込めませんでした。元のデータは復旧用バックアップとして残しています。";
    try{localStorage.setItem(STORAGE_KEY+"_recovery_"+Date.now(),raw);}
    catch(e){storageAvailable=false;storageNotice="保存データを読めません。元データを保護するため、この回の保存を止めました。";}
    return base;
  }
}
function persist(){
  if(!storageAvailable)return;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}
  catch(e){storageAvailable=false;showToast("記録を保存できません。設定からバックアップを書き出してください");}
}
function h(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function unique(arr){return [...new Set(arr)];}
function byId(id){return QUESTIONS.find(q=>q.id===id)||null;}
function today(){
  const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dayDiff(a,b){
  if(!a||!b)return null;
  const aa=new Date(a+"T00:00:00"),bb=new Date(b+"T00:00:00");
  return Math.round((bb-aa)/86400000);
}
function level(){return Math.floor(data.xp/100)+1;}
function levelProgress(){return data.xp%100;}
function accuracy(c,t){return t?Math.round(c/t*100):0;}
function todayCount(){return data.studyByDate[today()]||0;}
function weakIds(){return Object.keys(data.weak).filter(id=>(data.weak[id]||0)>0&&byId(id));}
function favIds(){return Object.keys(data.favorites).filter(id=>data.favorites[id]&&byId(id));}
function masteredCount(){
  return Object.values(data.mastery).filter(m=>(m.correct||0)>=3 && accuracy(m.correct||0,(m.correct||0)+(m.wrong||0))>=80).length;
}
function updateTop(){
  if(data.lastStudyDate&&dayDiff(data.lastStudyDate,today())>1)data.streakDays=0;
  levelPill.textContent=`Lv.${level()} · ${levelProgress()}XP`;
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.nav===navSection()));
}
function navSection(){
  if(["play","setup","quiz","result","rems-hub","rems-drill","rems-result","rems-cards"].includes(state.screen))return"play";
  return state.screen;
}
function go(screen){

}
function announce(text){liveEl.textContent="";setTimeout(()=>liveEl.textContent=text,20);}
function showToast(text){
  clearTimeout(toastHandle);toastEl.textContent=text;toastEl.classList.add("show");
  toastHandle=setTimeout(()=>toastEl.classList.remove("show"),1900);
}
function maybeVibrate(pattern){if("vibrate"in navigator)try{navigator.vibrate(pattern);}catch(e){}}
function tone(type){
  if(!data.settings.sound)return;
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    const now=audioCtx.currentTime;
    o.type="sine";
    o.frequency.setValueAtTime(type==="ok"?620:220,now);
    if(type==="ok")o.frequency.exponentialRampToValueAtTime(880,now+.12);
    g.gain.setValueAtTime(.05,now);g.gain.exponentialRampToValueAtTime(.001,now+.16);
    o.start(now);o.stop(now+.17);
  }catch(e){}
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const chars=["⭐","✨","🎉","🔤","💫","🌈"];
  for(let i=0;i<14;i++){
    const s=document.createElement("span");s.className="spark";s.textContent=chars[Math.floor(Math.random()*chars.length)];
    s.style.left=(35+Math.random()*30)+"vw";s.style.top=(26+Math.random()*20)+"vh";
    s.style.setProperty("--dx",((Math.random()-.5)*280)+"px");s.style.setProperty("--dy",(90+Math.random()*210)+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),850);
  }
}
function unlock(key){
  if(!BADGES[key]||data.badges[key])return;
  data.badges[key]=true;state.newBadges.push(key);showToast(`${BADGES[key].icon} バッジ獲得：${BADGES[key].name}`);
}
function touchStudyDate(){
  const t=today();
  if(data.lastStudyDate===t)return;
  const diff=dayDiff(data.lastStudyDate,t);
  data.streakDays=diff===1?Math.max(1,data.streakDays+1):1;
  data.lastStudyDate=t;
  if(data.streakDays>=3)unlock("study3");
}
function recordStudy(){
  const t=today();data.studyByDate[t]=(data.studyByDate[t]||0)+1;touchStudyDate();
}
function addMastery(id,ok){
  const m=data.mastery[id]||{correct:0,wrong:0,last:""};
  if(ok)m.correct++;else m.wrong++;
  m.last=new Date().toISOString();data.mastery[id]=m;
}
function addWeak(id){
  data.weak[id]=Math.min(5,(data.weak[id]||0)+1);
}
function improveWeak(id){
  const before=data.weak[id]||0;
  if(!before)return;
  data.weak[id]=before-1;
  if(data.weak[id]<=0){
    delete data.weak[id];
    if(before===1 && ((data.mastery[id]?.wrong)||0)>=3)unlock("weakClear");
  }
}
function filters(q){
  return (state.genre==="すべて"||q.genre===state.genre) &&
         (state.difficulty==="すべて"||q.difficulty===state.difficulty);
}
function buildQueue(){
  let pool=QUESTIONS.filter(filters);
  if(state.sessionType==="weak")pool=pool.filter(q=>data.weak[q.id]);
  if(state.sessionType==="favorite")pool=pool.filter(q=>data.favorites[q.id]);
  if(!pool.length)return [];
  const n=Math.min(SESSION_LENGTH,pool.length);
  if(state.sessionType==="adaptive"){
    const weak=pool.filter(q=>data.weak[q.id]).sort((a,b)=>(data.weak[b.id]||0)-(data.weak[a.id]||0)).slice(0,Math.min(4,n));
    const chosen=new Set(weak.map(q=>q.id));
    const rest=shuffle(pool.filter(q=>!chosen.has(q.id))).slice(0,n-weak.length);
    return shuffle([...weak,...rest]).map(q=>q.id);
  }
  return shuffle(pool).slice(0,n).map(q=>q.id);
}
function startSession(type="normal"){
  cleanupPractice();
  state.sessionType=type;state.queue=buildQueue();state.index=0;state.sessionCorrect=0;state.sessionWrong=0;
  state.sessionXP=0;state.sessionStreak=0;state.bestSessionStreak=0;state.startedAt=Date.now();state.newBadges=[];
  if(!state.queue.length){showToast(type==="weak"?"苦手問題はまだありません":type==="favorite"?"お気に入りがありません":"条件に合う問題がありません");return;}
  state.screen="quiz";prepareQuestion();render();window.scrollTo({top:0});
}
function optionProperty(){return(state.mode==="enja"||state.mode==="speed"||state.mode==="listen")?"japanese":"english";}
function prepareQuestion(){
  stopTimer();cancelSpeech();
  if(state.index>=state.queue.length){finishSession();return;}
  const original=byId(state.queue[state.index]);
  const q=original&&state.mode==="fill"&&FILL_FIXES[original.id]?{...original,...FILL_FIXES[original.id]}:original;
  if(!q){state.index++;prepareQuestion();return;}
  state.q=q;state.answered=false;state.timedOut=false;state.selected="";
  const prop=optionProperty();state.correctValue=q[prop];
  let same=QUESTIONS.filter(x=>x.id!==q.id&&x.genre===q.genre).map(x=>x[prop]);
  let all=QUESTIONS.filter(x=>x.id!==q.id).map(x=>x[prop]);
  const wrong=shuffle(unique([...same,...all].filter(x=>x&&x!==state.correctValue))).slice(0,3);
  state.options=shuffle([state.correctValue,...wrong]);
  state.seconds=8;state.deadline=0;state.paused=false;
}
const FILL_FIXES={
  food_008:{english:"Vegetable",example:"Vegetable soup is ready.",exampleJa:"野菜スープができました。"},
  daily_006:{english:"What is this?",example:"What is this? It is a map.",exampleJa:"これは何ですか。地図です。"},
  daily_007:{english:"Can I try?",example:"Can I try? It looks fun.",exampleJa:"やってみてもいいですか。楽しそうです。"}
};
function blankSentence(q){
  const needle=q.english.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp("(^|[^A-Za-z])("+needle+")(?=$|[^A-Za-z])","i");
  return q.example.replace(re,(_,prefix)=>prefix+"______");
}
function questionPrompt(){
  if(state.mode==="jaen")return{label:"この日本語に合う英語は？",main:state.q.japanese,sub:`${state.q.genre} · ${state.q.difficulty}`};
  if(state.mode==="enja")return{label:"この英語の意味は？",main:state.q.english,sub:data.settings.showKana?`読み：${state.q.kana}`:`${state.q.genre} · ${state.q.difficulty}`};
  if(state.mode==="fill")return{label:"空欄に入る英語は？",main:blankSentence(state.q),sub:state.q.exampleJa,sentence:true};
  if(state.mode==="speed")return{label:"8秒以内！この英語の意味は？",main:state.q.english,sub:data.settings.showKana?`読み：${state.q.kana}`:"早押しでボーナスXP"};
  return{label:"音声を聞いて意味を選ぼう",main:"",sub:"🔊を何回押してもOKです",listen:true};
}
function startSpeedTimer(){
  stopTimer();
  if(state.mode!=="speed"||state.answered||state.paused)return;
  if(!state.deadline)state.deadline=performance.now()+state.seconds*1000;
  timerHandle=setInterval(()=>{
    state.seconds=Math.max(0,(state.deadline-performance.now())/1000);
    const el=document.getElementById("timerNum"),bar=document.getElementById("timerBar");
    if(el)el.textContent=state.seconds.toFixed(1);
    if(bar)bar.style.width=(state.seconds/8*100)+"%";
    if(state.seconds<=0){stopTimer();answer("__TIMEOUT__");}
  },100);
}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}}
function answer(value){
  if(state.screen!=="quiz"||state.answered||!state.q||state.paused)return;
  if(value!=="__TIMEOUT__"&&!state.options.includes(value))return;
  cancelSpeech();
  stopTimer();state.answered=true;state.selected=value;state.timedOut=value==="__TIMEOUT__";
  const ok=value===state.correctValue;
  const wasWeak=!!data.weak[state.q.id];
  state.sessionStreak=ok?state.sessionStreak+1:0;
  state.bestSessionStreak=Math.max(state.bestSessionStreak,state.sessionStreak);
  if(ok){state.sessionCorrect++;data.totalCorrect++;data.bestStreak=Math.max(data.bestStreak,state.sessionStreak);improveWeak(state.q.id);}
  else{state.sessionWrong++;data.totalWrong++;addWeak(state.q.id);}
  data.totalAnswered++;recordStudy();addMastery(state.q.id,ok);
  const studyKey=today();
  if(ok)data.correctByDate[studyKey]=(data.correctByDate[studyKey]||0)+1;
  if(wasWeak)data.reviewByDate[studyKey]=(data.reviewByDate[studyKey]||0)+1;
  let xp=ok?10:2;
  if(ok&&state.mode==="speed")xp+=Math.max(0,Math.floor(state.seconds));
  if(ok&&state.sessionStreak>0&&state.sessionStreak%5===0)xp+=10;
  data.xp+=xp;state.sessionXP+=xp;
  if(data.totalCorrect>=1)unlock("first");
  if(state.sessionStreak>=5)unlock("streak5");
  if(state.sessionStreak>=10)unlock("streak10");
  if(data.totalAnswered>=50)unlock("answered50");
  if(data.totalAnswered>=100)unlock("answered100");
  persist();
  tone(ok?"ok":"ng");maybeVibrate(ok?35:[50,35,50]);if(ok&&state.sessionStreak%5===0)confetti();
  render();
  announce(ok?`正解です。${state.q.english}、${state.q.japanese}`:`不正解です。正解は${state.correctValue}です。`);
}
function nextQuestion(){if(state.screen!=="quiz"||!state.answered)return;state.index++;prepareQuestion();if(state.screen==="quiz"){render();window.scrollTo({top:0,behavior:"smooth"});}}
function finishSession(){
  cancelSpeech();stopTimer();state.screen="result";
  if(state.queue.length===10&&state.sessionCorrect===10){unlock("perfect");confetti();}
  persist();render();window.scrollTo({top:0,behavior:"smooth"});
}

  persist();render();showToast(data.favorites[id]?"⭐ お気に入りに追加":"お気に入りを解除");
}
function setSetting(key,value){
  if(!(key in data.settings))return;
  data.settings[key]=value;persist();render();
}
function resetAll(){
  if(!confirm("学習記録・XP・苦手・お気に入り・バッジをすべて消します。元に戻せません。よろしいですか？"))return;
  cleanupPractice();stopTimer();data=baseSave();persist();state.screen="home";render();showToast("学習記録をリセットしました");
}

  if(state.screen==="rems-cards"){renderDrillCards();return;}

  else if(state.screen==="play")renderPlay();

  else if(state.screen==="quiz")renderQuiz();
  else if(state.screen==="result")renderResult();

  else if(state.screen==="stats")renderStats();
  else if(state.screen==="library")renderLibrary();
  else if(state.screen==="settings")renderSettings();
  else{state.screen="home";renderHome();}
}

/* ==================== SENTENCE LAB / REMS-inspired ====================
 * 発話は自己評価。音声認識・発音の自動採点は行いません。
 * 語順練習のみ文字列照合。音声は端末内の英語音声だけを使用します。
 */
function baseRems(){return{version:1,items:{},favorites:{},attempts:0,independent:0,assisted:0,retry:0,best:0,days:{},prefs:{level:2,mode:"speak",rate:.85,showSource:false}};}
function int(v,max=100000000){return Number.isFinite(Number(v))?Math.max(0,Math.min(max,Math.floor(Number(v)))):0;}
function object(v){return !!v&&typeof v==="object"&&!Array.isArray(v);}
function cleanMap(v,allow,convert){const out={};if(object(v))Object.entries(v).forEach(([k,x])=>{if(allow(k))out[k]=convert(x);});return out;}
function normaliseSave(p){
  if(!object(p))throw Error("保存形式が不正です");
  const b=baseSave();
  ["xp","totalAnswered","totalCorrect","totalWrong","bestStreak","streakDays"].forEach(k=>b[k]=int(p[k]));
  b.totalAnswered=b.totalCorrect+b.totalWrong;
  const known=id=>QUESTIONS.some(q=>q.id===id),date=k=>/^\d{4}-\d{2}-\d{2}$/.test(k);
  b.lastStudyDate=date(p.lastStudyDate||"")?p.lastStudyDate:"";
  b.weak=cleanMap(p.weak,known,x=>int(x,5));b.favorites=cleanMap(p.favorites,known,x=>x===true);
  b.mastery=cleanMap(p.mastery,known,x=>({correct:int(x?.correct),wrong:int(x?.wrong),last:typeof x?.last==="string"?x.last:""}));
  b.badges=cleanMap(p.badges,k=>Object.hasOwn(BADGES,k),x=>x===true);
  ["studyByDate","correctByDate","reviewByDate"].forEach(k=>b[k]=cleanMap(p[k],date,x=>int(x)));
  if(object(p.settings)){
    ["sound","showKana","autoSpeak"].forEach(k=>{if(typeof p.settings[k]==="boolean")b.settings[k]=p.settings[k];});
    if([10,20,30,50].includes(Number(p.settings.dailyGoal)))b.settings.dailyGoal=Number(p.settings.dailyGoal);
  }
  const r=object(p.rems)?p.rems:{},d=baseRems();
  ["attempts","independent","assisted","retry","best"].forEach(k=>d[k]=int(r[k]));
  d.attempts=d.independent+d.assisted+d.retry;
  d.favorites=cleanMap(r.favorites,k=>DRILL_INDEX.has(k),x=>x===true);

}
function renderDrillCards(){const pool=drillPool();root.innerHTML=`<section class="card"><div class="section-title"><h2>反復ドリルの例文帳</h2><button class="textbutton" data-r="hub">練習へ →</button></div>${renderRemsControls()}<p class="muted small">現在の難易度で ${pool.length}ドリル。番号と例文は本アプリ独自です。</p>${pool.map(d=>`<details class="list-item"><summary><span class="tag">${DRILL_TYPES[d.type]}</span> ${h(d.answer)}</summary><p class="muted">元の文：${h(d.source)}</p><p>${h(d.cueJa)}</p><p><strong>${h(d.ja)}</strong></p><p>${h(d.tip)}</p><div class="toolbar"><button class="btn soft" data-speak="${h(d.answer)}">🔊 見本</button><button class="btn soft" data-r="favorite" data-id="${d.id}">${data.rems.favorites[d.id]?"★ 登録済み":"☆ 登録"}</button></div></details>`).join("")}</section>`;}
function remsStats(){const r=data.rems;return `<section class="card"><h2>反復トレーニングの記録</h2><p class="muted small">発話の自己評価と語順判定の合計です。4択クイズの正答率とは分けています。</p><div class="stats"><div class="stat"><div class="stat-num">${r.attempts}</div><div class="stat-label">ドリル練習数</div></div><div class="stat"><div class="stat-num">${r.independent}</div><div class="stat-label">自力クリア</div></div><div class="stat"><div class="stat-num">${r.assisted}</div><div class="stat-label">見本・ヒント使用</div></div><div class="stat"><div class="stat-num">${r.retry}</div><div class="stat-label">再練習の記録</div></div></div><p class="small muted">苦手・復習候補 ${dueDrills().length}件。学習数・XPには反映されます。</p><button class="btn soft" data-r="review">復習する</button></section>`;}
function exportProgress(){
  try{const blob=new Blob([JSON.stringify({app:"eigo-himatsubushi-quest",schema:3,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`eigo-progress-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);showToast("学習記録を書き出しました");}catch(e){showToast("書き出しに失敗しました");}
}
async function importProgress(file){
  if(!file)return;if(file.size>2*1024*1024){showToast("2MB以下の学習記録を選んでください");return;}
  try{
    const parsed=JSON.parse(await file.text());
    if(parsed.app!=="eigo-himatsubushi-quest"||!object(parsed.data))throw Error("このアプリのバックアップではありません");
    const next=normaliseSave(parsed.data);
    if(!confirm("現在の学習記録を、選んだバックアップの記録に置き換えます。続けますか？"))return;
    cleanupPractice();stopTimer();data=next;persist();go("home");showToast("学習記録を読み込みました");
  }catch(e){showToast("読み込めません。このアプリのJSONバックアップを選んでください");}
}
function backupControls(){return `<section class="card"><h2>記録を持ち運ぶ</h2><p class="muted small">別のブラウザや公開URLでは、記録が自動で移らないことがあります。JSONファイルを書き出し、移動先で読み込んでください。</p><div class="toolbar"><button class="btn soft" data-r="export">記録を書き出す</button><label class="btn soft">記録を読み込む<input type="file" id="progressImport" accept=".json,application/json" class="sr"></label></div></section><section class="card"><h3>このアプリについて</h3><p class="muted small">R.E.M.S.はQQEnglishの学習メソッドです。本アプリは反復・置換・拡張練習を参考にした非公式の独立アプリであり、公式教材・公式音声は収録していません。実際のレッスンの代替や同等の効果を保証するものではありません。</p><p class="muted small">端末内の英語音声だけを使用し、外部の音声認識は呼び出しません。音声がない場合は文字・語順練習で利用できます。音声の準備は端末の設定で確認してください。</p><p class="muted small">バージョン：3.0.0 · 単語100件＋独自ドリル120件</p></section>`;}
function handleRemsAction(b){
  if(b.disabled)return;const a=b.dataset.r,d=rItem(),token=Number(b.dataset.token);
  if(a==="hub")go("rems-hub");
  else if(a==="cards")go("rems-cards");
  else if(["smart","review","favorites"].includes(a))startDrills(a);
  else if(a==="lesson")startDrills("lesson",b.dataset.id);
  else if(a==="prompt")playDrill();
  else if(a==="model"&&d)speak(d.answer);
  else if(a==="sound-test")speak("I am ready. Let's practice English.");
  else if(a==="source"&&state.screen==="rems-drill"){rs.showSource=!rs.showSource;renderDrill();}
  else if(a==="record")toggleRecording();
  else if(a==="reveal"&&state.screen==="rems-drill"&&["ready","listen"].includes(rs.phase)){cleanupPractice();rs.phase="answer";rs.hinted=data.rems.prefs.mode==="order";rs.message="";renderDrill();}
  else if(a==="again"&&rs.phase==="answer"){cancelSpeech();rs.phase="ready";rs.hinted=true;rs.selected=[];rs.message="見本を閉じました。もう一度組み立ててみよう。";renderDrill();}
  else if(a==="grade")gradeDrill(Number(b.dataset.grade),token);
  else if(a==="check")checkOrder();
  else if(a==="pick"&&["ready","listen"].includes(rs.phase)){const n=Number(b.dataset.i);if(Number.isInteger(n)&&n>=0&&n<rs.tokens.length&&!rs.selected.includes(n)){rs.selected.push(n);rs.message="";renderDrill();}}
  else if(a==="unpick"&&["ready","listen"].includes(rs.phase)){rs.selected.splice(Number(b.dataset.i),1);renderDrill();}
  else if(a==="clear"&&["ready","listen"].includes(rs.phase)){rs.selected=[];renderDrill();}
  else if(a==="next"&&token===rs.token&&rs.phase==="rated"){rs.index++;if(rs.index>=rs.queue.length)finishDrills();else{prepareDrill();render();window.scrollTo({top:0});}}
  else if(a==="finish"&&state.screen==="rems-drill"){if(rs.phase!=="rated"&&!confirm("この問題は未記録です。記録済みの問題だけで結果を見ますか？"))return;finishDrills();}
  else if(a==="retry")startDrills("retry","",rs.results.filter(x=>x.grade<2).map(x=>x.id));
  else if(a==="favorite"&&DRILL_INDEX.has(b.dataset.id)){const id=b.dataset.id;data.rems.favorites[id]=!data.rems.favorites[id];persist();b.textContent=data.rems.favorites[id]?"★ お気に入り済み":"☆ 例文を保存";}
  else if(a==="export")exportProgress();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(b)handleRemsAction(b);});
document.addEventListener("change",e=>{
  const el=e.target;if(el.id==="progressImport")importProgress(el.files[0]);
  if(el.dataset.rPref){const k=el.dataset.rPref,v=k==="showSource"?el.checked:k==="mode"?el.value:Number(el.value);const allowed={level:[0,1,2,3],rate:[.65,.85,1,1.15],mode:["speak","order"],showSource:[true,false]};if(allowed[k]?.includes(v)){data.rems.prefs[k]=v;persist();render();}}
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){cleanupPractice();if(state.screen==="quiz"&&state.mode==="speed"&&!state.answered){stopTimer();state.paused=true;renderQuiz();}}
  else if(state.screen==="rems-drill"){if(rs.phase==="listen")rs.phase="ready";renderDrill();}
});
window.addEventListener("pagehide",()=>{cleanupPractice();stopTimer();persist();});

render();
</script>
</body>
