<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7e7">
<title>えいごヒマつぶしクエスト</title>
<style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff8ea;color:#263238;display:grid;place-items:center;min-height:100vh}.boot{padding:24px;text-align:center}.spin{font-size:48px;animation:s 1.2s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="boot"><div class="spin">🧭</div><h1>えいごヒマつぶしクエスト</h1><p>AI先生を準備しています…</p></div>
<noscript>JavaScriptを有効にしてください。</noscript>
<script>
(async()=>{
  try{
    const r=await fetch('./legacy.html?v=20260916-stt1',{cache:'no-store'});
    if(!r.ok)throw new Error('legacy '+r.status);
    let html=await r.text();
    html=html.replace('</head>','<link rel="stylesheet" href="./ai-addon.css?v=20260916-stt1"></head>');
    const speechHotfix='<script>(function(){try{var k="eigo_ai_config_v1",x=JSON.parse(localStorage.getItem(k)||"{}");if(!x.sttFix20260916){x.preferNative=true;x.sttFix20260916=true;localStorage.setItem(k,JSON.stringify(x));}}catch(e){}})();<' + '/script>';
    const addon='<script src="./ai-addon.js?v=20260916-stt1"><' + '/script>';
    html=html.replace('</body>',speechHotfix+addon+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<main class="boot"><h1>読み込みに失敗しました</h1><p>ページを再読み込みしてください。</p><button onclick="location.reload()">再読み込み</button></main>';
  }
})();
</script>
</body>
</html>
