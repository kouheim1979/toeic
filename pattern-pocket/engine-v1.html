</style></head><body><div class="shell"><aside class="sidebar"><button class="brand" data-action="home" aria-label="Pattern Pocket ホーム"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8l-6 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8m-8 4h5"/></svg></span><span class="brand-name">Pattern Pocket<span class="brand-sub">英語を、あなたの口ぐせに。</span></span></button><div class="side-caption">YOUR ENGLISH JOURNEY</div><nav class="nav" aria-label="メインメニュー"><button class="nav-btn" data-nav="home" data-action="home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H15v-7H9v7H3Z"/></svg><span>ホーム</span></button><button class="nav-btn" data-nav="patterns" data-action="patterns"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V5c-3-1-7-1-10 1Zm0 0v15"/></svg><span>パターン</span></button><button class="nav-btn" data-nav="progress" data-action="progress"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18h17M8 16v-4m5 4V8m5 8V5"/></svg><span>学習記録</span></button><button class="nav-btn" data-nav="settings" data-action="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/></svg><span>設定</span></button></nav><div class="side-note"><div class="row"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3C7 2 2 9 6 16s17 3 14-13ZM4 21 16 9"/></svg><strong>ひとことが、力になる。</strong></div><p>毎日ひとつの型を、<br>あなたの言葉にしていこう。</p></div><div class="side-footer">ORIGINAL MATERIAL · 80 PATTERNS</div></aside><main class="main-shell"><header class="topbar"><div class="mobile-brand"><button class="brand" data-action="home" aria-label="Pattern Pocket ホーム"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8l-6 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8m-8 4h5"/></svg></span><span class="brand-name">Pattern Pocket<span class="brand-sub">英語を、あなたの口ぐせに。</span></span></button></div><div id="top-date" class="top-title"></div><div class="top-badge"><span class="dot"></span><span id="connection-label">端末に保存</span></div></header><div id="storage-warning" class="storage-warning" role="alert" hidden></div><div id="view"></div><noscript><div class="noscript">このアプリの練習にはJavaScriptが必要です。JavaScriptが動くブラウザーで開いてください。</div></noscript></main><nav class="mobile-nav" aria-label="メインメニュー"><button data-nav="home" data-action="home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H15v-7H9v7H3Z"/></svg><span>ホーム</span></button><button data-nav="patterns" data-action="patterns"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V5c-3-1-7-1-10 1Zm0 0v15"/></svg><span>パターン</span></button><button data-nav="progress" data-action="progress"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18h17M8 16v-4m5 4V8m5 8V5"/></svg><span>学習記録</span></button><button data-nav="settings" data-action="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/></svg><span>設定</span></button></nav></div><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="dialog" aria-label="確認"></dialog><script>window.PWA_BUILD=false;</script><script>const MATERIAL = {"version":1,"patterns":[{"id":"p01","number":1,"group":"plan","title":"I need to …","meaning":"〜する必要がある","base":"I need to check the drawing.","ja":"図面を確認する必要があります。","changeFrom":"the drawing","changeTo":"the program","changed":"I need to check the program.","changedJa":"プログラムを確認する必要があります。","addition":"before the meeting","added":"I need to check the program before the meeting.","question":"What do you need to do today?","questionJa":"今日は何をする必要がありますか？","example":"I need to finish my work.","scene":"work","source":"original","level":"A2"},{"id":"p02","number":2,"group":"plan","title":"I want to …","meaning":"〜したい","base":"I want to learn English.","ja":"英語を学びたいです。","changeFrom":"English","changeTo":"Spanish","changed":"I want to learn Spanish.","changedJa":"スペイン語を学びたいです。","addition":"this year","added":"I want to learn Spanish this year.","question":"What do you want to learn?","questionJa":"何を学びたいですか？","example":"I want to learn how to cook.","scene":"work","source":"original","level":"A2"},{"id":"p03","number":3,"group":"plan","title":"I'd like to …","meaning":"〜したいのですが","base":"I'd like to book a table.","ja":"テーブルを予約したいのですが。","changeFrom":"a table","changeTo":"a room","changed":"I'd like to book a room.","changedJa":"部屋を予約したいのですが。","addition":"for Friday","added":"I'd like to book a room for Friday.","question":"What would you like to do this weekend?","questionJa":"今週末は何をしたいですか？","example":"I'd like to go for a walk.","scene":"work","source":"original","level":"A2"},{"id":"p04","number":4,"group":"plan","title":"I'm going to …","meaning":"〜するつもり","base":"I'm going to make dinner.","ja":"夕食を作るつもりです。","changeFrom":"make dinner","changeTo":"clean the kitchen","changed":"I'm going to clean the kitchen.","changedJa":"キッチンを掃除するつもりです。","addition":"after work","added":"I'm going to clean the kitchen after work.","question":"What are you going to do after work?","questionJa":"仕事の後は何をするつもりですか？","example":"I'm going to read a book.","scene":"work","source":"original","level":"A2"},{"id":"p05","number":5,"group":"plan","title":"I'm planning to …","meaning":"〜する計画です","base":"I'm planning to take a trip.","ja":"旅行をする計画です。","changeFrom":"take a trip","changeTo":"visit my friend","changed":"I'm planning to visit my friend.","changedJa":"友人を訪ねる計画です。","addition":"next month","added":"I'm planning to visit my friend next month.","question":"What are you planning to do next month?","questionJa":"来月は何をする計画ですか？","example":"I'm planning to visit my family.","scene":"work","source":"original","level":"A2"},{"id":"p06","number":6,"group":"plan","title":"I have to …","meaning":"〜しなければならない","base":"I have to send an email.","ja":"メールを送らなければなりません。","changeFrom":"an email","changeTo":"the report","changed":"I have to send the report.","changedJa":"報告書を送らなければなりません。","addition":"before lunch","added":"I have to send the report before lunch.","question":"What do you have to do tomorrow?","questionJa":"明日は何をしなければなりませんか？","example":"I have to attend a meeting.","scene":"work","source":"original","level":"A2"},{"id":"p07","number":7,"group":"plan","title":"I don't have to …","meaning":"〜する必要はない","base":"I don't have to work.","ja":"働く必要はありません。","changeFrom":"work","changeTo":"get up early","changed":"I don't have to get up early.","changedJa":"早起きする必要はありません。","addition":"tomorrow","added":"I don't have to get up early tomorrow.","question":"What don't you have to do on your day off?","questionJa":"休みの日にしなくてよいことは何ですか？","example":"I don't have to take the train.","scene":"work","source":"original","level":"A2"},{"id":"p08","number":8,"group":"plan","title":"I'd rather …","meaning":"どちらかといえば〜したい","base":"I'd rather stay home.","ja":"どちらかといえば家にいたいです。","changeFrom":"stay home","changeTo":"eat out","changed":"I'd rather eat out.","changedJa":"どちらかといえば外食したいです。","addition":"tonight","added":"I'd rather eat out tonight.","question":"Would you rather cook or eat out tonight?","questionJa":"今夜は料理と外食のどちらがよいですか？","example":"I'd rather cook.","scene":"work","source":"original","level":"A2"},{"id":"p09","number":9,"group":"like","title":"I like …","meaning":"〜が好き","base":"I like this song.","ja":"この曲が好きです。","changeFrom":"this song","changeTo":"this movie","changed":"I like this movie.","changedJa":"この映画が好きです。","addition":"a lot","added":"I like this movie a lot.","question":"What kind of music do you like?","questionJa":"どんな音楽が好きですか？","example":"I like jazz.","scene":"weekend","source":"original","level":"A2"},{"id":"p10","number":10,"group":"like","title":"I enjoy …","meaning":"〜を楽しんでいる","base":"I enjoy cooking.","ja":"料理を楽しんでいます。","changeFrom":"cooking","changeTo":"reading","changed":"I enjoy reading.","changedJa":"読書を楽しんでいます。","addition":"on weekends","added":"I enjoy reading on weekends.","question":"What do you enjoy doing on weekends?","questionJa":"週末は何を楽しんでいますか？","example":"I enjoy walking in the park.","scene":"weekend","source":"original","level":"A2"},{"id":"p11","number":11,"group":"like","title":"I'm interested in …","meaning":"〜に興味がある","base":"I'm interested in history.","ja":"歴史に興味があります。","changeFrom":"history","changeTo":"architecture","changed":"I'm interested in architecture.","changedJa":"建築に興味があります。","addition":"these days","added":"I'm interested in architecture these days.","question":"What are you interested in these days?","questionJa":"最近、何に興味がありますか？","example":"I'm interested in photography.","scene":"weekend","source":"original","level":"A2"},{"id":"p12","number":12,"group":"like","title":"I'm good at …","meaning":"〜が得意","base":"I'm good at making coffee.","ja":"コーヒーをいれるのが得意です。","changeFrom":"making coffee","changeTo":"solving problems","changed":"I'm good at solving problems.","changedJa":"問題を解決するのが得意です。","addition":"at work","added":"I'm good at solving problems at work.","question":"What are you good at?","questionJa":"何が得意ですか？","example":"I'm good at fixing things.","scene":"weekend","source":"original","level":"A2"},{"id":"p13","number":13,"group":"like","title":"I'm not good at …","meaning":"〜が得意ではない","base":"I'm not good at speaking English.","ja":"英語を話すのが得意ではありません。","changeFrom":"speaking English","changeTo":"remembering names","changed":"I'm not good at remembering names.","changedJa":"名前を覚えるのが得意ではありません。","addition":"yet","added":"I'm not good at remembering names yet.","question":"What are you not good at yet?","questionJa":"まだ得意ではないことは何ですか？","example":"I'm not good at cooking yet.","scene":"weekend","source":"original","level":"A2"},{"id":"p14","number":14,"group":"like","title":"I prefer … to …","meaning":"…より〜が好き","base":"I prefer tea to coffee.","ja":"コーヒーよりお茶が好きです。","changeFrom":"tea","changeTo":"water","changed":"I prefer water to coffee.","changedJa":"コーヒーより水が好きです。","addition":"in the evening","added":"I prefer water to coffee in the evening.","question":"Do you prefer tea or coffee?","questionJa":"お茶とコーヒーのどちらが好きですか？","example":"I prefer coffee to tea.","scene":"weekend","source":"original","level":"A2"},{"id":"p15","number":15,"group":"like","title":"I feel like …","meaning":"〜したい気分","base":"I feel like having soup.","ja":"スープを飲みたい気分です。","changeFrom":"having soup","changeTo":"going for a walk","changed":"I feel like going for a walk.","changedJa":"散歩に行きたい気分です。","addition":"right now","added":"I feel like going for a walk right now.","question":"What do you feel like doing now?","questionJa":"今、何をしたい気分ですか？","example":"I feel like taking a break.","scene":"weekend","source":"original","level":"A2"},{"id":"p16","number":16,"group":"like","title":"I'm looking forward to …","meaning":"〜を楽しみにしている","base":"I'm looking forward to the trip.","ja":"旅行を楽しみにしています。","changeFrom":"the trip","changeTo":"the concert","changed":"I'm looking forward to the concert.","changedJa":"コンサートを楽しみにしています。","addition":"next week","added":"I'm looking forward to the concert next week.","question":"What are you looking forward to?","questionJa":"何を楽しみにしていますか？","example":"I'm looking forward to the weekend.","scene":"weekend","source":"original","level":"A2"},{"id":"p17","number":17,"group":"request","title":"Can I …?","meaning":"〜してもよいですか","base":"Can I use this chair?","ja":"この椅子を使ってもよいですか？","changeFrom":"chair","changeTo":"desk","changed":"Can I use this desk?","changedJa":"この机を使ってもよいですか？","addition":"for a minute","added":"Can I use this desk for a minute?","question":"You need a pen. Ask to use mine.","questionJa":"ペンが必要です。私のペンを使ってよいか尋ねてください。","example":"Can I use your pen?","scene":"cafe","source":"original","level":"A2"},{"id":"p18","number":18,"group":"request","title":"Could I …?","meaning":"〜させていただけますか","base":"Could I have some water?","ja":"水をいただけますか？","changeFrom":"water","changeTo":"tea","changed":"Could I have some tea?","changedJa":"お茶をいただけますか？","addition":"please","added":"Could I have some tea please?","question":"You're at a café. Ask for the menu.","questionJa":"カフェでメニューをもらってください。","example":"Could I have the menu, please?","scene":"cafe","source":"original","level":"A2"},{"id":"p19","number":19,"group":"request","title":"Can you …?","meaning":"〜してくれますか","base":"Can you check this file?","ja":"このファイルを確認してくれますか？","changeFrom":"file","changeTo":"number","changed":"Can you check this number?","changedJa":"この数字を確認してくれますか？","addition":"for me","added":"Can you check this number for me?","question":"Ask me to help you with your homework.","questionJa":"宿題を手伝ってくれるよう私に頼んでください。","example":"Can you help me with my homework?","scene":"cafe","source":"original","level":"A2"},{"id":"p20","number":20,"group":"request","title":"Could you …?","meaning":"〜していただけますか","base":"Could you speak slowly?","ja":"ゆっくり話していただけますか？","changeFrom":"speak slowly","changeTo":"say that again","changed":"Could you say that again?","changedJa":"もう一度言っていただけますか？","addition":"please","added":"Could you say that again please?","question":"You didn't hear me. Ask me to repeat that.","questionJa":"聞き取れませんでした。もう一度言うよう頼んでください。","example":"Could you say that again, please?","scene":"cafe","source":"original","level":"A2"},{"id":"p21","number":21,"group":"request","title":"Would you mind …?","meaning":"〜していただけますか","base":"Would you mind closing the window?","ja":"窓を閉めていただけますか？","changeFrom":"window","changeTo":"door","changed":"Would you mind closing the door?","changedJa":"ドアを閉めていただけますか？","addition":"please","added":"Would you mind closing the door please?","question":"It's hot. Ask me to open the window politely.","questionJa":"暑いので、窓を開けるよう丁寧に頼んでください。","example":"Would you mind opening the window?","scene":"cafe","source":"original","level":"A2"},{"id":"p22","number":22,"group":"request","title":"Is it okay if I …?","meaning":"〜しても大丈夫ですか","base":"Is it okay if I leave early?","ja":"早く帰っても大丈夫ですか？","changeFrom":"leave early","changeTo":"work from home","changed":"Is it okay if I work from home?","changedJa":"在宅勤務をしても大丈夫ですか？","addition":"tomorrow","added":"Is it okay if I work from home tomorrow?","question":"Ask if you can sit here.","questionJa":"ここに座ってよいか尋ねてください。","example":"Is it okay if I sit here?","scene":"cafe","source":"original","level":"A2"},{"id":"p23","number":23,"group":"request","title":"Let me …","meaning":"私に〜させて","base":"Let me check the time.","ja":"時間を確認させてください。","changeFrom":"time","changeTo":"schedule","changed":"Let me check the schedule.","changedJa":"予定を確認させてください。","addition":"first","added":"Let me check the schedule first.","question":"Offer to help me with my bag.","questionJa":"私のかばんを持つのを手伝うと申し出てください。","example":"Let me help you with your bag.","scene":"cafe","source":"original","level":"A2"},{"id":"p24","number":24,"group":"request","title":"Would you like …?","meaning":"〜はいかがですか","base":"Would you like some coffee?","ja":"コーヒーはいかがですか？","changeFrom":"coffee","changeTo":"tea","changed":"Would you like some tea?","changedJa":"お茶はいかがですか？","addition":"with your cake","added":"Would you like some tea with your cake?","question":"Offer me some water.","questionJa":"私に水を勧めてください。","example":"Would you like some water?","scene":"cafe","source":"original","level":"A2"},{"id":"p25","number":25,"group":"ability","title":"I can …","meaning":"〜できる","base":"I can help you.","ja":"お手伝いできます。","changeFrom":"help you","changeTo":"check the file","changed":"I can check the file.","changedJa":"ファイルを確認できます。","addition":"this afternoon","added":"I can che /* Pure helpers: no API calls and no storage mutation. */
const Core = (() => {
  const intervals = [1,3,7,14,30,60];
  const day = (date = new Date()) => {
    const d = date instanceof Date ? date : new Date(date);
    return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  };
  const addDays = (iso,n) => {const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return day(d);};
  function normalize(text){
    let s=String(text || '').normalize('NFKC').toLowerCase().replace(/[’‘`]/g,"'").replace(/café/g,'cafe');
    const pairs={"can't":"cannot","won't":"will not","shan't":"shall not","let's":"let us","i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is","what's":"what is","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'd":"i would","you'd":"you would","we'd":"we would","they'd":"they would","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will"};
    s=s.replace(/\b[a-z]+'[a-z]+\b/g,m=>pairs[m]||m.replace(/n't$/,' not'));
    return s.replace(/\bcan not\b/g,'cannot').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  }
  const match=(a,b)=>normalize(a)===normalize(b) && normalize(a).length>0;
  function difference(input,target){
    const a=normalize(input).split(' '),b=normalize(target).split(' ');
    let i=0;while(i<Math.min(a.length,b.length)&&a[i]===b[i])i++;
    if(i===a.length && i===b.length)return '';
    if(i>=b.length)return '文の終わりに、余分な語があるようです。';
    if(i>=a.length)return `「${b.slice(i).join(' ')}」まで続けましょう。`;
    return `「${b.slice(i,Math.min(i+3,b.length)).join(' ')}」の部分を確認しましょう。`;
  }
  function schedule(previous,grade,today=day()){
    const old=previous||{level:0,reviews:0,attempts:0};
    const out={...old,reviews:(old.reviews||0)+1,attempts:old.attempts||0,lastDate:today};
    // Repeating a task in one day cannot advance multiple spacing levels.
    const advance=old.lastAdvance!==today;
    if(grade>=2){out.level=Math.min(6,(old.level||0)+(advance?1:0));if(advance)out.lastAdvance=today;
      const proposed=addDays(today,intervals[Math.max(0,out.level-1)]);
      out.due=advance?proposed:(old.due||proposed);
    }else{out.level=0;out.due=addDays(today,1);out.lastAdvance=today;}
    out.lastGrade=grade;return out;
  }
  function streak(activity,today=day()){
    let d=today,count=0;if(!activity[d])d=addDays(d,-1);
    while(activity[d]&&count<10000){count++;d=addDays(d,-1);}return count;
  }
  function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function buildLesson(p,patterns,scenes,progress){
    const wrong=shuffle(patterns.filter(x=>x.id!==p.id&&x.ja!==p.ja)).slice(0,2).map(x=>x.ja);
    const scene=scenes.find(x=>x.id===p.scene)||scenes[0];
    const known=patterns.filter(x=>x.id!==p.id&&progress[x.id]?.reviews>0);
    const mixed=known.length?shuffle(known)[0]:p;
    return [
      {kind:'listen',stage:0,pid:p.id,title:'まずは、耳だけで。',audio:p.base,answer:p.base,jp:p.ja,options:shuffle([p.ja,...wrong]),prompt:'英文を聞いて、意味を選んでください。'},
      {kind:'repeat',stage:0,pid:p.id,title:'聞こえた文を、そのまま。',audio:p.base,answer:p.base,jp:p.ja,prompt:'同じ英文を声に出すか、入力してください。'},
      {kind:'change',stage:1,pid:p.id,title:'ひとつ、入れ替える。',audio:`Change ${p.changeFrom} to ${p.changeTo}.`,answer:p.changed,jp:p.changedJa,context:p.base,from:p.changeFrom,to:p.changeTo,prompt:'指定された部分だけを変更して、文全体を言ってください。'},
      {kind:'add',stage:1,pid:p.id,title:'さっきの文に、付け足す。',audio:`Add ${p.addition.replace(/^,\s*/,'')}.`,answer:p.added,context:p.changed,addition:p.addition,prompt:'直前の変更を残したまま、文末に追加してください。'},
      {kind:'personal',stage:2,pid:p.id,title:'あなたのことを、ひとこと。',audio:p.question,jp:p.questionJa,answer:p.example,prompt:'今日の型で答えてみましょう。例文と同じ内容でなくても大丈夫です。'},
      ...scene.turns.map((x,i)=>({kind:'talk',stage:3,pid:null,title:scene.title,audio:x[0],jp:x[1],answer:x[2],scene:scene.id,turn:i+1,prompt:'場面を切り替えて、3往復。使う型は自由です。台本式の質問で練習します。'})),
      {kind:'mix',stage:4,pid:mixed.id,title:'型のヒントなしで、もう一度。',audio:mixed.question,jp:mixed.questionJa,answer:mixed.example,prompt:known.length?'以前の型も思い出して、自由に答えてください。':'今日の型を思い出して、別の内容でもう一度答えてください。'}
    ];
  }
  function validateCustom(p){
    if(!p||typeof p!=='object')throw Error('教材の形式が正しくありません。');
    const req=['title','meaning','base','ja','changeFrom','changeTo','addition','question','questionJa','example'];
    for(const key of req){if(typeof p[key]!=='string'||!p[key].trim()||p[key].length>600)throw Error('教材の必須項目が空か、長すぎます。');}
    if(!/[A-Za-z]/.test(p.base)||!/[.!?]$/.test(p.base.trim()))throw Error('基本例文は英文にし、文末に . または ? を付けてください。');
    if(p.base.split(p.changeFrom).length!==2)throw Error('入れ替え元の語句は基本例文の中にちょうど1か所必要です。');
    const changed=p.base.replace(p.changeFrom,p.changeTo);
    const clean={};for(const key of req)clean[key]=p[key].trim();
    return {...clean,id:typeof p.id==='string'&&/^u[a-z0-9_-]{1,80}$/.test(p.id)?p.id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),changed,added:changed.slice(0,-1)+(p.addition.startsWith(',')?'':' ')+p.addition+changed.slice(-1),changedJa:typeof p.changedJa==='string'?p.changedJa.slice(0,600):'',group:'custom',source:'custom',level:'自分の教材',scene:'english',note:typeof p.note==='string'?p.note.slice(0,600):''};
  }
  return {day,addDays,normalize,match,difference,schedule,streak,shuffle,buildLesson,validateCustom,intervals};
})();
if(typeof module!=='undefined'&&module.exports)module.exports=Core;

function cleanBackup(o,forImport=true){
 if(!o||o.schema!==1||!Array.isArray(o.custom)||!Array.isArray(o.events)||!o.progress||typeof o.progress!=='object')throw Error('Pattern Pocketのバックアップではありません。');
 const n=empty();
 const s=o.settings||{};
 n.settings={...defaults,speed:[.65,.75,.85,1,1.1].includes(Number(s.speed))?Number(s.speed):.85,repeat:Number(s.repeat)===1?1:2,auto:s.auto===true,voice:typeof s.voice==='string'?s.voice.slice(0,200):'',dailyGoal:[5,10,15,20].includes(Number(s.dailyGoal))?Number(s.dailyGoal):10,micConsent:!forImport&&s.micConsent===true};
 n.custom=o.custom.slice(0,400).map(Core.validateCustom);
 const ids=new Set([...MATERIAL.patterns,...n.custom].map(p=>p.id));
 for(const [id,p] of Object.entries(o.progress)){
  if(!ids.has(id)||!p||typeof p!=='object')continue;
  n.progress[id]={level:Math.max(0,Math.min(6,Number(p.level)||0)),reviews:Math.max(0,Math.min(1e6,Number(p.reviews)||0)),attempts:Math.max(0,Math.min(1e6,Number(p.attempts)||0)),lastGrade:Math.max(0,Math.min(3,Number(p.lastGrade)||0))};
  for(const k of ['due','lastDate','lastAdvance'])if(typeof p[k]==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p[k]))n.progress[id][k]=p[k];
 }
 n.events=o.events.slice(-10000).filter(e=>e&&typeof e.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&['listen','repeat','change','add','personal','mix','talk'].includes(e.kind)).map(e=>({id:typeof e.id==='string'?e.id.slice(0,130):'',date:e.date,pid:ids.has(e.pid)?e.pid:null,kind:e.kind,grade:Math.max(0,Math.min(3,Number(e.grade)||0)),duration:Math.max(0,Math.min(300,Number(e.duration)||0)),session:typeof e.session==='string'?e.session.slice(0,100):''}));
 n.favorites=Array.isArray(o.favorites)?[...new Set(o.favorites.filter(x=>ids.has(x)))]:[];
 n.phrases=Array.isArray(o.phrases)?o.phrases.filter(p=>p&&typeof p.text==='string'&&typeof p.prompt==='string').slice(0,1000).map(p=>({id:String(p.id).slice(0,80),text:p.text.slice(0,2000),prompt:p.prompt.slice(0,1000),date:String(p.date).slice(0,10),pid:ids.has(p.pid)?p.pid:null})):[];
 if(!forImport&&o.active&&Array.isArray(o.active.tasks)&&o.active.tasks.length<=100&&Number.isInteger(o.active.index)&&o.active.index>=0&&o.active.index<o.active.tasks.length&&o.active.tasks.every(t=>t&&['listen','repeat','change','add','personal','mix','talk'].includes(t.kind)&&typeof t.audio==='string'&&typeof t.answer==='string'))n.active=o.active;
 return n;
}

function checkAnswer(){
 const s=state.active,t=current();if(!s||s.draft.feedback&&s.draft.feedback.status!=='retry')return;
 const a=$('#answer')?.value??s.answer;s.answer=a;
 if(!a.trim()){toast('英語を入力するか、「声に出したので自己評価へ」を使ってください。');return;}
 stopMic();
 if(free(t)){s.draft.feedback={status:'self'};save();lesson();return;}
 if(Core.match(a,t.answer)){
  const grade=s.draft.failed?1:s.draft.usedHint?2:3;
  s.draft.feedback={status:'correct',grade};record(grade);save();lesson();
 }else{s.draft.failed=true;s.draft.usedHint=true;s.draft.feedback={status:'retry'};save();lesson();$('#answer')?.focus();}
}
function chooseAnswer(index){const s=state.active,t=current();if(!s||t.kind!=='listen'||s.draft.feedback)return;const choice=t.options[index];if(typeof choice!=='string')return;s.draft.choice=choice;const correct=choice===t.jp;const grade=correct?(s.draft.usedHint?1:3):0;s.draft.feedback={status:correct?'correct':'wrong',grade};record(grade);save();lesson();}
function record(grade){
 const s=state.active,t=current();if(!s||s.committed)return;
 const duration=Math.min(300,Math.max(0,Math.round((Date.now()-s.questionStarted)/1000)));
 const r={pid:t.pid,kind:t.kind,scene:t.scene||null,prompt:t.audio,answer:s.answer||'',target:t.answer,grade,date:Core.day(),duration};
 s.results.push(r);s.committed=true;
 state.events.push({id:s.id+':'+s.index,date:r.date,pid:r.pid,kind:r.kind,grade,duration,session:s.id});state.events=state.events.slice(-10000);
 // Persist partial practice immediately. Spacing is updated once at session completion.
 if(t.pid){const prev=state.progress[t.pid]||{level:0,reviews:0,attempts:0};state.progress[t.pid]={...prev,attempts:(prev.attempts||0)+1};}
 save();
}
function rate(grade){const s=state.active;if(!s||s.draft.feedback?.status!=='self')return;const g=s.draft.failed?Math.min(grade,1):s.draft.usedHint?Math.min(grade,1):grade;s.draft.feedback={status:'rated',grade:g};record(g);save();lesson();}
function nextStep(){
 const s=state.active;if(!s||!s.committed)return;
 stopSpeech();stopMic();
 if(s.index>=s.tasks.length-1){finish();return;}
 s.index++;s.answer='';s.draft={revealed:false,jp:false,hint:false,failed:false,feedback:null,heard:false};s.committed=false;s.questionStarted=Date.now();save();lesson();window.scrollTo({top:0,behavior:'instant'});if(state.settings.auto)playTask();
}
function finish(){
 const s=state.active;if(!s)return;const grades={};
 s.results.forEach(r=>{if(r.pid)(grades[r.pid]??=[]).push(r.grade);});
 for(const [id,g] of Object.entries(grades)){
  // A low mark on any stage keeps the pattern due tomorrow; no inflated mastery.
  state.progress[id]=Core.schedule(state.progress[id],Math.min(...g),Core.day());
 }
 lastResult={...s,finished:Date.now()};state.active=null;save();navigate('result');
}

 ${field('title','型','I need to …',true)}${field('meaning','型の意味','〜する必要がある',true)}${field('base','基本例文（英語）','I need to check the drawing.',true,'wide')}${field('ja','基本例文の意味','図面を確認する必要があります。',true,'wide')}${field('changeFrom','入れ替える語句','the drawing',true)}${field('changeTo','入れ替え先の語句','the program',true)}${field('changedJa','変更後の文の意味（任意）','プログラムを確認する必要があります。',false,'wide')}${field('addition','変更後の文末に追加する語句','before the meeting',true,'wide')}${field('question','自分のことを答える質問（英語）','What do you need to do today?',true,'wide')}${field('questionJa','質問の意味','今日は何をする必要がありますか？',true,'wide')}${field('example','返答例（英語）','I need to finish my work.',true,'wide')}${field('note','出典・ページなどのメモ（任意）','本の該当ページ・自分のメモ',false,'wide')}
 </div><div id="custom-error" class="danger-note" role="alert"></div><div class="notice" style="margin:5px 0 20px">入れ替え元は、基本例文内の1か所だけに一致するようにします。追加語句は、変更後の文末の句読点の直前に付け足されます。</div><div class="row wrap"><button type="submit" class="btn primary">${icon('save')} 保存して練習する</button>${btn('一覧へ戻る','patterns','plain')}</div></form></section>`);
}
function field(name,label,placeholder,required=false,cls=''){return `<div class="field-row ${cls}"><label for="custom-${name}">${label}${required?' <span class="muted">*</span>':''}</label><input type="text" id="custom-${name}" name="${name}" maxlength="600" placeholder="${esc(placeholder)}" ${required?'required':''} ${['base','question','example','changeFrom','changeTo','addition'].includes(name)?'lang="en"':''}></div>`;}
let speechToken=0,utterances=[],recognition=null;
function speechSupport(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)&&window.isSecureContext;}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel();utterances=[];document.body.classList.remove('is-speaking');const el=$('#audio-status');if(el)el.textContent='再生を押して聞いてください';}
function speak(text,slow=false,repeat=state.settings.repeat){
 stopMic();stopSpeech();
 if(!('speechSynthesis'in window)){toast('このブラウザーでは読み上げが使えません。英文表示で練習してください。');return;}
 const synth=window.speechSynthesis,token=speechToken,voices=synth.getVoices();
 const chosen=voices.find(v=>v.voiceURI===state.settings.voice)||voices.find(v=>v.lang==='en-US'&&v.localService)||voices.find(v=>/^en[-_]/i.test(v.lang));
 let ended=0;
 try{for(let i=0;i<repeat;i++){
  const u=new SpeechSynthesisUtterance(text);u.lang=chosen?.lang||'en-US';if(chosen)u.voice=chosen;u.rate=slow?.65:state.settings.speed;
  u.onstart=()=>{if(token!==speechToken)return;document.body.classList.add('is-speaking');const el=$('#audio-status');if(el)el.textContent=`再生中 ${i+1} / ${repeat}`;};
  u.onend=()=>{if(token!==speechToken)return;ended++;if(ended===repeat){document.body.classList.remove('is-speaking');const el=$('#audio-status');if(el)el.textContent='再生が終わりました';utterances=[];}};
  u.onerror=e=>{if(token!==speechToken||e.error==='canceled'||e.error==='interrupted')return;document.body.classList.remove('is-speaking');const el=$('#audio-status');if(el)el.textContent='再生できませんでした。もう一度再生するか、英文を表示してください。';};
  utterances.push(u);synth.speak(u);
 }}catch(e){toast('音声を再生できませんでした。英文を表示して続けられます。');}
}
function playTask(slow=false){const t=current();if(!t)return;if(state.active){state.active.draft.heard=true;save();}speak(t.audio,slow);}
function populateVoices(){const sel=$('#voice-select');if(!sel||!('speechSynthesis'in window))return;const voices=window.speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));sel.innerHTML='<option value="">端末の標準</option>'+voices.map(v=>`<option value="${esc(v.voiceURI)}" ${state.settings.voice===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');}
function stopMic(){if(recognition){const r=recognition;recognition=null;r.onresult=null;r.onend=null;r.onerror=null;try{r.abort();}catch(e){}}$('#mic-button')?.classList.remove('recording');const status=$('#mic-status');if(status)status.textContent=speechSupport()?'英語で話してください':'文字入力で練習できます';}
function startMic(){
 if(recognition){recognition.stop();return;}
 if(!speechSupport()){toast('この環境では音声入力を使えません。HTTPSの対応ブラウザーか、文字入力を使ってください。');return;}
 if(!state.settings.micConsent){confirmBox('音声入力を使いますか？','ブラウザーによっては、音声がブラウザー提供元などの認識サービスへ送信されます。このアプリは録音を保存しません。機密情報を話さず、表示された認識結果を確認してください。','理解して音声入力',()=>{state.settings.micConsent=true;save();startMic();});return;}
 const s=state.active,t=current();if(!s||!t||!$('#answer'))return;
 stopSpeech();const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();const index=s.index,sid=s.id;
 recognition=r;r.lang='en-US';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
 const status=$('#mic-status'),b=$('#mic-button');
 const alive=()=>recognition===r&&state.active?.id===sid&&state.active.index===index;
 r.onstart=()=>{if(!alive())return;b?.classList.add('recording');if(status)status.textContent='聞き取り中… もう一度押すと停止';};
 r.onresult=e=>{if(!alive())return;let text='';for(let i=0;i<e.results.length;i++)text+=e.results[i][0].transcript+' ';state.active.answer=text.trim();if($('#answer'))$('#answer').value=text.trim();save();};
 r.onerror=e=>{if(!alive())return;const messages={'not-allowed':'マイクが許可されていません。ブラウザーの権限を確認するか文字入力を使ってください。','service-not-allowed':'この環境では認識サービスを利用できません。文字入力で続けられます。','no-speech':'声を聞き取れませんでした。もう一度話すか文字入力を使ってください。','audio-capture':'マイクを利用できません。別のアプリで使用中でないか確認してください。','network':'音声認識の通信エラーです。文字入力で続けられます。','aborted':'音声入力を中断しました。'};toast(messages[e.error]||'音声入力を利用できませんでした。文字入力で続けられます。');};
 r.onend=()=>{if(!alive())return;recognition=null;b?.classList.remove('recording');if(status)status.textContent='認識した英文を確認・修正してください';};
 try{r.start();if(status)status.textContent='マイクを準備しています…';}catch(e){recognition=null;toast('音声入力を開始できませんでした。文字入力で続けられます。');}
}
let confirmAction=null;
function confirmBox(title,text,label,action){const d=$('#dialog');confirmAction=action;d.innerHTML=`<h2 style="font-size:21px">${esc(title)}</h2><p>${esc(text)}</p><div class="dialog-actions">${btn('戻る','dialog-cancel','plain')}${btn(esc(label),'dialog-ok','primary')}</div>`;d.showModal();}
function exportBackup(){const payload=JSON.stringify({...state,active:null,exportedAt:new Date().toISOString()},null,2);download('pattern-pocket-backup-'+Core.day()+'.json',payload,'application/json');toast('バックアップを書き出しました。');}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function importBackup(file){
 if(!file)return;if(file.size>8*1024*1024){toast('8MB以下のバックアップを選んでください。');return;}
 try{const imported=cleanBackup(JSON.parse(await file.text()));confirmBox('バックアップを統合しますか？',`${imported.custom.length}件の教材、${imported.events.length}件の学習記録を読み込みます。今の設定は維持し、現在のデータと統合します。`,'統合する',()=>{
   for(const p of imported.custom)if(!state.custom.some(x=>x.id===p.id))state.custom.push(p);
   for(const [id,p] of Object.entries(imported.progress)){const old=state.progress[id];if(!old||(p.lastDate||'')>(old.lastDate||'')||(p.lastDate||'')===(old.lastDate||'')&&p.reviews>(old.reviews||0))state.progress[id]=p;}
   const eventKey=e=>e.id||JSON.stringify([e.date,e.pid,e.kind,e.grade,e.duration,e.session]);const keys=new Set(state.events.map(eventKey));for(const e of imported.events)if(!keys.has(eventKey(e))){state.events.push(e);keys.add(eventKey(e));}state.events=state.events.sort((a,b)=>a.date.localeCompare(b.date)).slice(-10000);
   for(const p of imported.phrases)if(!state.phrases.some(x=>x.id===p.id))state.phrases.push(p);state.phrases=state.phrases.slice(-1000);state.favorites=[...new Set([...state.favorites,...imported.favorites])];save();render();toast('既存データを残して統合しました。');
 });}catch(e){toast('読み込めませんでした。'+e.message);}
}
function savePhrase(){const s=state.active,t=current();if(!s||!t||!s.answer.trim())return;const text=s.answer.trim();if(state.phrases.some(p=>p.text===text&&p.prompt===t.audio)){toast('同じフレーズは保存済みです。');return;}state.phrases.push({id:'f'+Date.now().toString(36),text,prompt:t.audio,pid:t.pid,date:Core.day()});state.phrases=state.phrases.slice(-1000);save();toast('マイフレーズに保存しました。未添削の英文として記録します。');}
function toggleFavorite(id){if(!getP(id))return;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();if(route==='patterns')libraryResults();else if(route.startsWith('pattern/'))detail(id);}
const actions={
 home:()=>navigate('home'),patterns:()=>navigate('patterns'),progress:()=>navigate('progress'),settings:()=>navigate('settings'),custom:()=>navigate('custom'),conversations:()=>navigate('conversation'),
 'start-today':()=>startPattern(nextP().id),'start-pattern':b=>startPattern(b.dataset.id),resume:()=>navigate('lesson'),pause:()=>{save();navigate('home');},
 detail:b=>navigate('pattern/'+b.dataset.id),favorite:b=>toggleFavorite(b.dataset.id),filter:b=>{filter=b.dataset.value;library();},
 'speak-base':b=>{const p=getP(b.dataset.id);if(p)speak(p.base);},
 'start-listen':()=>{const known=seen();const candidates=known.length>=5?known:patterns().slice(0,8);begin(listenTasks(Core.shuffle(candidates).slice(0,5)),'耳から慣れる');},
 'start-mix':()=>{const known=seen();if(!known.length){toast('最初の型を練習してから、ヒントなしの復習に進みましょう。');startPattern(nextP().id);return;}const picks=Core.shuffle(known).slice(0,5);begin(mixedTasks(picks),'型をまぜる');},
 'start-review':()=>{const d=due().slice(0,5);if(!d.length){toast('今日の復習はまだありません。');return;}begin(mixedTasks(d),'今日の復習');},
 'start-scene':b=>{const sc=MATERIAL.scenes.find(x=>x.id===b.dataset.id);if(!sc)return;begin(sc.turns.map((x,i)=>({kind:'talk',stage:3,pid:null,title:sc.title,audio:x[0],jp:x[1],answer:x[2],scene:sc.id,turn:i+1,prompt:'場面に合う言葉で答えましょう。どの型を使っても大丈夫です。'})),sc.title);},
 play:()=>playTask(),'play-slow':()=>playTask(true),stop:stopSpeech,mic:startMic,check:checkAnswer,choose:b=>chooseAnswer(Number(b.dataset.index)),next:nextStep,
 'reveal-prompt':()=>{const s=state.active;if(!s)return;s.draft.revealed=true;s.draft.usedHint=true;save();lesson();},
 'toggle-prompt':()=>{const s=state.active;if(!s)return;s.draft.revealed=!s.draft.revealed;if(current()?.kind==='repeat'&&s.draft.revealed)s.draft.usedHint=true;save();lesson();},
 'toggle-jp':()=>{const s=state.active;if(!s)return;s.draft.jp=!s.draft.jp;if(s.draft.jp)s.draft.usedHint=true;save();lesson();},
 hint:()=>{const s=state.active;if(!s)return;s.draft.hint=true;s.draft.usedHint=true;save();lesson();},
 'show-answer':()=>{const s=state.active,t=current();if(!s||!t)return;if(!free(t)){s.draft.failed=true;s.draft.usedHint=true;}s.draft.feedback={status:'self'};save();lesson();},
 rate:b=>rate(Number(b.dataset.grade)),skip:()=>{const s=state.active;if(!s)return;s.draft.feedback={status:'rated',grade:0};record(0);save();lesson();},
 'speak-answer':()=>{if(current())speak(current().answer);},'save-phrase':savePhrase,
 'speak-phrase':b=>{const p=state.phrases.find(x=>x.id===b.dataset.id);if(p)speak(p.text);},
 'delete-phrase':b=>confirmBox('このフレーズを削除しますか？','このフレーズだけを削除します。学習記録と教材は残ります。','削除する',()=>{state.phrases=state.phrases.filter(x=>x.id!==b.dataset.id);save();progressPage();}),
 'test-audio':()=>speak('One small step. I can do this.'),export:exportBackup,import:()=>$('#backup-file')?.click(),
 'dialog-cancel':()=>{$('#dialog').close();confirmAction=null;},'dialog-ok':()=>{const fn=confirmAction;confirmAction=null;$('#dialog').close();fn?.();},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const fn=actions[b.dataset.action];if(fn)fn(b);});
document.addEventListener('input',e=>{if(e.target.id==='answer'&&state.active){state.active.answer=e.target.value;save();}if(e.target.id==='pattern-search'){search=e.target.value;libraryResults();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='group-filter'){group=el.value;libraryResults();}if(el.id==='backup-file')importBackup(el.files?.[0]);if(el.dataset.setting){const k=el.dataset.setting;if(k==='auto')state.settings.auto=el.checked;else if(k==='voice')state.settings.voice=el.value;else state.settings[k]=Number(el.value);save();toast('設定を保存しました。');}});
document.addEventListener('submit',e=>{if(e.target.id!=='custom-form')return;e.preventDefault();try{const o=Object.fromEntries(new FormData(e.target));const p=Core.validateCustom(o);state.custom.push(p);save();toast('自分の教材を保存しました。');startPattern(p.id);}catch(err){$('#custom-error').textContent=err.message;}});
document.addEventListener('keydown',e=>{if(e.target.id==='answer'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();checkAnswer();}});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
window.addEventListener('pagehide',()=>{save();stopSpeech();stopMic();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSpeech();stopMic();}});
window.addEventListener('offline',()=>{if($('#connection-label'))$('#connection-label').textContent='オフライン';});window.addEventListener('online',()=>{if($('#connection-label'))$('#connection-label').textContent='端末に保存';});
if('speechSynthesis'in window)window.speechSynthesis.addEventListener('voiceschanged',populateVoices);
load();render();
// Opt-in build flag keeps the downloadable single HTML free of missing file requests.
if(window.PWA_BUILD&&'serviceWorker'in navigator&&window.isSecureContext){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});});}
// Read-only diagnostics for automated checks. No credentials or private network calls.
window.PatternPocket={version:'1.0.0',patternCount:MATERIAL.patterns.length,sceneCount:MATERIAL.scenes.length,Core,getPatterns:()=>JSON.parse(JSON.stringify(patterns()))};
})();
</script></body></html>
