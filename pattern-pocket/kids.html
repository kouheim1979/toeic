</style><link rel="preload" href="./characters/sora.webp" as="image"><link rel="stylesheet" href="./kids-characters.css?v=1.3.0"><script defer src="./kids-characters.js?v=1.3.0"></script></head><body><header><div class="brand">✨ Pattern <b>Pocket Kids</b></div><a href="./">おとなモードへ ↗</a></header><main><section class="hero"><span class="mascot" aria-hidden="true">🐣</span><div class="eyebrow">KIDS ENGLISH CHALLENGE</div><h1>きょうも、英語を<br>ひとつ言えた！</h1><p>きいて、えらんで、声に出そう。<br>80のフレーズを少しずつクリア！</p></section><div class="stats"><div class="stat">クリアした型<strong id="completed">0 / 80</strong></div><div class="stat">あつめた星<strong id="stars">0 ⭐</strong></div></div><section class="panel"><h2>🎯 きょうのチャレンジ</h2><div class="selector"><label for="pattern">チャレンジをえらぶ</label><select id="pattern"></select></div><div class="dots" aria-label="4つのステップ"><i></i><i></i><i></i><i></i></div><div id="exercise" aria-live="polite"></div><div id="feedback" class="feedback hidden" role="status"></div><div class="actions"><button class="btn alt" id="hear" type="button">🔊 英語をきく</button><button class="btn" id="next" type="button">つぎへ →</button></div></section><p class="footnote">※このモードはアプリ独自の80パターンを使います。本の公式教材ではありません。音声は端末の読み上げ機能を利用します。マイク・ログインは不要です。学習記録はこの端末に保存されます。正解できたかどうかは、声に出した後で自分で確認します。</p></main><script>
'use strict';const patterns=[{"id":"p01","n":1,"title":"I need to …","meaning":"〜する必要がある","base":"I need to do my homework.","ja":"宿題をする必要があります。","changed":null,"changedJa":null,"from":"the drawing","to":"the program","question":"What do you need to do today?","questionJa":"今日は何をする必要がありますか？","example":"I need to finish my work."},{"id":"p02","n":2,"title":"I want to …","meaning":"〜したい","base":"I want to play soccer.","ja":"サッカーをしたいです。","changed":null,"changedJa":null,"from":"English","to":"Spanish","question":"What do you want to learn?","questionJa":"何を学びたいですか？","example":"I want to learn how to cook."},{"id":"p03","n":3,"title":"I'd like to …","meaning":"〜したいのですが","base":"I'd like to draw a picture.","ja":"絵を描きたいです。","changed":null,"changedJa":null,"from":"a table","to":"a room","question":"What would you like to do this weekend?","questionJa":"今週末は何をしたいですか？","example":"I'd like to go for a walk."},{"id":"p04","n":4,"title":"I'm going to …","meaning":"〜するつもり","base":"I'm going to play outside.","ja":"外で遊ぶつもりです。","changed":null,"changedJa":null,"from":"make dinner","to":"clean the kitchen","question":"What are you going to do after work?","questionJa":"仕事の後は何をするつもりですか？","example":"I'm going to read a book."},{"id":"p05","n":5,"title":"I'm planning to …","meaning":"〜する計画です","base":"I'm planning to take a trip.","ja":"旅行をする計画です。","changed":"I'm planning to visit my friend.","changedJa":"友人を訪ねる計画です。","from":"take a trip","to":"visit my friend","question":"What are you planning to do next month?","questionJa":"来月は何をする計画ですか？","example":"I'm planning to visit my family."},{"id":"p06","n":6,"title":"I have to …","meaning":"〜しなければならない","base":"I have to send an email.","ja":"メールを送らなければなりません。","changed":"I have to send the report.","changedJa":"報告書を送らなければなりません。","from":"an email","to":"the report","question":"What do you have to do tomorrow?","questionJa":"明日は何をしなければなりませんか？","example":"I have to attend a meeting."},{"id":"p07","n":7,"title":"I don't have to …","meaning":"〜する必要はない","base":"I don't have to work.","ja":"働く必要はありません。","changed":"I don't have to get up early.","changedJa":"早起きする必要はありません。","from":"work","to":"get up early","question":"What don't you have to do on your day off?","questionJa":"休みの日にしなくてよいことは何ですか？","example":"I don't have to take the train."},{"id":"p08","n":8,"title":"I'd rather …","meaning":"どちらかといえば〜したい","base":"I'd rather stay home.","ja":"どちらかといえば家にいたいです。","changed":"I'd rather eat out.","changedJa":"どちらかといえば外食したいです。","from":"stay home","to":"eat out","question":"Would you rather cook or eat out tonight?","questionJa":"今夜は料理と外食のどちらがよいですか？","example":"I'd rather cook."},{"id":"p09","n":9,"title":"I like …","meaning":"〜が好き","base":"I like this song.","ja":"この曲が好きです。","changed":"I like this movie.","changedJa":"この映画が好きです。","from":"this song","to":"this movie","question":"What kind of music do you like?","questionJa":"どんな音楽が好きですか？","example":"I like jazz."},{"id":"p10","n":10,"title":"I enjoy …","meaning":"〜を楽しんでいる","base":"I enjoy cooking.","ja":"料理を楽しんでいます。","changed":"I enjoy reading.","changedJa":"読書を楽しんでいます。","from":"cooking","to":"reading","question":"What do you enjoy doing on weekends?","questionJa":"週末は何を楽しんでいますか？","example":"I enjoy walking in the park."},{"id":"p11","n":11,"title":"I'm interested in …","meaning":"〜に興味がある","base":"I'm interested in history.","ja":"歴史に興味があります。","changed":"I'm interested in architecture.","changedJa":"建築に興味があります。","from":"history","to":"architecture","question":"What are you interested in these days?","questionJa":"最近、何に興味がありますか？","example":"I'm interested in photography."},{"id":"p12","n":12,"title":"I'm good at …","meaning":"〜が得意","base":"I'm good at making coffee.","ja":"コーヒーをいれるのが得意です。","changed":"I'm good at solving problems.","changedJa":"問題を解決するのが得意です。","from":"making coffee","to":"solving problems","question":"What are you good at?","questionJa":"何が得意ですか？","example":"I'm good at fixing things."},{"id":"p13","n":13,"title":"I'm not good at …","meaning":"〜が得意ではない","base":"I'm not good at speaking English.","ja":"英語を話すのが得意ではありません。","changed":"I'm not good at remembering names.","changedJa":"名前を覚えるのが得意ではありません。","from":"speaking English","to":"remembering names","question":"What are you not good at yet?","questionJa":"まだ得意ではないことは何ですか？","example":"I'm not good at cooking yet."},{"id":"p14","n":14,"title":"I prefer … to …","meaning":"…より〜が好き","base":"I prefer tea to coffee.","ja":"コーヒーよりお茶が好きです。","changed":"I prefer water to coffee.","changedJa":"コーヒーより水が好きです。","from":"tea","to":"water","question":"Do you prefer tea or coffee?","questionJa":"お茶とコーヒーのどちらが好きですか？","example":"I prefer coffee to tea."},{"id":"p15","n":15,"title":"I feel like …","meaning":"〜したい気分","base":"I feel like having soup.","ja":"スープを飲みたい気分です。","changed":"I feel like going for a walk.","changedJa":"散歩に行きたい気分です。","from":"having soup","to":"going for a walk","question":"What do you feel like doing now?","questionJa":"今、何をしたい気分ですか？","example":"I feel like taking a break."},{"id":"p16","n":16,"title":"I'm looking forward to …","meaning":"〜を楽しみにしている","base":"I'm looking forward to the trip.","ja":"旅行を楽しみにしています。","changed":"I'm looking forward to the concert.","changedJa":"コンサートを楽しみにしています。","from":"the trip","to":"the concert","question":"What are you looking forward to?","questionJa":"何を楽しみにしていますか？","example":"I'm looking forward to the weekend."},{"id":"p17","n":17,"title":"Can I …?","meaning":"〜してもよいですか","base":"Can I use this chair?","ja":"この椅子を使ってもよいですか？","changed":"Can I use this desk?","changedJa":"この机を使ってもよいですか？","from":"chair","to":"desk","question":"You need a pen. Ask to use mine.","questionJa":"ペンが必要です。私のペンを使ってよいか尋ねてください。","example":"Can I use your pen?"},{"id":"p18","n":18,"title":"Could I …?","meaning":"〜させていただけますか","base":"Could I have some water?","ja":"水をいただけますか？","changed":"Could I have some tea?","changedJa":"お茶をいただけますか？","from":"water","to":"tea","question":"You're at a café. Ask for the menu.","questionJa":"カフェでメニューをもらってください。","example":"Could I have the menu, please?"},{"id":"p19","n":19,"title":"Can you …?","meaning":"〜してくれますか","base":"Can you check this file?","ja":"このファイルを確認してくれますか？","changed":"Can you check this number?","changedJa":"この数字を確認してくれますか？","from":"file","to":"number","question":"Ask me to help you with your homework.","questionJa":"宿題を手伝ってくれるよう私に頼んでください。","example":"Can you help me with my homework?"},{"id":"p20","n":20,"title":"Could you …?","meaning":"〜していただけますか","base":"Could you speak slowly?","ja":"ゆっくり話していただけますか？","changed":"Could you say that again?","changedJa":"もう一度言っていただけますか？","from":"speak slowly","to":"say that again","question":"You didn't hear me. Ask me to repeat that.","questionJa":"聞き取れませんでした。もう一度言うよう頼んでください。","example":"Could you say that again, please?"},{"id":"p21","n":21,"title":"Would you mind …?","meaning":"〜していただけますか","base":"Would you mind closing the window?","ja":"窓を閉めていただけますか？","changed":"Would you mind closing the door?","changedJa":"ドアを閉めていただけますか？","from":"window","to":"door","question":"It's hot. Ask me to open the window politely.","questionJa":"暑いので、窓を開けるよう丁寧に頼んでください。","example":"Would you mind opening the window?"},{"id":"p22","n":22,"title":"Is it okay if I …?","meaning":"〜しても大丈夫ですか","base":"Is it okay if I leave early?","ja":"早く帰っても大丈夫ですか？","changed":"Is it okay if I work from home?","changedJa":"在宅勤務をしても大丈夫ですか？","from":"leave early","to":"work from home","question":"Ask if you can sit here.","questionJa":"ここに座ってよいか尋ねてください。","example":"Is it okay if I sit here?"},{"id":"p23","n":23,"title":"Let me …","meaning":"私に〜させて","base":"Let me check the time.","ja":"時間を確認させてください。","changed":"Let me check the schedule.","changedJa":"予定を確認させてください。","from":"time","to":"schedule","question":"Offer to help me with my bag.","questionJa":"私のかばんを持つのを手伝うと申し出てください。","example":"Let me help you with your bag."},{"id":"p24","n":24,"title":"Would you like …?","meaning":"〜はいかがですか","base":"Would you like some coffee?","ja":"コーヒーはいかがですか？","changed":"Would you like some tea?","changedJa":"お茶はいかがですか？","from":"coffee","to":"tea","question":"Offer me some water.","questionJa":"私に水を勧めてください。","example":"Would you like some water?"},{"id":"p25","n":25,"title":"I can …","meaning":"〜できる","base":"I can help you.","ja":"お手伝いできます。","changed":"I can check the file.","changedJa":"ファイルを確認できます。","from":"help you","to":"check the file","question":"What can you do well?","questionJa":"上手にできることは何ですか？","example":"I can cook pasta."},{"id":"p26","n":26,"title":"I can't …","meaning":"〜できない","base":"I can't find my phone.","ja":"自分の電話が見つかりません。","changed":"I can't find my keys.","changedJa":"自分の鍵が見つかりません。","from":"phone","to":"keys","question":"What can't you do at the moment?","questionJa":"今はできないことは何ですか？","example":"I can't speak very fast."},{"id":"p27","n":27,"title":"I know how to …","meaning":"〜のやり方を知っている","base":"I know how to use this app.","ja":"このアプリの使い方を知っています。","changed":"I know how to use this machine.","changedJa":"この機械の使い方を知っています。","from":"app","to":"machine","question":"What do you know how to make?","questionJa":"何の作り方を知っていますか？","example":"I know how to make coffee."},{"id":"p28","n":28,"title":"I don't know how to …","meaning":"〜のやり方が分からない","base":"I don't know how to fix this.","ja":"これの直し方が分かりません。","changed":"I don't know how to use this tool.","changedJa":"この道具の使い方が分かりません。","from":"fix this","to":"use this tool","question":"What would you like someone to teach you?","questionJa":"人に教えてほしいことは何ですか？","example":"I don't know how to use this software."},{"id":"p29","n":29,"title":"I managed to …","meaning":"なんとか〜できた","base":"I managed to finish the report.","ja":"なんとか報告書を完成できました。","changed":"I managed to catch the train.","changedJa":"なんとか電車に乗れました。","from":"finish the report","to":"catch the train","question":"What did you manage to do recently?","questionJa":"最近、なんとかできたことは何ですか？","example":"I managed to finish a difficult task."},{"id":"p30","n":30,"title":"I try to …","meaning":"〜するようにしている","base":"I try to read English.","ja":"英語を読むようにしています。","changed":"I try to exercise.","changedJa":"運動するようにしています。","from":"read English","to":"exercise","question":"What do you try to do every day?","questionJa":"毎日何をするようにしていますか？","example":"I try to go to bed early."},{"id":"p31","n":31,"title":"I'm learning to …","meaning":"〜することを学んでいる","base":"I'm learning to cook.","ja":"料理を学んでいます。","changed":"I'm learning to drive.","changedJa":"運転を学んでいます。","from":"cook","to":"drive","question":"What are you learning to do?","questionJa":"何ができるように学んでいますか？","example":"I'm learning to speak English."},{"id":"p32","n":32,"title":"I'm used to …","meaning":"〜に慣れている","base":"I'm used to getting up early.","ja":"早起きに慣れています。","changed":"I'm used to working from home.","changedJa":"在宅勤務に慣れています。","from":"getting up early","to":"working from home","question":"What are you used to doing?","questionJa":"どんなことをするのに慣れていますか？","example":"I'm used to taking the train."},{"id":"p33","n":33,"title":"I usually …","meaning":"普段は〜する","base":"I usually take the train.","ja":"普段は電車に乗ります。","changed":"I usually take the bus.","changedJa":"普段はバスに乗ります。","from":"train","to":"bus","question":"How do you usually get to work or school?","questionJa":"普段はどうやって職場や学校へ行きますか？","example":"I usually take the train."},{"id":"p34","n":34,"title":"I often …","meaning":"よく〜する","base":"I often drink tea.","ja":"よくお茶を飲みます。","changed":"I often drink coffee.","changedJa":"よくコーヒーを飲みます。","from":"tea","to":"coffee","question":"What do you often do after dinner?","questionJa":"夕食の後によく何をしますか？","example":"I often watch TV."},{"id":"p35","n":35,"title":"I sometimes …","meaning":"ときどき〜する","base":"I sometimes eat out.","ja":"ときどき外食します。","changed":"I sometimes cook dinner.","changedJa":"ときどき夕食を作ります。","from":"eat out","to":"cook dinner","question":"What do you sometimes do on weekends?","questionJa":"週末にときどき何をしますか？","example":"I sometimes go hiking."},{"id":"p36","n":36,"title":"I used to …","meaning":"以前は〜していた","base":"I used to play tennis.","ja":"以前はテニスをしていました。","changed":"I used to play soccer.","changedJa":"以前はサッカーをしていました。","from":"tennis","to":"soccer","question":"What did you use to do as a child?","questionJa":"子どもの頃は何をしていましたか？","example":"I used to ride my bike every day."},{"id":"p37","n":37,"title":"I've just …","meaning":"ちょうど〜したところ","base":"I've just finished work.","ja":"ちょうど仕事を終えたところです。","changed":"I've just finished lunch.","changedJa":"ちょうど昼食を終えたところです。","from":"work","to":"lunch","question":"What have you just finished?","questionJa":"ちょうど何を終えたところですか？","example":"I've just finished my homework."},{"id":"p38","n":38,"title":"I've already …","meaning":"もう〜した","base":"I've already checked the email.","ja":"もうメールを確認しました。","changed":"I've already checked the schedule.","changedJa":"もう予定を確認しました。","from":"email","to":"schedule","question":"What have you already done today?","questionJa":"今日はもう何をしましたか？","example":"I've already had breakfast."},{"id":"p39","n":39,"title":"I haven't … yet.","meaning":"まだ〜していない","base":"I haven't booked the tickets yet.","ja":"まだチケットを予約していません。","changed":"I haven't booked the hotel yet.","changedJa":"まだホテルを予約していません。","from":"tickets","to":"hotel","question":"What haven't you done yet today?","questionJa":"今日はまだ何をしていませんか？","example":"I haven't made dinner yet."},{"id":"p40","n":40,"title":"Have you ever …?","meaning":"今まで〜したことがありますか","base":"Have you ever tried yoga?","ja":"ヨガをやってみたことがありますか？","changed":"Have you ever tried surfing?","changedJa":"サーフィンをやってみたことがありますか？","from":"yoga","to":"surfing","question":"Ask me about a food I've tried.","questionJa":"私がある食べ物を食べたことがあるか尋ねてください。","example":"Have you ever tried sushi?"},{"id":"p41","n":41,"title":"I think …","meaning":"〜だと思う","base":"I think this is useful.","ja":"これは役に立つと思います。","changed":"I think this is important.","changedJa":"これは大切だと思います。","from":"useful","to":"important","question":"What do you think is important when learning English?","questionJa":"英語学習では何が大切だと思いますか？","example":"I think practice is important."},{"id":"p42","n":42,"title":"I don't think …","meaning":"〜だとは思わない","base":"I don't think it's difficult.","ja":"難しいとは思いません。","changed":"I don't think it's expensive.","changedJa":"高いとは思いません。","from":"difficult","to":"expensive","question":"Do you think learning English is impossible?","questionJa":"英語を学ぶのは不可能だと思いますか？","example":"I don't think it's impossible."},{"id":"p43","n":43,"title":"I guess …","meaning":"たぶん〜だと思う","base":"I guess he's busy.","ja":"たぶん彼は忙しいのだと思います。","changed":"I guess he's tired.","changedJa":"たぶん彼は疲れているのだと思います。","from":"busy","to":"tired","question":"Why do you think your friend isn't replying?","questionJa":"友人が返信してこないのはなぜだと思いますか？","example":"I guess she's busy."},{"id":"p44","n":44,"title":"I'm sure …","meaning":"きっと〜だ","base":"I'm sure we can do it.","ja":"きっと私たちならできます。","changed":"I'm sure we can finish this.","changedJa":"きっと私たちならこれを終えられます。","from":"do it","to":"finish this","question":"Encourage a friend who has a test.","questionJa":"テストを受ける友人を励ましてください。","example":"I'm sure you can do it."},{"id":"p45","n":45,"title":"I'm not sure …","meaning":"〜かどうか分からない","base":"I'm not sure it's open.","ja":"そこが開いているか分かりません。","changed":"I'm not sure it's available.","changedJa":"利用できるか分かりません。","from":"open","to":"available","question":"Do you know what the weather will be like tomorrow?","questionJa":"明日の天気を知っていますか？","example":"I'm not sure it will be sunny."},{"id":"p46","n":46,"title":"It seems …","meaning":"〜のようだ","base":"It seems quiet.","ja":"静かなようです。","changed":"It seems busy.","changedJa":"混んでいるようです。","from":"quiet","to":"busy","question":"How does the café look to you?","questionJa":"そのカフェはどんな様子に見えますか？","example":"It seems busy."},{"id":"p47","n":47,"title":"That sounds …","meaning":"それは〜そう","base":"That sounds fun.","ja":"それは楽しそうですね。","changed":"That sounds interesting.","changedJa":"それは面白そうですね。","from":"fun","to":"interesting","question":"I'm going to take a cooking class. What do you think?","questionJa":"料理教室に通うつもりです。どう思いますか？","example":"That sounds fun."},{"id":"p48","n":48,"title":"It depends on …","meaning":"〜による","base":"It depends on the weather.","ja":"天気によります。","changed":"It depends on the price.","changedJa":"値段によります。","from":"weather","to":"price","question":"Will you go out this weekend?","questionJa":"今週末は出かけますか？","example":"It depends on the weather."},{"id":"p49","n":49,"title":"Let's …","meaning":"一緒に〜しよう","base":"Let's take a break.","ja":"休憩しましょう。","changed":"Let's have lunch.","changedJa":"昼食を食べましょう。","from":"take a break","to":"have lunch","question":"Suggest something we can do together.","questionJa":"一緒にできることを提案してください。","example":"Let's go for a walk."},{"id":"p50","n":50,"title":"Why don't we …?","meaning":"〜しませんか","base":"Why don't we go by train?","ja":"電車で行きませんか？","changed":"Why don't we go by bus?","changedJa":"バスで行きませんか？","from":"train","to":"bus","question":"Suggest a way for us to get to the museum.","questionJa":"博物館への移動方法を提案してください。","example":"Why don't we take the train?"},{"id":"p51","n":51,"title":"How about …?","meaning":"〜はどうですか","base":"How about getting some tea?","ja":"お茶を飲むのはどうですか？","changed":"How about getting some coffee?","changedJa":"コーヒーを飲むのはどうですか？","from":"tea","to":"coffee","question":"Suggest something to do after lunch.","questionJa":"昼食の後にすることを提案してください。","example":"How about going for a walk?"},{"id":"p52","n":52,"title":"You should …","meaning":"〜したほうがよい","base":"You should take a break.","ja":"休憩したほうがよいです。","changed":"You should get some rest.","changedJa":"休んだほうがよいです。","from":"take a break","to":"get some rest","question":"I'm tired. Give me some simple advice.","questionJa":"疲れています。簡単なアドバイスをしてください。","example":"You should get some rest."},{"id":"p53","n":53,"title":"You don't need to …","meaning":"〜する必要はありません","base":"You don't need to hurry.","ja":"急ぐ必要はありません。","changed":"You don't need to worry.","changedJa":"心配する必要はありません。","from":"hurry","to":"worry","question":"A friend is worried about being a little early. Reassure them.","questionJa":"少し早く着くことを心配する友人を安心させてください。","example":"You don't need to worry."},{"id":"p54","n":54,"title":"We could …","meaning":"〜するのもよい","base":"We could eat here.","ja":"ここで食事をするのもよいですね。","changed":"We could meet here.","changedJa":"ここで会うのもよいですね。","from":"eat here","to":"meet here","question":"Suggest somewhere we could meet.","questionJa":"会う場所を提案してください。","example":"We could meet at the station."},{"id":"p55","n":55,"title":"Shall we …?","meaning":"〜しましょうか","base":"Shall we start?","ja":"始めましょうか？","changed":"Shall we leave?","changedJa":"出発しましょうか？","from":"start","to":"leave","question":"We're ready to go. Make a suggestion.","questionJa":"出発の準備ができました。提案してください。","example":"Shall we leave now?"},{"id":"p56","n":56,"title":"It's better to …","meaning":"〜するほうがよい","base":"It's better to book ahead.","ja":"前もって予約するほうがよいです。","changed":"It's better to arrive early.","changedJa":"早く到着するほうがよいです。","from":"book ahead","to":"arrive early","question":"Give a friend advice about a busy restaurant.","questionJa":"混んでいるレストランについて友人に助言してください。","example":"It's better to book ahead."},{"id":"p57","n":57,"title":"Where can I …?","meaning":"どこで〜できますか","base":"Where can I buy a ticket?","ja":"どこでチケットを買えますか？","changed":"Where can I buy some water?","changedJa":"どこで水を買えますか？","from":"a ticket","to":"some water","question":"Ask where you can get some coffee.","questionJa":"コーヒーを買える場所を尋ねてください。","example":"Where can I get some coffee?"},{"id":"p58","n":58,"title":"How do I …?","meaning":"どうやって〜しますか","base":"How do I get to the station?","ja":"駅にはどうやって行きますか？","changed":"How do I get to the museum?","changedJa":"博物館にはどうやって行きますか？","from":"station","to":"museum","question":"Ask how to use the ticket machine.","questionJa":"券売機の使い方を尋ねてください。","example":"How do I use this machine?"},{"id":"p59","n":59,"title":"How long does it take to …?","meaning":"〜するのにどのくらいかかりますか","base":"How long does it take to get there?","ja":"そこに着くまでどのくらいかかりますか？","changed":"How long does it take to walk to the station?","changedJa":"駅まで歩くのにどのくらいかかりますか？","from":"get there","to":"walk to the station","question":"Ask how long it takes to get to the airport.","questionJa":"空港までの所要時間を尋ねてください。","example":"How long does it take to get to the airport?"},{"id":"p60","n":60,"title":"Is there …?","meaning":"〜はありますか","base":"Is there a café?","ja":"カフェはありますか？","changed":"Is there a supermarket?","changedJa":"スーパーはありますか？","from":"a café","to":"a supermarket","question":"Ask if there's a restroom nearby.","questionJa":"近くにトイレがあるか尋ねてください。","example":"Is there a restroom near here?"},{"id":"p61","n":61,"title":"Do you have …?","meaning":"〜はありますか・持っていますか","base":"Do you have a menu?","ja":"メニューはありますか？","changed":"Do you have any rooms?","changedJa":"空いている部屋はありますか？","from":"a menu","to":"any rooms","question":"Ask if the shop has a smaller size.","questionJa":"その店に小さいサイズがあるか尋ねてください。","example":"Do you have a smaller size?"},{"id":"p62","n":62,"title":"I'm looking for …","meaning":"〜を探しています","base":"I'm looking for the exit.","ja":"出口を探しています。","changed":"I'm looking for a restaurant.","changedJa":"レストランを探しています。","from":"the exit","to":"a restaurant","question":"Tell me what kind of shop you're looking for.","questionJa":"どんな店を探しているか教えてください。","example":"I'm looking for a bookstore."},{"id":"p63","n":63,"title":"I'd like …","meaning":"〜をいただきたいです","base":"I'd like a sandwich.","ja":"サンドイッチをいただきたいです。","changed":"I'd like a coffee.","changedJa":"コーヒーをいただきたいです。","from":"a sandwich","to":"a coffee","question":"Order something to drink.","questionJa":"飲み物を注文してください。","example":"I'd like some tea, please."},{"id":"p64","n":64,"title":"Could you tell me …?","meaning":"〜を教えていただけますか","base":"Could you tell me the price?","ja":"値段を教えていただけますか？","changed":"Could you tell me the time?","changedJa":"時刻を教えていただけますか？","from":"price","to":"time","question":"Ask me where the station is.","questionJa":"駅の場所を丁寧に尋ねてください。","example":"Could you tell me where the station is?"},{"id":"p65","n":65,"title":"There's something wrong with …","meaning":"〜の調子が悪い","base":"There's something wrong with my phone.","ja":"私の電話の調子が悪いです。","changed":"There's something wrong with my computer.","changedJa":"私のパソコンの調子が悪いです。","from":"phone","to":"computer","question":"Tell me about a device that isn't working.","questionJa":"動かない機器について伝えてください。","example":"There's something wrong with my laptop."},{"id":"p66","n":66,"title":"I can't seem to …","meaning":"どうしても〜できない","base":"I can't seem to find the file.","ja":"どうしてもファイルが見つかりません。","changed":"I can't seem to find the email.","changedJa":"どうしてもメールが見つかりません。","from":"file","to":"email","question":"Tell me something you're having trouble finding.","questionJa":"見つけられず困っているものを教えてください。","example":"I can't seem to find my keys."},{"id":"p67","n":67,"title":"I forgot to …","meaning":"〜するのを忘れた","base":"I forgot to bring my umbrella.","ja":"傘を持ってくるのを忘れました。","changed":"I forgot to bring my notebook.","changedJa":"ノートを持ってくるのを忘れました。","from":"umbrella","to":"notebook","question":"What did you forget to do recently?","questionJa":"最近、何をし忘れましたか？","example":"I forgot to send an email."},{"id":"p68","n":68,"title":"I'm sorry for …","meaning":"〜についてごめんなさい","base":"I'm sorry for being late.","ja":"遅れてごめんなさい。","changed":"I'm sorry for the mistake.","changedJa":"間違いについてごめんなさい。","from":"being late","to":"the mistake","question":"Apologize for missing a call.","questionJa":"電話に出られなかったことを謝ってください。","example":"I'm sorry for missing your call."},{"id":"p69","n":69,"title":"Thanks for …","meaning":"〜してくれてありがとう","base":"Thanks for your help.","ja":"手伝ってくれてありがとう。","changed":"Thanks for waiting.","changedJa":"待ってくれてありがとう。","from":"your help","to":"waiting","question":"Thank a friend who helped you.","questionJa":"手伝ってくれた友人にお礼を言ってください。","example":"Thanks for helping me."},{"id":"p70","n":70,"title":"I didn't mean to …","meaning":"〜するつもりではなかった","base":"I didn't mean to interrupt.","ja":"邪魔するつもりではありませんでした。","changed":"I didn't mean to wake you up.","changedJa":"あなたを起こすつもりではありませんでした。","from":"interrupt","to":"wake you up","question":"You accidentally interrupted a friend. Explain.","questionJa":"うっかり友人の話を遮りました。説明してください。","example":"I didn't mean to interrupt you."},{"id":"p71","n":71,"title":"The problem is …","meaning":"問題は〜です","base":"The problem is the price.","ja":"問題は値段です。","changed":"The problem is the timing.","changedJa":"問題はタイミングです。","from":"price","to":"timing","question":"What is the main problem with your plan?","questionJa":"その計画の一番の問題は何ですか？","example":"The problem is we don't have enough time."},{"id":"p72","n":72,"title":"What I mean is …","meaning":"つまり言いたいのは〜","base":"What I mean is we need help.","ja":"つまり、私たちには助けが必要ということです。","changed":"What I mean is we need more time.","changedJa":"つまり、私たちにはもっと時間が必要ということです。","from":"help","to":"more time","question":"Clarify that you need more time, not more money.","questionJa":"お金ではなく時間がもっと必要だと説明してください。","example":"What I mean is we need more time."},{"id":"p73","n":73,"title":"I was wondering if …","meaning":"〜かなと思っていたのですが","base":"I was wondering if you could help.","ja":"手伝っていただけるかなと思っていたのですが。","changed":"I was wondering if you could call me.","changedJa":"お電話いただけるかなと思っていたのですが。","from":"help","to":"call me","question":"Ask politely if I can check your report.","questionJa":"報告書を確認してもらえるか丁寧に尋ねてください。","example":"I was wondering if you could check my report."},{"id":"p74","n":74,"title":"All I need is …","meaning":"必要なのは〜だけ","base":"All I need is a pen.","ja":"必要なのはペンだけです。","changed":"All I need is a little time.","changedJa":"必要なのは少しの時間だけです。","from":"a pen","to":"a little time","question":"What is the one thing you need now?","questionJa":"今、ひとつだけ必要なものは何ですか？","example":"All I need is a cup of coffee."},{"id":"p75","n":75,"title":"The best part is …","meaning":"一番よいのは〜","base":"The best part is the food.","ja":"一番よいのは食事です。","changed":"The best part is the view.","changedJa":"一番よいのは景色です。","from":"food","to":"view","question":"What is the best part of a trip?","questionJa":"旅行の一番よいところは何ですか？","example":"The best part is trying new food."},{"id":"p76","n":76,"title":"It's easy to …","meaning":"〜するのは簡単","base":"It's easy to use this app.","ja":"このアプリは簡単に使えます。","changed":"It's easy to use this website.","changedJa":"このウェブサイトは簡単に使えます。","from":"app","to":"website","question":"What is easy for you to do?","questionJa":"あなたにとって簡単なことは何ですか？","example":"It's easy to make tea."},{"id":"p77","n":77,"title":"It's hard to …","meaning":"〜するのは難しい","base":"It's hard to hear you.","ja":"あなたの声が聞こえにくいです。","changed":"It's hard to concentrate.","changedJa":"集中するのが難しいです。","from":"hear you","to":"concentrate","question":"What is hard about learning English?","questionJa":"英語学習で難しいことは何ですか？","example":"It's hard to understand fast speech."},{"id":"p78","n":78,"title":"It takes me … to …","meaning":"〜するのに…かかる","base":"It takes me an hour to get to work.","ja":"通勤に1時間かかります。","changed":"It takes me thirty minutes to get to work.","changedJa":"通勤に30分かかります。","from":"an hour","to":"thirty minutes","question":"How long does it take you to get ready in the morning?","questionJa":"朝の準備にどのくらいかかりますか？","example":"It takes me twenty minutes to get ready."},{"id":"p79","n":79,"title":"As long as …","meaning":"〜である限り","base":"As long as it's safe, I'm happy.","ja":"安全である限り、私は満足です。","changed":"As long as it's quiet, I'm happy.","changedJa":"静かである限り、私は満足です。","from":"safe","to":"quiet","question":"What matters to you when choosing a hotel?","questionJa":"ホテルを選ぶときに何が大切ですか？","example":"As long as it's clean, I'm happy."},{"id":"p80","n":80,"title":"Even if …","meaning":"たとえ〜でも","base":"Even if it rains, I'll go.","ja":"たとえ雨でも、行きます。","changed":"Even if it snows, I'll go.","changedJa":"たとえ雪でも、行きます。","from":"rains","to":"snows","question":"Will you keep practicing when you're busy?","questionJa":"忙しくても練習を続けますか？","example":"Even if I'm busy, I'll practice."}];const $=id=>document.getElementById(id);const key='patternPocket.kids.v1';let progress={};try{progress=JSON.parse(localStorage.getItem(key)||'{}');if(!progress||typeof progress!=='object'||Array.isArray(progress))progress={}}catch{progress={}}let index=0,step=0,answered=false;const options=$('pattern');patterns.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+'｜'+p.title+'　'+p.meaning;options.append(o)});function save(){try{localStorage.setItem(key,JSON.stringify(progress))}catch{}}function stats(){const done=patterns.filter(p=>progress[p.id]).length;$('completed').textContent=done+' / 80';$('stars').textContent=done*3+' ⭐'}function speak(t){if(!('speechSynthesis'in window)){feedback('このブラウザでは音声を再生できません。英文を見て読んでね。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function feedback(t){$('feedback').textContent=t;$('feedback').classList.remove('hidden')}function reset(){answered=false;$('feedback').classList.add('hidden');$('next').disabled=false;const p=patterns[index],box=$('exercise');box.replaceChildren();document.querySelectorAll('.dots i').forEach((x,i)=>x.classList.toggle('on',i<=step));const label=document.createElement('div');label.className='step';label.textContent=['STEP 1 / きいてみよう','STEP 2 / いみをえらぼう','STEP 3 / まねして言おう','STEP 4 / じぶんの言葉にしよう'][step];box.append(label);const big=document.createElement('div');big.className='big';const small=document.createElement('div');small.className='meaning';if(step===0){big.textContent='まずは耳だけで！';small.textContent='「英語をきく」を押して、聞こえた音をまねしてみよう。'}if(step===1){big.textContent='どんないみかな？';small.textContent='聞いた英文にあう日本語をえらぼう。'}if(step===2){big.textContent=p.base;small.textContent=p.ja;}if(step===3){big.textContent=p.title;small.textContent=p.meaning+'　この型を使って、自分の文を言ってみよう。';}box.append(big,small);$('hear').textContent='🔊 英語をきく';$('next').textContent=step===3?'クリアする ⭐':'つぎへ →';if(step===1){const wrap=document.createElement('div');wrap.className='options';const others=patterns.filter(x=>x.id!==p.id&&x.ja!==p.ja).slice((index*7)%Math.max(1,patterns.length-3),(index*7)%Math.max(1,patterns.length-3)+2);const choices=[{text:p.ja,ok:true},...others.map(x=>({text:x.ja,ok:false}))].sort((a,b)=>((a.text.length*13+index)%17)-((b.text.length*13+index)%17));choices.forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.text;b.onclick=()=>{if(answered||b.disabled)return;b.classList.add(o.ok?'good':'bad');if(o.ok){answered=true;feedback('🎉 せいかい！');$('next').disabled=false;}else{b.disabled=true;answered=false;feedback('もういちど聞いてみよう。ヒント：英語をきくボタンを押してみてね。');$('next').disabled=true;}};wrap.append(b)});box.append(wrap)}if(step===3){const q=document.createElement('p');q.textContent='たとえば：'+p.example;box.append(q)}}$('hear').onclick=()=>speak(patterns[index].base);$('next').onclick=()=>{if(step===1&&!answered){feedback('日本語をひとつえらんでね。');return}if(step<3){step++;reset()}else{progress[patterns[index].id]=true;save();stats();feedback('🎉 クリア！ 星を3つゲット！ つぎの型にもチャレンジしよう。');$('next').textContent='つぎの型へ →';$('next').onclick=()=>{index=(index+1)%80;options.value=index;step=0;reset()}}};options.onchange=()=>{index=Number(options.value);step=0;reset()};stats();const first=patterns.findIndex(p=>!progress[p.id]);index=first<0?0:first;options.value=index;reset();
</script></body></html>
